<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corpus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    h1 { font-size: 1.375rem; font-weight: 600; margin: 0 0 0.25rem; }
    #status { color: #666; font-size: 0.8125rem; margin: 0 0 1.25rem; min-height: 1.25em; }
    #query {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    #query:focus { border-color: #555; }
    #query:disabled { background: #f5f5f5; cursor: not-allowed; }
    #results { margin-top: 1.5rem; }
    .result {
      border-top: 1px solid #eee;
      padding: 0.875rem 0;
    }
    .result-label { margin: 0 0 0.25rem; font-size: 0.9375rem; font-weight: 500; }
    .result-text { margin: 0 0 0.375rem; color: #444; font-size: 0.8125rem; }
    .result-meta { color: #999; font-size: 0.75rem; }
    .empty { color: #aaa; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1 id="domain-name">Corpus</h1>
  <p id="status">Initializing…</p>
  <input type="search" id="query" placeholder="Search the corpus…" disabled autocomplete="off">
  <div id="results"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
