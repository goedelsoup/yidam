# mise.yidam.toml — yidam CLI tasks for a derived repository.
#
# This is the INHERITED task layer. Pull it into your mise.toml with:
#
#   [task_config]
#   includes = ["mise.yidam.toml", "mise.overrides.toml"]
#
# A task defined here cannot be overridden from mise.toml: a task in an include
# beats one in the config that includes it, and the later include wins. To
# replace or refuse one of these, define it in mise.overrides.toml, which comes
# after this file and which a vendor update never touches.
#
# This is a mise *task file*, not a standalone config: tables are task names
# directly (`[graph-check]`, not `[tasks.graph-check]`) and it carries no
# `[tools]` section — the toolchain belongs in mise.toml. It also carries no
# `[env]`: in a task file that declares a task named `env`, not an environment.
# Loading this as a config (`MISE_ENV=yidam`) will not work. Nor will a top-level
# `extends`: mise accepts `extends` on an individual task, never on a config
# file, and silently orphans every task here if you try it.
#
# Keep domain tasks in mise.toml, not here: `mise run yidam-vendor-update` may
# replace this file wholesale, and anything you wrote in it would go with it.
#
# Run `mise run yidam-build` once to install the yidam binary. Then use
# `mise run regen` to regenerate all README indexes.

# ── yidam CLI — build ─────────────────────────────────────────────────
# The CLI is NOT vendored into derived repos — a vendored copy is a fork that
# never gets rebuilt. It is installed from the origin commit pinned in
# .yidam.toml, so the binary and the vendored prelude always agree.
#
# INSTALLED INTO THIS REPOSITORY, at .yidam/bin/, beside the pin it is built
# from. It used to go to ~/.cargo/bin, which is one location per machine while
# the pin is one per repository — so on a machine with two yidam repositories it
# was last-writer-wins, and the sentence above held for exactly one of them. The
# other ran a binary that did not match its own vendored prelude, and nothing
# anywhere said so.
#
# Putting .yidam/bin ahead on PATH is what makes the shell and the editor resolve
# the same binary. That declaration lives in YOUR mise.toml, not here:
#
#   [env]
#   _.path = [".yidam/bin"]
#
# It cannot live in this file. A task file has no `[env]` section — mise reads
# `[env]` here as a task *named* env and rejects `_.path` as an unknown field,
# which orphans every task in the file. It sat here for exactly that long.

[yidam-build]
description = "Install the yidam binary from the commit pinned in .yidam.toml."
# No `tools` here, deliberately. Everything this task does itself downloads an
# already-compiled binary; the compiler belongs to [yidam-build-source] below,
# which step 4 hands off to, so it is provisioned only when compiling actually
# happens. It used to sit unconditionally in the derived repository's `[tools]`,
# where every machine paid for it whether or not anything was ever built.
#
# `tools` as a task FIELD is legal in this file; `[tools]` as a table is not —
# mise reads that as a task NAMED tools and fails the whole include to parse.
# See task_layer.rs.
run = """
set -eu
if [ ! -f .yidam.toml ]; then
  echo "ERROR: no .yidam.toml — this repo has no recorded yidam provenance." >&2
  echo "       run 'mise run yidam-vendor-update' to create one." >&2
  exit 1
fi
origin=$(sed -n 's/^ *origin *= *"\\(.*\\)"/\\1/p' .yidam.toml)
commit=$(sed -n 's/^ *commit *= *"\\(.*\\)"/\\1/p' .yidam.toml)
# Features this repository's binary must have, from `[build] features` in .yidam.toml.
# One declaration, read by both channels: the source build passes it to cargo, and the
# download below declines a release that was not built with it.
#
# A single-line array only. That is what the file's own writer emits, and a parser for the
# multi-line form would be a TOML parser written in sed.
required=$(sed -n 's/^ *features *= *\\[\\(.*\\)\\]/\\1/p' .yidam.toml | tr -d '" ' | tr ',' ' ')
if [ -z "$commit" ] || [ "$commit" = "unknown" ]; then
  echo "ERROR: .yidam.toml records no resolvable commit." >&2
  echo "       repair it with 'mise run yidam-vendor-update'." >&2
  exit 1
fi
# ── 1. Can this pin be downloaded? ────────────────────────────────────
#
# A release is tagged; a pin is a commit. Rather than adding a version field
# to .yidam.toml — VERSIONING.md argues against a third pin, as "a third thing
# to get out of step" — ask the origin whether any cli/v* tag points AT this
# commit. `git ls-remote` needs no API token and no rate limit, and works
# against any git origin rather than only GitHub's API.
#
# The ^{} entries are the point. `git tag -s` makes an ANNOTATED tag, whose
# refs/tags/<x> line carries the sha of the tag OBJECT, not of the commit; the
# peeled refs/tags/<x>^{} line carries the commit. Matching the bare line would
# therefore never match a signed release, and the failure is silent — it just
# compiles, forever, and looks like there was no release.
resolve_tag='
  { ref = $2; sub(/^refs\\/tags\\//, "", ref)
    if (ref ~ /\\^\\{\\}$/) { sub(/\\^\\{\\}$/, "", ref); sha[ref] = $1 }
    else if (!(ref in sha)) sha[ref] = $1 }
  END { for (t in sha) if (sha[t] == c) { print t; exit } }'
#
# The trailing `*` in the refspec is load-bearing and is NOT a convenience for
# matching many tags. `git ls-remote` filters by pattern BEFORE the peeled refs
# are emitted, so a pattern naming one tag exactly returns only its bare line:
#
#   $ git ls-remote --tags <origin> 'cli/v0.2.0'
#   fe01247…  refs/tags/cli/v0.2.0          <- tag object only
#   $ git ls-remote --tags <origin> 'cli/v*'
#   fe01247…  refs/tags/cli/v0.2.0
#   ee3a7f6…  refs/tags/cli/v0.2.0^{}       <- the commit, and only with the glob
#
# So "tightening" this to the tag being looked for would delete the very line the
# resolver decides on, and the symptom is not an error — it is a download path
# that never fires again.
tag=$(git ls-remote --tags "$origin" 'cli/v*' 2>/dev/null \\
      | awk -v c="$commit" "$resolve_tag" || true)

# ── 2. Which artifact would this machine want? ────────────────────────
case "$(uname -s)" in
  Darwin) os=apple-darwin ;;
  Linux)  os=unknown-linux-gnu ;;
  *)      os="" ;;
esac
case "$(uname -m)" in
  arm64|aarch64) arch=aarch64 ;;
  x86_64|amd64)  arch=x86_64 ;;
  *)             arch="" ;;
esac

# ── 3. Download, if there is something to download ────────────────────
#
# Every failure here falls through to the source build rather than aborting.
# A release that is missing, a platform that was never built, a network that is
# not there — none of them are reasons a repository cannot have its binary, and
# the compile path is the one that has always worked.
installed=""
if [ -n "$tag" ] && [ -n "$os" ] && [ -n "$arch" ]; then
  repo=$(echo "$origin" | sed -e 's|^git@github.com:|https://github.com/|' -e 's|\\.git$||')
  name="yidam-${tag#cli/v}-${arch}-${os}"
  url="$repo/releases/download/$tag/$name.tar.gz"
  dl=$(mktemp -d)
  if curl -fsSL "$url" -o "$dl/$name.tar.gz" \\
     && curl -fsSL "$url.sha256" -o "$dl/$name.tar.gz.sha256"; then
    # Verify before trusting. `shasum` is on macOS and on the GitHub Linux
    # images; sha256sum is the GNU spelling. If neither exists we do not skip
    # the check — we decline the download and compile instead.
    if command -v shasum >/dev/null 2>&1; then
      ( cd "$dl" && shasum -a 256 -c "$name.tar.gz.sha256" >/dev/null 2>&1 ) && verified=1 || verified=0
    elif command -v sha256sum >/dev/null 2>&1; then
      ( cd "$dl" && sha256sum -c "$name.tar.gz.sha256" >/dev/null 2>&1 ) && verified=1 || verified=0
    else
      verified=0
    fi
    if [ "$verified" = 1 ]; then
      mkdir -p "$PWD/.yidam/bin"
      tar -xzf "$dl/$name.tar.gz" -C "$dl"
      install -m 0755 "$dl/$name/yidam" "$PWD/.yidam/bin/yidam"
      # ── does this release do what this repository needs? ────────────────
      #
      # The release is built from the `default` feature set. A repository that
      # needs more than that — `export-sqlite`, `index`, anything a future
      # release does not carry — would otherwise have a working build silently
      # replaced by a binary that answers `needs --features …`. The commands
      # do not fail; they decline, and a test written to skip when a capability
      # is absent goes on passing while asserting nothing. That is #532, and it
      # was reported by a derived repository that spotted it before adopting.
      #
      # Asked of the binary rather than predicted from the tag: `--version`
      # prints the feature list it was compiled with, so this is the one place
      # the answer is a fact rather than an expectation.
      short=""
      if [ -n "$required" ]; then
        have=" $("$PWD/.yidam/bin/yidam" --version 2>/dev/null | sed -n 's/.*\\[\\(.*\\)\\].*/\\1/p') "
        for f in $required; do
          case "$have" in *" $f "*) ;; *) short="$short $f" ;; esac
        done
      fi
      if [ -n "$short" ]; then
        echo "release $tag was built without:$short" >&2
        echo "  .yidam.toml [build] features requires it — compiling instead." >&2
        rm -f "$PWD/.yidam/bin/yidam"
      else
        installed="$tag"
      fi
    else
      echo "checksum did not verify for $name — compiling instead" >&2
    fi
  fi
  rm -rf "$dl"
fi

if [ -n "$installed" ]; then
  echo
  echo "installed .yidam/bin/yidam from release $installed ($commit)"
  "$PWD/.yidam/bin/yidam" --version
  echo "Put .yidam/bin first on PATH — [env] _.path in mise.toml covers anything mise"
  echo "runs; a script or CI step that builds PATH by hand has to do it itself, or a"
  echo "yidam from somewhere else will answer for this repository."
  exit 0
fi

# ── 4. Otherwise, build it ────────────────────────────────────────────
#
# Not a fallback that will one day be removed. A repository is entitled to pin a
# commit that was never released, and most commits are.
#
# Handed to [yidam-build-source] rather than done here, for one reason: that task
# declares `tools = { rust = ... }` and mise provisions a task's tools when the
# task runs. Everything above this line downloads a compiled binary and needs no
# compiler, so a declaration on THIS task would provision a Rust toolchain on
# every run and then not use it on the path most repositories take.
#
# The pin crosses the boundary in the environment. The sub-task refuses to guess
# either value: a source build that quietly defaulted to origin/HEAD would
# install a binary that is not this repository's pin, which is the failure
# `.yidam/bin` exists to prevent.
if [ -n "$tag" ]; then
  echo "release $tag exists for this pin but could not be used — building from source" >&2
else
  echo "no release tagged at this pin — building from source" >&2
fi
YIDAM_SOURCE_ORIGIN="$origin" YIDAM_SOURCE_COMMIT="$commit" mise run yidam-build-source
"""

# The compiling half of `yidam-build`, and the only part of provisioning a derived
# repository that needs a Rust toolchain.
#
# Separate from yidam-build so that `tools` below is reached only when a source
# build actually happens. Verified: with rust declared on a task rather than in
# `[tools]`, `mise install` answers "all tools are installed" and provisions
# nothing; the toolchain arrives when the task runs, and a task that is never
# invoked never installs it.
#
# Not meant to be run by hand — `mise run yidam-build` is the entry point, and it
# is the one that decides whether compiling is necessary. This refuses rather than
# guesses if invoked without a pin, because the whole point of .yidam/bin is that
# the binary matches the commit .yidam.toml records.
[yidam-build-source]
description = "Compile the yidam binary from a pinned commit. Invoked by yidam-build; provisions Rust only here."
tools = { rust = "1.88.0" }
run = """
set -eu
origin="${YIDAM_SOURCE_ORIGIN:-}"
commit="${YIDAM_SOURCE_COMMIT:-}"
if [ -z "$origin" ] || [ -z "$commit" ]; then
  echo "ERROR: yidam-build-source needs YIDAM_SOURCE_ORIGIN and YIDAM_SOURCE_COMMIT." >&2
  echo "       Run 'mise run yidam-build', which reads them from .yidam.toml and" >&2
  echo "       decides whether a source build is needed at all." >&2
  exit 1
fi
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git clone --quiet --filter=blob:none "$origin" "$tmp/yidam"
git -C "$tmp/yidam" checkout --quiet "$commit"
# The light `reports` build: no fastembed, no ONNX runtime. Add
# `--features full` if you need index-build or sqlite export. NOT tonpa,
# vault-s3 or export-graph — each joined the `default` set (#203, #482, #532),
# so the released binary carries them and so does this build.
#
# Anything else this repository needs, declare in `.yidam.toml`'s `[build]
# features` rather than editing this line: that is the one place both channels
# read, and it is what stops a re-vendor swapping this build for a release that
# cannot do what it does. See the note on the `[tools]` block in mise.toml.
#
# --root: install here rather than into ~/.cargo/bin. `cargo install --root DIR`
# writes DIR/bin/, so this lands at .yidam/bin/yidam.
# --force: without it cargo refuses with "binary yidam already exists in
# destination" (exit 101) whenever .yidam/bin holds a binary its own install
# metadata does not account for. .yidam/bin/ is git-ignored and the metadata
# beside it is not, so the two drift apart on any fresh clone or hand-copied
# binary — and this task, whose whole job is to make the binary match the pin,
# would fail rather than do it.
# `[build] features` from .yidam.toml, the same declaration the download path reads. A
# repository that needs a non-default feature says so once, here, rather than editing this
# task — which a re-vendor would replace.
features=""
if [ -f .yidam.toml ]; then
  want=$(sed -n 's/^ *features *= *\\[\\(.*\\)\\]/\\1/p' .yidam.toml | tr -d '" ' | tr ',' ' ')
  if [ -n "$want" ]; then
    features="--features $(echo $want | tr ' ' ',')"
    echo "building with $features (from .yidam.toml [build] features)"
  fi
fi
cargo install --force --root "$PWD/.yidam" --path "$tmp/yidam/yidam/cli" --locked $features
echo
echo "installed .yidam/bin/yidam @ $commit"
echo "Put .yidam/bin first on PATH — [env] _.path in mise.toml covers anything mise"
echo "runs; a script or CI step that builds PATH by hand has to do it itself, or a"
echo "yidam from somewhere else will answer for this repository."
"""

# ── vendored prelude — status and update ──────────────────────────────
# The prelude is not frozen at the repo's birth. These two tasks are how a
# correction made upstream reaches this repository.

[yidam-vendor-status]
description = "Show the pinned yidam commit and whether a newer cli/v* release exists (or YIDAM_REF, if set)."
run = """
set -eu
if [ ! -f .yidam.toml ]; then
  echo "no .yidam.toml — this repo has no recorded yidam provenance"
  exit 1
fi
origin=$(sed -n 's/^ *origin *= *"\\(.*\\)"/\\1/p' .yidam.toml)
commit=$(sed -n 's/^ *commit *= *"\\(.*\\)"/\\1/p' .yidam.toml)
template=$(sed -n 's/^ *template *= *"\\(.*\\)"/\\1/p' .yidam.toml)
committed=$(sed -n 's/^ *committed *= *"\\(.*\\)"/\\1/p' .yidam.toml)
echo "origin    $origin"
echo "pinned    $commit ($template, committed $committed)"
# What a re-vendor would adopt, asked the way yidam-vendor-update asks it: the newest
# `cli/v*` release unless YIDAM_REF names something else (#1308). Measured against the
# origin's HEAD, this reported "origin has moved" on almost every run — main is rarely
# tagged — and told the operator to run an update that, by default, now changes nothing.
# NEWEST-RELEASE BEGIN
# The newest `cli/vX.Y.Z` tag at an origin, as `<tag> <commit>`; nothing if it has none.
# By version, not by date: `releases/latest` and tag dates span four layers. The peeled
# `^{}` line is the commit of an annotated (signed) tag, so it wins over the bare line,
# and the refspec globs because ls-remote emits peeled lines only for a glob.
# No backslashes, for the reason the tools block gives.
newest_release() {
  git ls-remote --tags "$1" 'refs/tags/cli/v*' 2>/dev/null | awk '
    { ref = substr($2, 11); peeled = 0
      if (substr(ref, length(ref) - 2) == "^{}") { ref = substr(ref, 1, length(ref) - 3); peeled = 1 }
      if (ref !~ "^cli/v[0-9]+[.][0-9]+[.][0-9]+$") next
      if (peeled || !(ref in sha)) sha[ref] = $1 }
    END { for (t in sha) print substr(t, 6), t, sha[t] }
  ' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 | cut -d' ' -f2,3
}
# NEWEST-RELEASE END
if [ -n "${YIDAM_REF:-}" ]; then
  ref="$YIDAM_REF"
  # `head -n1`: `git ls-remote <url> HEAD` can match more than one ref — HEAD itself and
  # a refs/remotes/origin/HEAD the origin happens to carry — and every extra line went
  # into $remote, so the equality test below could never be true. This task reported
  # "origin has moved" unconditionally, including when the pin was exactly current.
  remote=$(git ls-remote "$origin" "$ref" 2>/dev/null | cut -f1 | head -n1)
else
  release=$(newest_release "$origin")
  ref="${release%% *}"
  remote="${release#* }"
  if [ -z "$release" ]; then
    # An origin with no release at all — a fork, say — has only HEAD to offer.
    ref=HEAD
    remote=$(git ls-remote "$origin" HEAD 2>/dev/null | cut -f1 | head -n1)
  fi
fi
if [ -z "$remote" ]; then
  echo "remote    unreachable — cannot compare"
  exit 0
fi
echo "$ref  $remote"
if [ "$remote" = "$commit" ]; then
  echo
  echo "up to date"
  exit 0
fi
# "Has moved" is a boolean, and a boolean is not enough to act on. How far, how old,
# and — the part that actually costs something — whether the CLOSED COMMIT VOCABULARY
# changed, because that is what this repository has already written history against
# and history cannot be rewritten to match a verb.
#
# The clone happens only on this branch: the ls-remote above answers the common case
# for free, and nobody pays for a fetch to be told they are current.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
if ! git clone --quiet --filter=blob:none --no-checkout "$origin" "$tmp/y" 2>/dev/null; then
  echo
  echo "$ref is not the pin — run 'mise run yidam-vendor-update' to adopt it"
  echo "(could not fetch $origin for detail)"
  exit 0
fi
# A pin taken with YIDAM_REF=HEAD is usually AHEAD of the newest release. That is not
# staleness, and telling the operator to "adopt" a release would be telling them to roll
# back — which yidam-vendor-update refuses to do without being asked.
if git -C "$tmp/y" merge-base --is-ancestor "$remote" "$commit" 2>/dev/null; then
  echo
  echo "pinned ahead of $ref — nothing to adopt until a newer release"
  exit 0
fi
echo
echo "$ref is newer than the pin — run 'mise run yidam-vendor-update' to adopt it"
behind=$(git -C "$tmp/y" rev-list --count "$commit..$remote" 2>/dev/null || echo 0)
pinned_at=$(git -C "$tmp/y" log -1 --format=%at "$commit" 2>/dev/null || echo "")
if [ -n "$pinned_at" ]; then
  days=$(( ( $(date +%s) - pinned_at ) / 86400 ))
  echo
  echo "behind    $behind commit(s), pinned $days day(s) ago"
fi
moved=$(git -C "$tmp/y" diff --name-only "$commit" "$remote" -- yidam/prelude/ 2>/dev/null | wc -l | tr -d ' ')
echo "prelude   $moved file(s) changed since the pin"
# The verbs, and only the verbs. A row is a verb because its table's header is
# `| Verb | When |`, not because its first cell is a backticked lowercase word.
# GRAPH.md carries tables of ref namespaces, directories and `edge_policy` values
# in exactly that shape, and the first version of this read all of them: a derived
# repo's update announced the two `edge_policy` values as new commit verbs, which
# teaches the operator to skip the line that matters. `yidam vocabulary` anchors on
# the same header and cannot stand in here — these verbs come out of two git
# revisions of the file, neither of them the checked-out one.
verbs_from_graph() {
  awk -F'|' '
    /^[[:space:]]*\\|/ {
      h = $2; w = $3
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", h)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", w)
      if (tolower(h) == "verb" && tolower(w) == "when") { t = 1; next }
      if (!t) next
      if (h ~ /^[-:]+$/) next
      gsub(/`/, "", h)
      if (h ~ /^[a-z]+$/) print h
      next
    }
    { t = 0 }
  ' | sort -u
}
if git -C "$tmp/y" diff --name-only "$commit" "$remote" -- yidam/prelude/GRAPH.md 2>/dev/null | grep -q .; then
  before="$tmp/vb"; after="$tmp/va"
  git -C "$tmp/y" show "$commit:yidam/prelude/GRAPH.md" 2>/dev/null \\
    | verbs_from_graph > "$before" || true
  git -C "$tmp/y" show "$remote:yidam/prelude/GRAPH.md" 2>/dev/null \\
    | verbs_from_graph > "$after" || true
  added=$(comm -13 "$before" "$after" || true)
  removed=$(comm -23 "$before" "$after" || true)
  if [ -n "$added" ] || [ -n "$removed" ]; then
    echo
    echo "the closed commit vocabulary moved:"
    [ -n "$added" ]   && printf '%s\\n' "$added"   | sed 's/^/  + /'
    [ -n "$removed" ] && printf '%s\\n' "$removed" | sed 's/^/  - /'
  fi
fi
"""

[yidam-vendor-update]
description = "Re-vendor .yidam/.vendor/prelude/ at the newest cli/v* release and re-pin .yidam.toml. Set YIDAM_REF to target another tag, branch or HEAD."
run = """
set -eu
origin="git@github.com:goedelsoup/yidam.git"
if [ -f .yidam.toml ]; then
  found=$(sed -n 's/^ *origin *= *"\\(.*\\)"/\\1/p' .yidam.toml)
  [ -n "$found" ] && origin="$found"
fi
# NEWEST-RELEASE BEGIN
# The newest `cli/vX.Y.Z` tag at an origin, as `<tag> <commit>`; nothing if it has none.
# By version, not by date: `releases/latest` and tag dates span four layers. The peeled
# `^{}` line is the commit of an annotated (signed) tag, so it wins over the bare line,
# and the refspec globs because ls-remote emits peeled lines only for a glob.
# No backslashes, for the reason the tools block gives.
newest_release() {
  git ls-remote --tags "$1" 'refs/tags/cli/v*' 2>/dev/null | awk '
    { ref = substr($2, 11); peeled = 0
      if (substr(ref, length(ref) - 2) == "^{}") { ref = substr(ref, 1, length(ref) - 3); peeled = 1 }
      if (ref !~ "^cli/v[0-9]+[.][0-9]+[.][0-9]+$") next
      if (peeled || !(ref in sha)) sha[ref] = $1 }
    END { for (t in sha) print substr(t, 6), t, sha[t] }
  ' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 | cut -d' ' -f2,3
}
# NEWEST-RELEASE END
# The ref to adopt: the newest `cli/v*` release, unless YIDAM_REF names one (#1308).
#
# A release, because a release is the pin `yidam-build` can DOWNLOAD. A pin on an
# untagged commit compiles the CLI from a clone on every machine, in every repository
# that takes it — ~560 crates, cold, under cargo's machine-wide package-cache lock, so
# three repositories building at once queue behind each other. Main is rarely tagged,
# so pinning HEAD made that the common path rather than the exception.
#
# An unreleased commit is still a pin a repository is entitled to: YIDAM_REF=HEAD (or a
# sha, branch or tag) asks for it, and yidam-build compiles it as before.
# RESOLVE-REF BEGIN
if [ -n "${YIDAM_REF:-}" ]; then
  ref="$YIDAM_REF"
else
  release=$(newest_release "$origin")
  ref="${release%% *}"
  if [ -z "$release" ]; then
    echo "no cli/v* release at $origin — pinning its HEAD, which 'mise run yidam-build' compiles" >&2
    ref=HEAD
  fi
fi
# RESOLVE-REF END
# The pin being replaced, captured before .yidam.toml is overwritten below. It is what
# makes the vocabulary report at the end possible.
previous=""
# `[build] features` is the repository's, not yidam's, and this task overwrites .yidam.toml
# wholesale. Read it out before that happens and write it back below, or a re-vendor would
# silently delete the declaration that keeps the download path honest.
required=""
if [ -f .yidam.toml ]; then
  previous=$(sed -n 's/^ *commit *= *"\\(.*\\)"/\\1/p' .yidam.toml)
  required=$(sed -n 's/^ *features *= *\\[\\(.*\\)\\]/\\1/p' .yidam.toml | tr -d '" ' | tr ',' ' ')
fi
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "fetching $origin at $ref …"
git clone --quiet --filter=blob:none "$origin" "$tmp/yidam"
if [ "$ref" != "HEAD" ]; then
  git -C "$tmp/yidam" checkout --quiet "$ref"
fi
commit=$(git -C "$tmp/yidam" rev-parse HEAD)
# NO-ROLLBACK BEGIN
# Never a silent step backwards. A repository pinned with YIDAM_REF=HEAD sits ahead of
# the newest release, and the default above would quietly re-vendor it to an older prelude
# and binary. Moving back is allowed, but only when asked for by name. A previous pin the
# clone does not hold (another origin, or "unknown") cannot be ordered, so it is not judged.
if [ -z "${YIDAM_REF:-}" ] && [ -n "$previous" ] && [ "$previous" != "$commit" ] \
   && git -C "$tmp/yidam" cat-file -e "$previous^{commit}" 2>/dev/null \
   && ! git -C "$tmp/yidam" merge-base --is-ancestor "$previous" "$commit"; then
  echo "ERROR: this repository is pinned at $previous, which $ref ($commit) does not contain." >&2
  echo "       Re-vendoring to the newest release would move it backwards. Either:" >&2
  echo "         YIDAM_REF=HEAD mise run yidam-vendor-update    # stay on unreleased main (compiles)" >&2
  echo "         YIDAM_REF=$ref mise run yidam-vendor-update    # take the release, deliberately" >&2
  exit 1
fi
# NO-ROLLBACK END
template=$(git -C "$tmp/yidam" describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || echo untagged)
committed=$(git -C "$tmp/yidam" log -1 --format=%as HEAD)
if [ ! -d "$tmp/yidam/yidam/prelude" ]; then
  echo "ERROR: $origin@$commit has no yidam/prelude/ — wrong origin?" >&2
  exit 1
fi
# ── source packs, and the version each pin asked for (RFC-0048) ─
#
# `prelude_sources` in .yidam/decisions/proposals.yml pins each pack this repository
# vendors: `<pack>@<range>` names one the template ships in `yidam/sources/`, and
# `<pack>@<range> from <repo>@<commit>` names one another corpus wrote in its own
# `.yidam/sources/`. Each is copied wholesale into .yidam/.vendor/sources/, and the copy
# records the pin it satisfied under `[vendored]`.
#
# A commit holds exactly one version of a pack, so a range is checked against it and
# never resolved: this task does not go looking for a version that would satisfy it.
# A pin it cannot satisfy refuses the whole update, and it runs before the prelude is
# replaced, so a refusal leaves this repository as it was. No pins, or no record,
# vendors none.
#
# No backslashes, for the reason the tools block gives. `satisfies` is the grammar
# `yidam source check` reads (src/sources/version.rs); tests/task_layer.rs holds the two
# to one table.
# VENDOR-SOURCES BEGIN
# SATISFIES BEGIN
satisfies() {
  awk -v v="$1" -v r="$2" '
    function digits(s) { return s != "" && s !~ /[^0-9]/ }
    BEGIN {
      if (split(v, a, ".") != 3 || !digits(a[1]) || !digits(a[2]) || !digits(a[3])) exit 1
      op = substr(r, 1, 1)
      if (op == "^" || op == "~" || op == "=") rest = substr(r, 2)
      else { op = "^"; rest = r }
      n = split(rest, b, ".")
      if (n < 1 || n > 3) exit 1
      for (i = 1; i <= n; i++) if (!digits(b[i])) exit 1
      for (i = n + 1; i <= 3; i++) b[i] = 0
      l1 = b[1] + 0; l2 = b[2] + 0; l3 = b[3] + 0
      if (op == "=" && n == 3) { h1 = l1; h2 = l2; h3 = l3 + 1 }
      else if ((op == "=" || op == "~") && n == 1) { h1 = l1 + 1; h2 = 0; h3 = 0 }
      else if (op == "=" || op == "~") { h1 = l1; h2 = l2 + 1; h3 = 0 }
      else if (n == 1 || l1 > 0) { h1 = l1 + 1; h2 = 0; h3 = 0 }
      else if (n == 2 || l2 > 0) { h1 = 0; h2 = l2 + 1; h3 = 0 }
      else { h1 = 0; h2 = 0; h3 = l3 + 1 }
      x1 = a[1] + 0; x2 = a[2] + 0; x3 = a[3] + 0
      ge = x1 > l1 || (x1 == l1 && (x2 > l2 || (x2 == l2 && x3 >= l3)))
      lt = x1 < h1 || (x1 == h1 && (x2 < h2 || (x2 == h2 && x3 < h3)))
      exit !(ge && lt)
    }'
}
# SATISFIES END
# `version` in a pack.toml's [pack] table, unquoted.
pack_version() {
  awk '
    BEGIN { q = sprintf("%c%c", 34, 39) }
    substr($0, 1, 1) == "[" { t = $0; sub(/[ ]*#.*$/, "", t); gsub(/[ ]/, "", t); next }
    t == "[pack]" && $0 ~ /^[ ]*version[ ]*=/ {
      v = $0; sub(/^[^=]*=/, "", v); sub(/#.*$/, "", v); gsub("[ " q "]", "", v); print v; exit
    }' "$1"
}
proposals=.yidam/decisions/proposals.yml
pins=""
if [ -f "$proposals" ]; then
  pins=$(awk '
    BEGIN { q = sprintf("%c%c", 34, 39) }
    function emit(s) {
      sub(/[ ]*#.*$/, "", s); gsub("[" q "]", "", s); sub(/^[ ]+/, "", s); sub(/[ ]+$/, "", s)
      if (s != "") print s
    }
    /^prelude_sources:/ {
      line = $0
      sub(/^prelude_sources:[ ]*/, "", line)
      sub(/[ ]*#.*$/, "", line)
      if (substr(line, 1, 1) == "[") {
        gsub(/[][]/, "", line)
        n = split(line, items, ",")
        for (i = 1; i <= n; i++) emit(items[i])
      } else if (line == "") { block = 1 }
      next
    }
    block == 1 && $0 ~ /^[ ]*-[ ]+/ { s = $0; sub(/^[ ]*-[ ]+/, "", s); emit(s); next }
    block == 1 && $0 ~ /^[^ ]/ { block = 0 }
  ' "$proposals")
fi
staged="$tmp/sources"
rm -rf "$staged"
mkdir -p "$staged"
refused=0
peers=0
set -f
while IFS= read -r pin; do
  [ -n "$pin" ] || continue
  set -- $pin
  if [ $# -eq 1 ]; then
    peer=""
  elif [ $# -eq 3 ] && [ "$2" = from ]; then
    peer=$3
  else
    echo "ERROR: prelude_sources: '$pin' is neither <pack>@<range> nor <pack>@<range> from <repo>@<commit>" >&2
    refused=1; continue
  fi
  pack=${1%%@*}
  range=${1#*@}
  if [ "$pack" = "$1" ] || [ -z "$pack" ] || [ -z "$range" ]; then
    echo "ERROR: prelude_sources: '$pin' names no range; write $1@^<major>.<minor>" >&2
    refused=1; continue
  fi
  # The pack-name rule `yidam source check` holds a pin to, checked before the name is a
  # path: `a/b` or `../x` would otherwise reach `cp`. Letters are spelled out, since a
  # locale may collate `[a-z]` to take capitals too.
  case "$pack" in
    [abcdefghijklmnopqrstuvwxyz]*)
      case "$pack" in *[!abcdefghijklmnopqrstuvwxyz0123456789-]*) bad=1 ;; *) bad=0 ;; esac ;;
    *) bad=1 ;;
  esac
  if [ "$bad" -ne 0 ]; then
    echo "ERROR: prelude_sources: '$pin': '$pack' is not a pack name: lowercase letters, digits and -, starting with a letter" >&2
    refused=1; continue
  fi
  if [ -e "$staged/$pack" ]; then
    echo "ERROR: prelude_sources: $pack is pinned twice" >&2
    refused=1; continue
  fi
  if [ -z "$peer" ]; then
    src="$tmp/yidam/yidam/sources/$pack"
    from="$origin"
    at="$commit"
  else
    from=${peer%@*}
    at=${peer##*@}
    case "$at" in
      *[!0-9a-f]*) at="" ;;
    esac
    if [ "$from" = "$peer" ] || [ -z "$from" ] || [ ${#at} -ne 40 ]; then
      echo "ERROR: prelude_sources: '$pin' does not end in <repo>@<40-hex commit>" >&2
      refused=1; continue
    fi
    case "$from" in
      *://* | git@* | /* | .*) url="$from" ;;
      *) url="https://$from" ;;
    esac
    peers=$((peers + 1))
    clone="$tmp/peer-$peers"
    rm -rf "$clone"
    if ! git clone --quiet --filter=blob:none "$url" "$clone" || ! git -C "$clone" checkout --quiet "$at"; then
      echo "ERROR: prelude_sources: '$pin': cannot check out $at from $url" >&2
      refused=1; continue
    fi
    src="$clone/.yidam/sources/$pack"
  fi
  if [ ! -f "$src/pack.toml" ]; then
    echo "ERROR: prelude_sources: '$pin': $from at $at has no $pack pack" >&2
    refused=1; continue
  fi
  version=$(pack_version "$src/pack.toml")
  if ! satisfies "$version" "$range"; then
    echo "ERROR: prelude_sources: '$pin': $pack is ${version:-unversioned} at $from@$at, which $range does not admit" >&2
    refused=1; continue
  fi
  if grep -qx '[[]vendored[]]' "$src/pack.toml"; then
    echo "ERROR: prelude_sources: '$pin': $from carries $pack as a vendored copy; pin the corpus that wrote it" >&2
    refused=1; continue
  fi
  cp -R "$src" "$staged/$pack"
  cat >> "$staged/$pack/pack.toml" <<VENDORED

# Written by yidam-vendor-update: the pin this copy satisfied, and where it came from.
[vendored]
pin = "$pin"
from = "$from"
commit = "$at"
VENDORED
  echo "sources/$pack: $version from $from@$at (per $pin)"
done <<PINS
$pins
PINS
set +f
if [ "$refused" -ne 0 ]; then
  echo "ERROR: a prelude_sources pin was refused; nothing in this repository has changed." >&2
  exit 1
fi
rm -rf .yidam/.vendor/sources
if [ -n "$(ls "$staged")" ]; then
  mkdir -p .yidam/.vendor
  cp -R "$staged" .yidam/.vendor/sources
else
  echo "sources/: none pinned (per $proposals)"
fi
# VENDOR-SOURCES END
# Wholesale replacement, not a merge: the prelude is read-only in a derived
# repo, so there is nothing local to preserve. Anything that WAS edited locally
# shows up in the diff below, which is the point.
#
# The domain libraries are not part of the prelude and are not in that copy; the
# block below adds the ones this repository chose. Read what it vendors now first —
# under `.yidam/.vendor/domains/`, or under `prelude/domains/` for a repository
# vendored before the layer moved out (#934) — since the line below erases the latter.
vendored=""
for dir in .yidam/.vendor/domains .yidam/.vendor/prelude/domains; do
  if [ -d "$dir" ]; then
    vendored="$vendored $(ls "$dir" | grep -vxE 'README.md|parity' || true)"
  fi
done
# VENDOR-PRELUDE BEGIN
rm -rf .yidam/.vendor/prelude
mkdir -p .yidam/.vendor
cp -R "$tmp/yidam/yidam/prelude" .yidam/.vendor/prelude
# The SDKs are yidam's to build and test, and no derived repository builds them, so
# they sit beside the prelude (#1311). A ref from before the move carries them
# inside it; never leave them in the copy.
rm -rf .yidam/.vendor/prelude/sdks
# VENDOR-PRELUDE END
# ── the domain libraries, and the choice this repository already made ─
#
# `yidam/domains/` is fifteen libraries in three languages each, and a derived
# repository has no task that builds them, no workspace that includes them, and no
# CI job that runs them unless it wires one in. They sit beside the prelude rather
# than inside it so that the copy above never brings them: this block copies only
# what the repository opted into, and the common case opts into none.
#
# Two sources, in order, and neither is a guess:
#
#   1. `prelude_domains` in .yidam/decisions/proposals.yml — the record step 5
#      writes and step 8 reads. The repository's own declaration, the same
#      standing as `[build] features` above.
#   2. Failing that, what this repository already had. A re-vendor may not decide
#      something nobody declared: a repository that vendored domains before the
#      record existed keeps them, and one that vendored none gets none.
#
# VENDOR-DOMAINS BEGIN
domains=.yidam/.vendor/domains
proposals=.yidam/decisions/proposals.yml
# A ref from before #934 carries the libraries inside its prelude; take them from
# there, and never leave them in the prelude copy.
upstream="$tmp/yidam/yidam/domains"
[ -d "$upstream" ] || upstream="$tmp/yidam/yidam/prelude/domains"
rm -rf .yidam/.vendor/prelude/domains
if [ -f "$proposals" ] && grep -q '^prelude_domains:' "$proposals"; then
  keep=$(awk '
    /^prelude_domains:/ {
      line = $0
      sub(/^prelude_domains:[ ]*/, "", line)
      sub(/[ ]*#.*$/, "", line)
      if (substr(line, 1, 1) == "[") { gsub(/[][",]/, " ", line); print line }
      else if (line != "") { print line }
      else { block = 1 }
      next
    }
    block == 1 && $0 ~ /^[ ]*-[ ]+/ {
      sub(/^[ ]*-[ ]+/, "")
      sub(/[ ]*#.*$/, "")
      gsub(/["]/, "")
      print
      next
    }
    block == 1 && $0 ~ /^[^ ]/ { block = 0 }
  ' "$proposals")
  source="$proposals"
else
  keep="$vendored"
  source="the set already vendored here"
fi
# One line, whatever form the declaration took: a flow list, a block list, or an ls.
keep=$(echo $keep)
rm -rf "$domains"
if [ -z "$keep" ]; then
  echo "domains/: none vendored (per $source)"
else
  mkdir -p "$domains"
  # README.md is the index that says what the layer is and how a domain is wired
  # into crates/Cargo.toml; `parity` is how a kept domain is checked across its
  # three languages. Both come with anything that does.
  for d in $keep README.md parity; do
    if [ -e "$domains/$d" ]; then
      continue
    elif [ -e "$upstream/$d" ]; then
      cp -R "$upstream/$d" "$domains/$d"
    else
      echo "WARNING: domains/$d: named (per $source) but not in $upstream" >&2
    fi
  done
  echo "domains/: vendored $keep (per $source)"
fi
# VENDOR-DOMAINS END
# This file too. It is the inherited TASK layer — as read-only as the prelude and
# as much yidam's to correct, but it does not live under .yidam/.vendor/ because
# mise has to find it at the repo root. For a long time that meant it had no
# update path at all: a derived repo froze whatever mise.yidam.toml it was born
# with, permanently, including a `vendor(yidam):` line this project later found
# to be unrecognizable to its own lint. Corrections upstream never arrived.
#
# Keep domain tasks in mise.toml. Anything written here is replaced on this line.
if [ -f "$tmp/yidam/mise.yidam.toml" ]; then
  cp "$tmp/yidam/mise.yidam.toml" mise.yidam.toml
  echo "refreshed mise.yidam.toml (the inherited task layer)"
fi
# The yidam binary this repository resolves, as `<version> (<build commit>)` — the same
# spelling `yidam clone` writes for itself. The copy above is this task's own `cp`, but the
# binary is what runs against the result, starting with the baseline below, and a stale
# one shadowing the pin earlier on PATH is exactly what the manifest could not show (#1076).
# A binary predating `--version` answers nothing parseable, and that is recorded as such.
cli=""
if command -v yidam >/dev/null 2>&1; then
  cli=$(yidam --version 2>/dev/null | sed -n 's/^yidam \\([^ ]*\\) (\\([^)]*\\)).*/\\1 (\\2)/p' | head -1)
fi
[ -n "$cli" ] || cli="unknown"
cat > .yidam.toml <<EOF
# Provenance of the yidam template this repository was derived from.
#
# Written at clone/overlay time, when the yidam source was still a git
# repository. Updated by \\`mise run yidam-vendor-update\\`.
#
# \\`commit\\` is the resolvable pin: it is what the re-vendor procedure and CI
# check out. \\`template\\` is the release tag at that commit, or "untagged".
# \\`committed\\` is that commit's date — how old the vendored prelude is.
# \\`cli\\` is the yidam binary in use when this file was written: version (build commit).
#
# See .yidam/.vendor/prelude/guidelines/directories.md for the re-vendor procedure.

[yidam]
origin    = "$origin"
commit    = "$commit"
template  = "$template"
committed = "$committed"
cli       = "$cli"
EOF
# Yours, and preserved across every re-vendor. Both channels read it: the source build passes
# it to cargo, and the download declines a release that was not built with it.
if [ -n "$required" ]; then
  quoted=$(echo $required | sed -e 's/ /", "/g')
  cat >> .yidam.toml <<EOF

[build]
# Features this repository's yidam binary must have beyond the released default set.
# \\`mise run yidam-build\\` compiles rather than downloading when a release lacks one.
features = ["$quoted"]
EOF
fi
echo
echo "re-vendored to $commit ($template)"

# ── the [tools] entry, derived from the same pin ──────────────────────
#
# mise installs a released `yidam` from the `github:` backend, so a repository
# whose pin happens to be tagged does not need a Rust toolchain to obtain its
# binary. The version that entry names is NOT a third pin a human keeps in step
# — VERSIONING.md argues against exactly that — it is derived here, from the
# commit .yidam.toml already records, by the one command that rewrites the
# inherited layer. One pin, two spellings, one writer.
#
# `git tag --points-at` rather than yidam-build's `git ls-remote` awk: this task
# has the origin cloned already, tags and all, so it can ask git directly and
# git does the annotated-tag peeling that the resolver has to do by hand.
#
# ── it is written into mise.toml, and that file is yours ──────────────
#
# Every other thing this task rewrites it replaces wholesale. This one it cannot:
# `[tools]` is not legal in THIS file. mise reads a task-config include's
# `[tools]` as a task NAMED tools, then rejects its entries as unknown task
# fields and fails the whole file to parse — orphaning all 35 inherited tasks,
# which is the outage task_layer.rs was written for. Same shape as `[env]`.
#
# So the entry has to live in the consumer's own mise.toml, and only a marked
# region of it is ours. Everything outside the markers is domain-owned and never
# read here. The markers are also why this cannot append a second `[tools]`
# table: TOML rejects a duplicate table outright, so the region is edited in
# place inside the one that is already there.
cli_tag=$(git -C "$tmp/yidam" tag --points-at HEAD --list 'cli/v*' 2>/dev/null | head -1)
cli_version="${cli_tag#cli/v}"
# ── and does that release do what this repository needs? ──────────────
#
# The `[tools]` entry is installed by `mise install`, which never runs yidam-build and so
# never reaches its post-download check. If this wrote the entry regardless, a repository
# declaring `[build] features` would get a binary without them from the one path that does
# not look — and the symptom is tests that skip rather than tests that fail (#532).
#
# The released set is `[features] default`, read out of the tree just cloned at this exact
# pin. Not restated here: a copy would be a second answer, and this task has the file.
if [ -n "$cli_version" ] && [ -n "$required" ]; then
  released=" $(sed -n 's/^default *= *\\[\\(.*\\)\\].*/\\1/p' "$tmp/yidam/yidam/cli/Cargo.toml" | tr -d '" ' | tr ',' ' ') "
  short=""
  for f in $required; do
    case "$released" in *" $f "*) ;; *) short="$short $f" ;; esac
  done
  if [ -n "$short" ]; then
    echo
    echo "release $cli_tag is built without:$short"
    echo "  .yidam.toml [build] features requires it, so the [tools] entry is NOT adopted"
    echo "  and 'mise run yidam-build' will keep compiling. Nothing is lost; the fast path"
    echo "  becomes available when upstream ships those features in its default set."
    cli_version=""
  fi
fi
# No backslashes anywhere in this program, deliberately: it is embedded in a TOML
# multi-line string, read back out of it by a test, and run through sh — three
# escaping layers to be wrong in. `index(s, t) == 1` is a prefix test that needs
# no regex, and the entry itself arrives via -v rather than being quoted inline.
tools_block='
  { lines[NR] = $0 }
  function emit() {
    print "# <!-- YIDAM:TOOLS --> written by yidam-vendor-update from .yidam.toml — do not edit"
    print body
    print "# <!-- /YIDAM:TOOLS -->"
  }
  END {
    n = 0
    skipping = 0
    for (i = 1; i <= NR; i++) {
      l = lines[i]
      if (index(l, "# <!-- YIDAM:TOOLS -->") == 1) { skipping = 1; continue }
      if (index(l, "# <!-- /YIDAM:TOOLS -->") == 1) { skipping = 0; continue }
      if (skipping) continue
      out[++n] = l
    }
    done = 0
    for (i = 1; i <= n; i++) {
      print out[i]
      if (!done && index(out[i], "[tools]") == 1) { emit(); done = 1 }
    }
    if (!done) { print ""; print "[tools]"; emit() }
  }
'
if [ -f mise.toml ]; then
  if [ -n "$cli_version" ]; then
    body=$(printf '"github:goedelsoup/yidam" = { version = "%s", version_prefix = "cli/v" }' "$cli_version")
  else
    # The block is kept, empty, rather than removed. It is the anchor the next
    # re-vendor edits, and its absence would be indistinguishable from a repo
    # that predates this mechanism.
    body='# no cli/v* release at this pin — `mise run yidam-build` compiles instead'
  fi
  if awk -v body="$body" "$tools_block" mise.toml > "$tmp/mise.toml.new"; then
    mv "$tmp/mise.toml.new" mise.toml
    if [ -n "$cli_version" ]; then
      echo "mise.toml [tools]: yidam $cli_version (released at this pin)"
    else
      echo "mise.toml [tools]: no release at this pin — yidam-build will compile"
    fi
  fi
fi
# ── the scaffold regions: ci.yml and CLAUDE.md ────────────────────────
#
# Genesis installs `.github/workflows/ci.yml` and `.claude/CLAUDE.md` from the scaffold,
# once. For as long as nothing else touched them, a derived repository ran whatever gates
# its genesis knew about: nine measured workflows were 225 to 715 lines behind the scaffold,
# one of them behind the scaffold at its own pin (#1054). A re-vendor moved the prelude and
# the task layer forward and left the two files that decide what CI checks where they started.
#
# Both files are the repository's, so neither is replaced. The scaffold marks the part
# that is yidam's — the gate jobs in ci.yml, the working summary in CLAUDE.md — and only
# that region is rewritten, the way the `[tools]` block above is. Everything outside the
# markers is never read here.
#
# A file with no markers is reported and left alone: `yidam migrate scaffold` installs them,
# once, around the part it can show is the template's. A CLAUDE.md with none of the
# template's headings is the owner's whole, which the migration leaves unmarked, so it is not
# reported either: the fourth argument is what "the template's" means, and the migration's
# `claude_is_template` reads the same three headings. Exit codes, from the program: 3 the
# scaffold at this pin has no region (an older pin), 4 the file has no markers, 5 an opening
# marker with no close.
#
# No backslashes, for the reason the tools block gives. `shut`, not `close`: that is an awk
# builtin.
# SPLICE-SCAFFOLD BEGIN
splice_program='
  function marks(l, tok,   t) { t = l; sub(/^[[:space:]#]*/, "", t); return index(t, tok) == 1 }
  BEGIN {
    n = 0; state = 0
    while ((getline l < src) > 0) {
      if (state == 0 && marks(l, open)) state = 1
      if (state == 1) region[++n] = l
      if (state == 1 && marks(l, shut)) state = 2
    }
    unusable = (state != 2)
  }
  { lines[NR] = $0 }
  END {
    if (unusable) exit 3
    found = 0; state = 0
    for (i = 1; i <= NR; i++) {
      l = lines[i]
      if (state == 0 && marks(l, open)) {
        state = 1; found = 1
        for (k = 1; k <= n; k++) print region[k]
        continue
      }
      if (state == 1) { if (marks(l, shut)) state = 2; continue }
      print l
    }
    if (!found) exit 4
    if (state == 1) exit 5
  }
'
splice_region() {
  target="$1"; source="$2"; name="$3"; template="${4:-}"
  [ -f "$target" ] && [ -f "$source" ] || return 0
  status=0
  awk -v src="$source" -v open="<!-- YIDAM:$name -->" -v shut="<!-- /YIDAM:$name -->" "$splice_program" "$target" > "$tmp/splice.out" || status=$?
  case "$status" in
    0)
      if cmp -s "$tmp/splice.out" "$target"; then
        echo "$target: the YIDAM:$name region is current"
      else
        cat "$tmp/splice.out" > "$target"
        echo "$target: rewrote the YIDAM:$name region from the scaffold"
      fi ;;
    3) ;;
    4)
      if [ -z "$template" ] || grep -q -E "$template" "$target"; then
        echo "$target: no YIDAM:$name markers, so no re-vendor reaches the part of it that is yidam's"
        echo "  run 'yidam migrate scaffold', then re-vendor"
      fi ;;
    *) echo "$target: the YIDAM:$name region has no closing marker; left as it was" ;;
  esac
}
splice_region .github/workflows/ci.yml "$tmp/yidam/sadhana/github/workflows/ci.yml" CI
splice_region .claude/CLAUDE.md "$tmp/yidam/sadhana/root/CLAUDE.md" CLAUDE '^## (The short version|Before writing|Before committing)[[:space:]]*$'
# SPLICE-SCAFFOLD END
# ── workarounds whose fix has shipped ─────────────────────────────────
#
# A derived repository that works around an upstream defect records it by citing the issue,
# `yidam#587`, beside the workaround. Nothing used to read that citation back, so a
# workaround outlived its fix: one repository still carried two for issues closed upstream
# (#1054). `doctor` cannot answer this — it makes no network call — but this task has just
# cloned the origin, and the question it can answer is the better one anyway: not "is the
# issue closed" but "is the fix at the commit this repository now pins".
#
# Every tracked file is read except the vendored tree, which is upstream's own text, and
# the corpus, which may cite an issue as a subject rather than as a workaround. A commit
# counts as the fix when it names the issue the way this project writes one — `(#587)` in
# the message, or closes/fixes/resolves #587.
# WORKAROUNDS BEGIN
cited=$(git grep -h -o -I -E -e 'yidam#[0-9]+' -e 'yidam/issues/[0-9]+' -- . ':!.yidam/.vendor' ':!.yidam/corpus' 2>/dev/null | sed 's/.*[#/]//' | sort -n -u || true)
shipped=""
for n in $cited; do
  fix=$(git -C "$tmp/yidam" log -1 --format='%h %s' -E -i --grep="[(]#$n[)]" --grep="(close[sd]?|fix(e[sd])?|resolve[sd]?) #$n([^0-9]|$)" HEAD 2>/dev/null || true)
  [ -n "$fix" ] && shipped="$shipped
  yidam#$n  fixed at this pin by $fix"
done
if [ -n "$shipped" ]; then
  echo
  echo "this repository cites upstream issues that the new pin carries a fix for:$shipped"
  echo "  a workaround recorded against one of them can go; 'git grep yidam#<n>' finds it."
fi
# WORKAROUNDS END
# What moved in the CLOSED VOCABULARY, specifically. Everything else in the prelude is
# a document you can read at leisure; the vocabulary is the part this repository has
# already written history against, and history cannot be rewritten to match a verb.
# A derived repo once spent four commits reverting a verb that upstream had blessed
# the same day, because nothing told it either fact.
if [ -n "$previous" ] && [ "$previous" != "unknown" ] && [ "$previous" != "$commit" ]; then
  # The verbs, and only the verbs — anchored on the `| Verb | When |` header, for the
  # reason `yidam-vendor-status` states at length. Each task's `run` is its own script,
  # so the function is defined twice; if you change one, change both.
  verbs_from_graph() {
    awk -F'|' '
      /^[[:space:]]*\\|/ {
        h = $2; w = $3
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", h)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", w)
        if (tolower(h) == "verb" && tolower(w) == "when") { t = 1; next }
        if (!t) next
        if (h ~ /^[-:]+$/) next
        gsub(/`/, "", h)
        if (h ~ /^[a-z]+$/) print h
        next
      }
      { t = 0 }
    ' | sort -u
  }
  verbs_at() {
    git -C "$tmp/yidam" show "$1:yidam/prelude/GRAPH.md" 2>/dev/null | verbs_from_graph
  }
  before=$(verbs_at "$previous")
  after=$(verbs_at "$commit")
  if [ -n "$before" ] && [ -n "$after" ]; then
    # Temp files rather than process substitution: these tasks run under POSIX sh,
    # where <( ) does not exist and would fail at the first repository to run it.
    printf '%s\\n' "$before" > "$tmp/verbs.before"
    printf '%s\\n' "$after"  > "$tmp/verbs.after"
    added=$(comm -13 "$tmp/verbs.before" "$tmp/verbs.after" || true)
    removed=$(comm -23 "$tmp/verbs.before" "$tmp/verbs.after" || true)
    if [ -n "$added" ] || [ -n "$removed" ]; then
      echo
      echo "the closed commit vocabulary moved:"
      [ -n "$added" ]   && printf '%s\\n' "$added"   | sed 's/^/  + /'
      [ -n "$removed" ] && printf '%s\\n' "$removed" | sed 's/^/  - /'
      echo "  read .yidam/.vendor/prelude/GRAPH.md before writing more commits."
    fi
  fi
fi
# A baseline, if this repository has never written one. Adoption, not blessing: the
# command leaves an existing file alone, so this runs unconditionally.
#
# The gate is useless without one, and "useless" is not hyperbole — a measured derived
# repository had a third of its corpus unreachable by traversal, reported `lint … no
# regression` on every commit, and had no lint-baseline.yml at all. A ratchet with no
# file to ratchet against does nothing, quietly, in exactly the repositories that most
# need it. Waiting for somebody to run --bless is waiting for somebody to already know.
#
# Best-effort: a repository whose binary predates the flag, or which is mid-conflict,
# must still finish re-vendoring. Failure here is not a failed re-vendor.
if command -v yidam >/dev/null 2>&1; then
  yidam lint --init-baseline 2>/dev/null || true
fi
# Whether the ontology ever stated its contract (#1078). Two corpora re-vendored past the
# commit that introduced `required:` and neither ontology learned it, because nothing asked.
# A re-vendor is when a corpus meets fields it was written without, so it is asked here.
#
# `--strict` exits nonzero on the warning, and `contract` has no `fail`. Printed only when
# something warned *and* printed: a binary that predates `--only`, or no binary at all,
# writes nothing to stdout, and must not stop the re-vendor. One line, so a test can run it.
contract=$(yidam doctor --only contract --strict 2>/dev/null) || [ -z "$contract" ] || printf '\\n%s\\n\\n' "$contract"
echo "review the diff, then commit it as its own event:"
echo "  git add .yidam/.vendor .yidam.toml mise.yidam.toml mise.toml .yidam/lint-baseline.yml .github/workflows/ci.yml .claude/CLAUDE.md"
echo "  git commit -m 'vendor: re-vendor prelude at $commit — <what changed>'"
"""

# ── corpora ───────────────────────────────────────────────────────────
# `mise install` provisions toolchains. It does not fetch the corpora this
# repository declares in `.yidam/tonpa.toml`, so a fresh clone ended with the
# tools present, the binary present, and every command that reads a dependency's
# corpus reading nothing. The third step existed; nothing ran it.
#
# The consumer's mise.toml runs this from `[hooks] postinstall`. That hook CANNOT
# live in this file: mise reads `[hooks]` in a task-config include as a task
# NAMED hooks — the same way it reads `[env]` and `[tools]` — and the whole
# include then fails to parse, orphaning every task in it. `sadhana/root/mise.toml`
# carries the hook for new repositories. See task_layer.rs.
#
# Re-running it is safe, and that is a property of the command rather than a
# hope: `tonpa install` returns early when nothing is declared, skips path
# dependencies, and for anything already unpacked verifies its hash against
# tonpa.lock and continues without fetching. It reaches the network only for a
# dependency that is missing, unlocked, or corrupt.
[tonpa-install]
description = "Fetch the corpora .yidam/tonpa.toml declares. Re-runnable: verifies hashes and writes nothing when already satisfied."
run = """
set -eu
# Not an error, and deliberately not a failed `mise install`. A repository whose
# pin carries no release has no binary until `mise run yidam-build` compiles one,
# and provisioning toolchains must not fail because the step after it has not run
# yet. This swallows only the binary's absence — a rotted dependency URL is
# `tonpa install`'s own exit code and passes straight through.
if ! command -v yidam >/dev/null 2>&1; then
  echo "yidam is not on PATH yet — run 'mise run yidam-build', then 'mise run tonpa-install'." >&2
  exit 0
fi
yidam tonpa install
"""

# ── yidam CLI — REGEN tasks ───────────────────────────────────────────

[status]
description = "Repo overview: node count, open questions, catalog entries, index freshness, active phases, genesis date."
run = "yidam status"

[open-questions]
description = "List corpus nodes with open questions (? titles or [open] claims)."
run = "yidam open-questions"

[corpus-index]
description = "Regenerate corpus/README.md index table."
run = "yidam corpus-index"

[index-status]
description = "Report vector index state: embedding model, coverage, freshness, retrieval latency."
run = "yidam index-status"

[catalog-audit]
description = "Audit catalog/ entries: integrity status, citation count, stale sources."
run = "yidam catalog-audit"

[phases]
description = "List active inquiry phases (ma/* and rigpa/* branches) with owner, start date, and commit count."
run = "yidam phases"

[due]
description = "What is due? Four clocks read together: index staleness, catalog TTL, unanswered questions, phases in flight. Read-only, exits zero — being owed is not being broken."
run = "yidam due"

# Beside `due` and deliberately not in `ci`. Divergence from a kuten is a question for a
# person, and a question wired into the gate becomes a defect the next person learns to
# silence. Exits zero however far a corpus has drifted; a repository holding no kuten says so.
[kuten-check]
description = "Where has this corpus drifted from the practice it declared? Read-only, exits zero — a divergence is a question, not a defect."
run = "yidam kuten check"

[sangha]
description = "Report the sangha: registered electors, their positions, and settled resolutions."
run = "yidam sangha"

[vocabulary]
description = "Print the closed commit vocabulary. `mise run vocabulary -- --check \"verb: subject\"` checks one subject before it is committed."
run = "yidam vocabulary"

[agents-index]
description = "Regenerate agents/README.md index table."
run = "yidam agents-index"

[skills-index]
description = "Regenerate skills/README.md index table."
run = "yidam skills-index"

[crates-index]
description = "Regenerate crates/README.md index table."
run = "yidam crates-index"

[packages-index]
description = "Regenerate packages/README.md index table."
run = "yidam packages-index"

[bundle-status]
description = "Report web/ bundle state: contract version, feeds, last export timestamp, deploy status."
run = "yidam bundle-status"

[log]
description = "Commit history classified as testimony or pipeline work. --epistemic for testimony only."
run = "yidam log"

[graph]
description = "Report the corpus graph: nodes, resolved edges, and the classes that license them."
run = "yidam graph"

[graph-check]
description = "Run graph integrity check: orphans, missing labels, broken links."
run = "yidam graph-check"

[neighbors]
description = "Show the neighbourhood of one node — `mise run neighbors -- concept/x.yml --depth 2`."
run = "yidam neighbors"

[rename]
description = "Rename a corpus node or a catalog entry, rewriting every edge into it — `mise run rename -- concept/old concept/new --dry-run`."
run = "yidam rename"

[graph-lint]
description = "Lint the corpus against the baseline ratchet: 31 checks over nodes, edges, catalog, classes, and tables."
run = "yidam lint"

# The lint as the GATE runs it, and the reason it is a task of its own rather than a
# flag someone remembers. `.github/workflows/ci.yml` runs `yidam lint --commits
# --range origin/main..HEAD`; `mise run ci` ran `graph-lint`, which is `yidam lint`
# with no `--commits` at all. The commit-vocabulary finding is the one a contributor
# cannot act on after the fact — history cannot be rewritten to fix a verb — and it
# was the one finding the local gate never showed them. They learned it from a push.
#
# It reports and never gates, here and in CI alike: `unrecognized-verb` is Warn
# severity and carries no age, so nothing in it can escalate. Adding it to `ci`
# cannot turn a green gate red. What it buys is the finding arriving while the next
# commit message is still unwritten, which is the only time it is useful —
# `yidam vocabulary --check "<subject>"` asks the same question of a subject that
# does not exist yet.
#
# The range is resolved rather than hardcoded. CI knows it is comparing against
# `origin/main`; a working copy does not — the branch may track something else, the
# default branch may not be `main`, and there may be no remote at all. Each candidate
# is *resolved* before it is used, because a range git cannot parse makes
# `read_subjects` return an empty list: the check would run over nothing and report
# a clean log, which is worse than not running it.
[graph-lint-gate]
description = "Lint as CI does: the baseline ratchet, plus the commit vocabulary over the commits this branch adds."
run = """
set -eu
base=""
for ref in '@{upstream}' origin/HEAD origin/main; do
  if git rev-parse --verify --quiet "$ref" >/dev/null 2>&1; then
    base="$ref"
    break
  fi
done
if [ -n "$base" ]; then
  yidam lint --commits --range "$base..HEAD"
else
  # No remote to compare against. The whole log rather than nothing: a repository
  # that has never been pushed has no "what this branch adds", and its whole log is
  # short enough that reading it is the cheaper answer.
  echo "no upstream to compare against — reading the whole log for the vocabulary check."
  yidam lint --commits
fi
"""

[graph-lint-explain]
description = "Lint, printing each check's rationale alongside its findings."
run = "yidam lint --explain"

[graph-lint-commits]
description = "Lint, also checking the git log against the closed commit vocabulary in GRAPH.md."
run = "yidam lint --commits"

[graph-lint-bless]
description = "Record the corpus's current error-severity violations as its baseline. Review the diff before committing."
run = "yidam lint --bless"

[schema]
description = "Emit JSON Schema for the corpus shapes into .yidam/schemas/ for in-editor validation. A file yidam did not write is left alone; `yidam schema --force` replaces it."
run = "yidam schema"

[decisions-log]
description = "Render the decisions log from .yidam/decisions/."
run = "yidam decisions-log"

[bundle]
description = "Package corpus, skills, decisions, rendered indexes, and vector index into .yidam/bundle.yiz."
run = "yidam bundle"

# ── vector index pipeline ─────────────────────────────────────────────

[embed]
description = "Extract embedding text from corpus instances and catalog sources to .yidam/embeddings/."
# The catalog is included by default. `yidam embed --no-catalog` for corpus nodes only —
# a repository whose catalog holds material it does not want retrievable should say so
# once rather than by not knowing.
run = "yidam embed"

[index-build]
description = "Build the vector index from embeddings, as Arrow IPC. Downloads model (~22 MB) on first run."
depends = ["embed"]
run = "yidam index-build"

[regen-check]
description = "Report which REGEN blocks are stale, writing nothing — safe to run with work in flight."
run = "yidam regen --check"

[regen]
description = "Regenerate all REGEN sections across READMEs in one pass."
# One `yidam regen` rather than a `depends` list, because there were two lists and they
# drifted: this task ran eight generators and CI checked two of them, so six blocks could
# go stale unseen. The set now lives in the CLI (`cmd::regen::GENERATORS`) and both callers
# ask for it by name. `status` and `open-questions` are in it now too — they write blocks
# into the root README and were in neither list.
run = "yidam regen"
