description: |
  The parcel this corpus traces: a residential lot in the Brightwater Addition, Vantry
  County, described in the current deed by lot and block reference to the recorded plat.
  [verified]

  Lot-and-block is the easier of the two description regimes to trace, because the plat fixes
  the boundary once and every later instrument can refer to it. A metes-and-bounds parcel
  would put a second question under every conveyance — whether the land described is the same
  land — and that question is out of scope here. [inference]

  This is an **illustrative parcel** in an invented county. Its identifiers follow the form a
  recorder's office uses so the shape of a real record is legible; it describes no real land
  and no real transaction.
