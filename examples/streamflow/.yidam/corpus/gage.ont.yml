class: gage
label: Gage
description: |
  A fixed station on a channel where stage is recorded continuously and converted to
  discharge by a rating curve.
properties:
  - name: parameter
    type: string
    description: The measured quantity, by its publisher's parameter code.
  - name: units
    type: string
    description: The units discharge is published in.
  - name: claim_tag
    type: claim
    description: The evidence standing of this node, as a tag rather than as prose.
edges:
  - relationship: sources-from
    target: concept
    direction: out
    description: A concept this station's record is used to compute.
