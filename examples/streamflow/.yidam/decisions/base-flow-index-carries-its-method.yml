id: base-flow-index-carries-its-method
summary: A base-flow index is a derived quantity carrying its method, never a reach property.
context: |
  Two defensible digital filters over one record produce different base-flow indices. The
  first draft of the reach class had a `base_flow_index` property.
decision: |
  The property was removed. A base-flow index appears only as a computed result, always
  accompanied by the filter and its parameters.
rationale: |
  A property on a reach reads as a fact about the river. This one is a fact about a
  modelling choice, and the components it separates are not separately observable — so
  storing it as a reach property would have asserted, silently and for every instance, that
  the separation is a measurement. That is the shape `concept/base-flow-separation` is
  `[open]` about, and a class property would have put it beyond the reach of the claim tags
  entirely.
