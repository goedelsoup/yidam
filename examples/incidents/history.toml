# The order this corpus was actually written in.
#
# `yidam replay` reconstructs corpus health at every commit that touched the corpus, and a
# corpus materialised with one genesis commit has nothing for it to reconstruct. The
# walkthrough's replay section would then be a description of a feature rather than a run of
# it — which is the failure `docs/walkthroughs/` exists to avoid.
#
# So this example ships its history. `yidam/cli/tests/example_corpus.rs` replays these commits
# in order when materialising it; an example with no `history.toml` gets the single genesis
# commit it always did, so nothing else here changes.
#
# Each commit names path *prefixes*. Every tracked file under one that has not been committed
# yet is added. The final commit is implicit and sweeps whatever is left, so a file added to
# this example without a thought about history still lands in the corpus.
#
# The verbs are the corpus vocabulary rather than conventional commits — `yidam vocabulary`
# lists the closed set — because this is a derived corpus and that is what a derived corpus
# uses. `extract` is the pipeline pulling structure from the incident record; `establish` and
# `revise` are the review changing what is believed. `yidam log --epistemic` separates them.

