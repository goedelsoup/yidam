class: contributing-factor
label: No backpressure at the queue boundary
description: |
  Work is accepted at the rate it arrives regardless of whether it can be drained, so a slow
  consumer becomes an unbounded queue and then a memory event. [verified]

  Named in one review. It is the factor most obviously worth fixing and the one whose
  remediation nobody has confirmed — see `remediation/load-shed`. [inference]
