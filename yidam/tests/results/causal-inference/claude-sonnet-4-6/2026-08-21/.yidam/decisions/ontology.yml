id: ontology
summary: Causal inference in observational studies — 7 classes; BFO foundational alignment; single-elector governance
corpus_depth: 13
governance: single-elector
context: |
  Domain: causal inference in observational studies. Central question: how do we identify
  causal effects from data not generated by a randomized experiment?

  Three seed concepts were provided: confounding (a variable that distorts the apparent
  treatment-outcome relationship), identification (the conditions under which a causal quantity
  is estimable from observational data), and intervention (the act of setting a variable's
  value, distinct from observing it). Discovery extended these to seven classes by surfacing
  the targets and instruments of identification: estimand (the precise causal quantity),
  estimator (the statistical procedure), assumption (the unverifiable conditions required),
  and study-design (the data-collection structure that constrains which assumptions hold).

  BFO alignment was chosen because the domain is empirical and scientific. The object/process
  distinction is analytically real: variables and study designs are continuants; interventions
  and estimation procedures are occurrents. UFO was considered but set aside — relators would
  be useful only if individual confounding relationships between specific variables in specific
  studies needed to be first-class queryable nodes, which is not a current goal.

  Corpus depth defaulted to 13. Governance defaulted to single-elector.
decision: |
  Classes confirmed:
  - confounding: a variable or structure inducing non-causal association between treatment and outcome
  - identification: conditions under which a causal estimand is recoverable from observational data
  - intervention: external setting of a variable's value, distinct from passive observation
  - estimand: a precisely stated causal quantity — the target of identification
  - estimator: a statistical procedure that recovers an estimand when identification holds
  - assumption: a condition required for identification that cannot be verified from data alone
  - study-design: the data-collection structure that determines which assumptions are defensible

  Edges confirmed:
  - confounding threatens identification
  - identification requires assumption
  - identification targets estimand
  - estimator recovers estimand
  - estimator valid-under assumption
  - intervention defines estimand
  - study-design supports assumption
  - assumption blocks-when-violated identification

  Foundational alignment: BFO
  Governance: single-elector
  Corpus depth: 13
rationale: |
  The seven classes emerged from the three seed concepts by asking what identification is
  always of (estimand), what recovers it (estimator), what it requires (assumption), and
  what constrains which assumptions hold (study-design). No class uses "and" or "or" —
  each is one concept.

  BFO was chosen over UFO because the domain's primary analytical axis is the
  object/process distinction (variables vs. interventions), not the rigidity/role
  distinction. It was chosen over None because BFO typing will support future querying
  by ontological category (e.g., "all occurrent classes" to enumerate process-type concepts).

  Single-elector is the correct default: one maintainer, agents as collaborators. The sangha
  can be adopted later if a second elector appears.
