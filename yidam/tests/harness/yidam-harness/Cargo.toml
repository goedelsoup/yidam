[package]
name = "yidam-harness"
version = "0.1.0"
edition = "2021"
# Neither of these was here before #463, which `cargo deny` found the moment it first ran:
# an unlicensed crate, and one that nothing stopped from being published by a mistyped
# `cargo publish`. It is repository infrastructure and belongs on no registry.
publish = false
license = "MIT"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Aliased for the reason `cli/Cargo.toml` gives at length: the original is archived and
# published as `0.9.34+deprecated`, and the fork is byte-identical across the parse path.
# The harness reads the same `.yml` the CLI does, so the two must not resolve to different
# parsers.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1"
walkdir = "2"
tempfile = "3"

# Integration tests under `tests/` do not inherit `[dependencies]`, and `baseline.rs` walks
# the committed result directories.
[dev-dependencies]
walkdir = "2"
