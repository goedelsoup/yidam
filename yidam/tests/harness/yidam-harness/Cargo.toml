[package]
name = "yidam-harness"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
pulldown-cmark = "0.11"
tempfile = "3"

# Integration tests under `tests/` do not inherit `[dependencies]`, and `baseline.rs` walks
# the committed result directories.
[dev-dependencies]
walkdir = "2"
