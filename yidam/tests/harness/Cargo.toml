[workspace]
# `ci-report` is here rather than in yidam/cli for the reasons its own manifest gives. What
# it buys this workspace is that `mise run ci-harness` already formats, lints and tests it —
# a tool that reports on the gates must not be the one thing no gate reads.
members = ["yidam-harness", "ci-report"]
resolver = "2"

# Same setting, same reason as `yidam/cli/Cargo.toml`'s: the test binaries this workspace
# links are rebuilt on every CI run (rust-cache prunes workspace artifacts before saving),
# and nothing here is ever debugged through a dependency's own source. The argument and the
# measurement live there; `build_profile.rs` holds both manifests to it, discovering them
# from the tasks that link rather than from a list.
[profile.dev.package."*"]
debug = 0
