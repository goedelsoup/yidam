[package]
name = "yidam"
version = "0.1.0"
edition = "2021"
description = "Corpus analysis and index CLI for yidam-derived repositories"

[lib]
name = "yidam"
path = "src/lib.rs"

[[bin]]
name = "yidam"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
fastembed = "3"
lancedb = "0.13"
# Arrow versions must match lancedb's transitive dependency; update together if needed.
arrow-array = "52"
arrow-schema = "52"
arrow-ipc = "52"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
