# NOT one of the six. A repository bootstrapped an hour ago.
#
# Nothing to measure is not divergence: a corpus with no commits and no nodes has not stopped
# doing anything. Reporting it as drift would make every new repository open with findings it
# can do nothing about.
note = "an empty corpus is unmeasurable, never divergent"
cluster = false

[measurement]
commits = 0
phase_commits = 0
off_vocabulary_commits = 0
nodes = 0
open_questions = 0

[vintage]
has_phase_verb = true
vocabulary_is_closed = true
graph_present = true

[expect]
phase-commit-share = "unmeasurable"
off-vocabulary-share = "unmeasurable"
# `nodes-per-commit` and `median-node-lines` were here and are retired (#692): both measured
# how old a repository is, which this fixture's repository — an hour old — is the clearest
# possible case of.
# A repository with no history has not stopped asking questions; there is nothing to read.
# This is the one place the `commits == 0` arm of the question-pressure rule is pinned, and
# without it a new repository would open with a divergence naming a fault it cannot have.
question-pressure = "unmeasurable"
