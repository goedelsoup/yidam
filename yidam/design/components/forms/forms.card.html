<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; padding: 20px 24px; background: var(--surface-base); }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch } = window.YidamDesignSystem_76df35;
const { useState } = React;
function Preview() {
  const [checked, setChecked] = React.useState(true);
  const [radio, setRadio] = React.useState('Extraction');
  const [sw, setSw] = React.useState(true);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Input label="Node title" placeholder="watershed-boundaries" />
        <Input label="Commit hash" error="Must be a valid SHA" placeholder="a3f2b1c" />
        <Select label="Phase type" value="Extraction"
          options={['Investigation','Extraction','Synthesis','Assessment']} onChange={()=>{}} />
        <Input label="Search corpus" placeholder="Search…" />
      </div>
      <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
        <Checkbox label="Commit as epistemic event" checked={checked} onChange={e=>setChecked(e.target.checked)} />
        <Checkbox label="Include generated nodes" checked={false} />
        <Checkbox label="Strict scope" checked={true} disabled />
      </div>
      <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
        {['Investigation','Extraction','Synthesis','Assessment'].map(p=>(
          <Radio key={p} name="phase" value={p} label={p}
            checked={radio===p} onChange={()=>setRadio(p)} />
        ))}
      </div>
      <div style={{display:'flex',gap:20,alignItems:'center'}}>
        <Switch label="Index refresh on commit" checked={sw} onChange={e=>setSw(e.target.checked)} />
        <Switch label="Strict provenance" checked={false} />
        <Switch label="Agent mode" checked={true} disabled />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
</script>
</body>
