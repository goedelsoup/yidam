<!-- @dsCard group="Brand" viewport="700x110" name="Logo" subtitle="Mark, wordmark, and full lockup" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<!--
  Every specimen here is the shipped file. The card used to rebuild the lockup out of an
  <img> and a styled <span>, which is why `logo.svg` and `wordmark.svg` could sit in the
  repository with no consumer and no one notice they had drifted from it.

  The dark specimen is `logo-dark.svg`, not the light one under a CSS filter. The filter it
  replaces — brightness(0) invert(1) — also turned the accent white, so what it showed was
  never an asset anyone could ship.
-->
<style>
  body { margin: 0; padding: 20px 28px; background: var(--surface-base);
    display: flex; align-items: center; gap: 40px; }
  .divider { width: 1px; height: 36px; background: var(--border-ui); }
  .label { font-family: var(--font-ui); font-size: 11px; color: var(--text-tertiary);
    margin-top: 6px; text-align: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .on-dark { background: var(--ink-900); padding: 10px 16px; border-radius: var(--radius-md);
    display: flex; align-items: center; }
</style>
</head>
<body>
  <div class="item">
    <img src="../assets/logo-mark.svg" height="28" alt="yidam mark">
    <div class="label">mark</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <img src="../assets/wordmark.svg" height="20" alt="yidam">
    <div class="label">wordmark</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <img src="../assets/logo.svg" height="26" alt="yidam">
    <div class="label">lockup</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="on-dark"><img src="../assets/logo-dark.svg" height="22" alt="yidam"></div>
    <div class="label">on dark</div>
  </div>
</body>
</html>
