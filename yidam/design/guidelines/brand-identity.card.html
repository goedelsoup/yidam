<!-- @dsCard group="Brand" viewport="700x110" name="Logo" subtitle="Mark, wordmark, and full lockup" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 28px; background: var(--surface-base);
    display: flex; align-items: center; gap: 40px; }
  .divider { width: 1px; height: 36px; background: var(--border-ui); }
  .label { font-family: var(--font-ui); font-size: 11px; color: var(--text-tertiary);
    margin-top: 6px; text-align: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 0; }
</style>
</head>
<body>
  <div class="item">
    <img src="../assets/logo-mark.svg" height="28" alt="yidam mark">
    <div class="label">mark</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:400;letter-spacing:0.06em;color:var(--ink-900);">yidam</span>
    <div class="label">wordmark</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="../assets/logo-mark.svg" height="26" alt="">
      <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:400;letter-spacing:0.06em;color:var(--ink-900);">yidam</span>
    </div>
    <div class="label">lockup</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div style="background:var(--ink-900);padding:10px 16px;border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;">
      <img src="../assets/logo-mark.svg" height="22" alt="" style="filter:brightness(0)invert(1)">
      <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:400;letter-spacing:0.06em;color:var(--ink-50);">yidam</span>
    </div>
    <div class="label">on dark</div>
  </div>
</body>
</html>
