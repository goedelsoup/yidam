<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Roles" subtitle="Named by intent — use these in component work" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--surface-base); display: flex; flex-direction: column; gap: 10px; }
  .group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px;
    border: 1px solid var(--border-ui); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .dot { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--border-subtle); }
  .ghead { font-family: var(--font-ui); font-size: 10px; font-weight: 500; color: var(--text-tertiary);
    letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
</style>
</head>
<body>
  <div class="group">
    <div class="ghead">surfaces</div>
    <div class="chip"><div class="dot" style="background:var(--surface-base)"></div>--surface-base</div>
    <div class="chip"><div class="dot" style="background:var(--surface-raised)"></div>--surface-raised</div>
    <div class="chip"><div class="dot" style="background:var(--surface-overlay)"></div>--surface-overlay</div>
    <div class="chip"><div class="dot" style="background:var(--surface-inverse)"></div>--surface-inverse</div>
  </div>
  <div class="group">
    <div class="ghead">text</div>
    <div class="chip"><div class="dot" style="background:var(--text-primary)"></div>--text-primary</div>
    <div class="chip"><div class="dot" style="background:var(--text-secondary)"></div>--text-secondary</div>
    <div class="chip"><div class="dot" style="background:var(--text-tertiary)"></div>--text-tertiary</div>
    <div class="chip"><div class="dot" style="background:var(--text-accent)"></div>--text-accent</div>
    <div class="chip"><div class="dot" style="background:var(--text-link)"></div>--text-link</div>
  </div>
  <div class="group">
    <div class="ghead">action</div>
    <div class="chip"><div class="dot" style="background:var(--action-bg)"></div>--action-bg</div>
    <div class="chip"><div class="dot" style="background:var(--action-bg-hover)"></div>--action-bg-hover</div>
    <div class="chip"><div class="dot" style="background:var(--border-focus)"></div>--border-focus</div>
  </div>
</body>
</html>
