<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="--text-xs through --text-6xl · DM Sans" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 28px; background: var(--surface-base);
    display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .token { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); width: 80px; flex-shrink: 0; }
  .sample { font-family: var(--font-ui); color: var(--text-primary); line-height: 1.3; }
</style>
</head>
<body>
  <div class="row"><div class="token">--text-xs</div><div class="sample" style="font-size:var(--text-xs)">Corpus node · ma/alice · 12px</div></div>
  <div class="row"><div class="token">--text-sm</div><div class="sample" style="font-size:var(--text-sm)">Node path and metadata · 14px</div></div>
  <div class="row"><div class="token">--text-base</div><div class="sample" style="font-size:var(--text-base)">Body UI text · 16px</div></div>
  <div class="row"><div class="token">--text-lg</div><div class="sample" style="font-size:var(--text-lg)">Section label · 18px</div></div>
  <div class="row"><div class="token">--text-xl</div><div class="sample" style="font-size:var(--text-xl)">Node title · 20px</div></div>
  <div class="row"><div class="token">--text-2xl</div><div class="sample" style="font-size:var(--text-2xl)">Panel heading · 24px</div></div>
  <div class="row"><div class="token">--text-3xl</div><div class="sample" style="font-size:var(--text-3xl)">Page title · 30px</div></div>
  <div class="row"><div class="token">--text-4xl</div><div class="sample" style="font-family:var(--font-display);font-size:var(--text-4xl);font-weight:400">Display heading · 36px</div></div>
  <div class="row"><div class="token">--text-5xl</div><div class="sample" style="font-family:var(--font-display);font-size:var(--text-5xl);font-weight:400;line-height:1">Hero · 48px</div></div>
</body>
</html>
