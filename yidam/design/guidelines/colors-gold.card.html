<!-- @dsCard group="Colors" viewport="700x110" name="Gold" subtitle="Primary accent — deliberate, precious, earned" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--surface-base); display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 4px; }
  .sw { flex: 1; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .lb { flex: 1; font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gold-950)"></div>
    <div class="sw" style="background:var(--gold-900)"></div>
    <div class="sw" style="background:var(--gold-800)"></div>
    <div class="sw" style="background:var(--gold-700)"></div>
    <div class="sw" style="background:var(--gold-600)"></div>
    <div class="sw" style="background:var(--gold-500)"></div>
    <div class="sw" style="background:var(--gold-400)"></div>
    <div class="sw" style="background:var(--gold-300)"></div>
    <div class="sw" style="background:var(--gold-200)"></div>
    <div class="sw" style="background:var(--gold-100)"></div>
    <div class="sw" style="background:var(--gold-50)"></div>
  </div>
  <div class="row">
    <div class="lb">950</div><div class="lb">900</div><div class="lb">800</div>
    <div class="lb">700</div><div class="lb">600</div>
    <div class="lb" style="font-weight:600;color:var(--gold-600)">500 ★</div>
    <div class="lb">400</div><div class="lb">300</div><div class="lb">200</div>
    <div class="lb">100</div><div class="lb">50</div>
  </div>
</body>
</html>
