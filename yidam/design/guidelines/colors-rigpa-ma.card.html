<!-- @dsCard group="Colors" viewport="700x140" name="Rigpa & Ma" subtitle="Settled understanding (blue) and individual voice (rose)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--surface-base); display: flex; flex-direction: column; gap: 8px; }
  .section { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 4px; }
  .sw { flex: 1; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .lb { flex: 1; font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }
  .header { font-family: var(--font-ui); font-size: 10px; font-weight: 500; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="section">
    <div class="header">rigpa — settled understanding</div>
    <div class="row">
      <div class="sw" style="background:var(--rigpa-950)"></div>
      <div class="sw" style="background:var(--rigpa-900)"></div>
      <div class="sw" style="background:var(--rigpa-700)"></div>
      <div class="sw" style="background:var(--rigpa-500)"></div>
      <div class="sw" style="background:var(--rigpa-400)"></div>
      <div class="sw" style="background:var(--rigpa-300)"></div>
      <div class="sw" style="background:var(--rigpa-200)"></div>
      <div class="sw" style="background:var(--rigpa-100)"></div>
      <div class="sw" style="background:var(--rigpa-50)"></div>
    </div>
  </div>
  <div class="section">
    <div class="header">ma — individual voice</div>
    <div class="row">
      <div class="sw" style="background:var(--ma-950)"></div>
      <div class="sw" style="background:var(--ma-900)"></div>
      <div class="sw" style="background:var(--ma-700)"></div>
      <div class="sw" style="background:var(--ma-500)"></div>
      <div class="sw" style="background:var(--ma-400)"></div>
      <div class="sw" style="background:var(--ma-300)"></div>
      <div class="sw" style="background:var(--ma-200)"></div>
      <div class="sw" style="background:var(--ma-100)"></div>
      <div class="sw" style="background:var(--ma-50)"></div>
    </div>
  </div>
</body>
</html>
