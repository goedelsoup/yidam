  <div style="font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--text-primary);line-height:1.65;max-width:560px;">The watershed <span style="background:var(--verified-bg);color:var(--verified-fg);border:1px solid var(--verified-border);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:11px;font-weight:500;">[verified]</span> functions as a bounded hydrological unit. Base flow is maintained by groundwater discharge from the fractured granite aquifer <span style="background:var(--inference-bg);color:var(--inference-fg);border:1px solid var(--inference-border);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:11px;font-weight:500;">[inference]</span> underlying the upper reaches.</div>

  <div style="font-family:var(--font-serif);font-size:13px;font-weight:300;font-style:italic;color:var(--text-tertiary);line-height:1.5;">300 light · 400 regular · 500 medium — italic variants available at each weight</div>
