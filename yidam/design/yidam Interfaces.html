        <div style={{marginLeft:'auto',display:'inline-flex',background:'var(--ink-100)',borderRadius:5,padding:2,gap:1}}>
          {[['all','All'],['active','Active'],['complete','Done']].map(([v,l])=>(
            <button key={v} onClick={()=>setFilter(v)} style={{padding:'2px 10px',borderRadius:4,fontFamily:'var(--font-ui)',fontSize:10,fontWeight:500,background:filter===v?'white':'transparent',border:'none',boxShadow:filter===v?'var(--shadow-xs)':'none',color:filter===v?'var(--text-primary)':'var(--text-secondary)',cursor:'pointer'}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* swimlane timeline */}
        <div style={{flex:1,borderRight:'1px solid var(--border-ui)',overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {/* elector headers */}
          <div style={{display:'grid',gridTemplateColumns:'70px 1fr 1fr',borderBottom:'1px solid var(--border-subtle)',flexShrink:0}}>
            <div style={{padding:'5px 8px',fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--text-tertiary)'}}>date</div>
            {ELECTORS.map(e => (
              <div key={e} style={{padding:'5px 10px',borderLeft:'1px solid var(--border-subtle)',display:'flex',alignItems:'center',gap:6,background:e==='alice'?'var(--ma-50)':'var(--rigpa-50)'}}>
                <Avatar name={e} variant={e==='alice'?'human':'agent'} size="xs"/>
                <span style={{fontFamily:'var(--font-mono)',fontSize:10,fontWeight:600,color:e==='alice'?'var(--ma-800)':'var(--rigpa-800)'}}>{e}</span>
              </div>
            ))}
          </div>

          {/* rows */}
          <div style={{flex:1,overflowY:'auto'}}>
            {/* active row */}
            <div style={{display:'grid',gridTemplateColumns:'70px 1fr 1fr',borderBottom:'1px solid var(--border-subtle)',minHeight:90}}>
              <div style={{padding:'8px',display:'flex',alignItems:'flex-start',justifyContent:'center'}}>
                <span style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--text-tertiary)',writingMode:'vertical-rl',textOrientation:'mixed',transform:'rotate(180deg)',letterSpacing:'0.05em'}}>active</span>
              </div>
              {ELECTORS.map(e => {
                const ep = filtered.filter(p=>p.elector===e&&p.status==='active');
                return (
                  <div key={e} style={{padding:'7px 8px',borderLeft:'1px solid var(--border-subtle)',display:'flex',flexDirection:'column',gap:5,background:e==='alice'?'var(--ma-50)':'var(--rigpa-50)',opacity:0.8}}>
                    {ep.map(p => {
                      const pc = PHASE_COLORS[p.type];
                      return (
                        <div key={p.id} onClick={()=>setSel(p.id)} style={{padding:'5px 7px',background:pc.bg,border:`1px solid ${sel===p.id?pc.fg:pc.bd}`,borderRadius:4,cursor:'pointer',boxShadow:sel===p.id?'var(--shadow-sm)':'none'}}>
                          <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:2}}>
                            <span style={{fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:pc.fg}}>{p.type}</span>
                            <span style={{width:5,height:5,borderRadius:'50%',background:'var(--verified-fg)',flexShrink:0,boxShadow:'0 0 0 1.5px rgba(26,82,48,0.3)'}}/>
                          </div>
                          <div style={{fontFamily:'var(--font-serif)',fontSize:10,color:'var(--text-secondary)',lineHeight:1.4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:220}}>{p.question}</div>
                        </div>
                      );
                    })}
                    {ep.length===0 && <div style={{fontFamily:'var(--font-ui)',fontSize:9,color:'var(--text-tertiary)',fontStyle:'italic',padding:'4px 0'}}>no active phase</div>}
                  </div>
                );
              })}
            </div>
            {/* history rows */}
            {[['Jun 10–17','Jun 10','Jun 17'],['Jun 12–15','Jun 12','Jun 15']].map(([label,s,e],ri) => {
              return (
                <div key={ri} style={{display:'grid',gridTemplateColumns:'70px 1fr 1fr',borderBottom:'1px solid var(--border-subtle)',minHeight:70}}>
                  <div style={{padding:'8px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:8,color:'var(--text-tertiary)',textAlign:'center',lineHeight:1.5}}>{label}</span>
                  </div>
                  {ELECTORS.map(el => {
                    const ep = filtered.filter(p=>p.elector===el&&p.status==='complete'&&p.start===(ri===0?'Jun 10':'Jun 12'));
                    return (
                      <div key={el} style={{padding:'7px 8px',borderLeft:'1px solid var(--border-subtle)',display:'flex',flexDirection:'column',gap:5}}>
                        {ep.map(p => {
                          const pc = PHASE_COLORS[p.type];
                          return (
                            <div key={p.id} onClick={()=>setSel(p.id)} style={{padding:'5px 7px',background:pc.bg,border:`1px solid ${sel===p.id?pc.fg:pc.bd}`,borderRadius:4,cursor:'pointer',opacity:0.75,boxShadow:sel===p.id?'var(--shadow-sm)':'none'}}>
                              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:1}}>
                                <span style={{fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:pc.fg}}>{p.type}</span>
                                <span style={{fontFamily:'var(--font-mono)',fontSize:8,color:'var(--text-tertiary)'}}>{p.start}→{p.end}</span>
                              </div>
                              <div style={{fontFamily:'var(--font-serif)',fontSize:10,color:'var(--text-secondary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:220}}>{p.question}</div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>

        {/* detail panel */}
        {phase && (
          <div style={{width:260,display:'flex',flexDirection:'column',overflow:'hidden',flexShrink:0}}>
            <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border-subtle)',background:'var(--ink-0)',flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <Avatar name={phase.elector} variant={phase.variant} size="xs"/>
                <BranchRef branch={`ma/${phase.elector}`} short/>
                {phase.status==='active'
                  ? <span style={{width:6,height:6,borderRadius:'50%',background:'var(--verified-fg)',flexShrink:0,marginLeft:'auto'}}/>
                  : <span style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--text-tertiary)',marginLeft:'auto'}}>done</span>}
              </div>
              {(() => { const pc=PHASE_COLORS[phase.type]; return (
                <span style={{padding:'2px 8px',borderRadius:3,fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',background:pc.bg,color:pc.fg,border:`1px solid ${pc.bd}`}}>{phase.type}</span>
              );})()}
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12}}>
              <div>
                <div style={{fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:4}}>Driving question</div>
                <div style={{fontFamily:'var(--font-serif)',fontSize:12.5,lineHeight:1.7,color:'var(--text-primary)',fontStyle:'italic'}}>"{phase.question}"</div>
              </div>
              <div>
                <div style={{fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:5}}>Affected nodes ({phase.nodes.length})</div>
                {phase.nodes.map((n,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--font-mono)',fontSize:10,color:'var(--text-secondary)',padding:'4px 0',borderBottom:'1px solid var(--border-subtle)'}}>
                    <span style={{color:'var(--gold-500)'}}>→</span>{n}
                  </div>
                ))}
              </div>
              <div>
                <div style={{fontFamily:'var(--font-ui)',fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:4}}>Notes</div>
                <div style={{fontFamily:'var(--font-serif)',fontSize:12,lineHeight:1.65,color:'var(--text-secondary)'}}>{phase.notes}</div>
              </div>
              {phase.status==='active' && (
                <div style={{display:'flex',gap:6,flexDirection:'column'}}>
                  <Button variant="ghost" size="sm">Add corpus node</Button>
                  <Button variant="primary" size="sm">Close phase</Button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   06 — App Shell · Navigable product, all surfaces wired
   ═══════════════════════════════════════════════════════════════════ */
function AppShell({ nodes, setNodes, edges, setEdges, synthTitles, setSynthTitles, conflictRes, setConflictRes }) {
  const [nav, setNav] = useState('corpus');
  const synthList = [...synthTitles];
  const openCount = 3 + synthList.filter(t=>conflictRes[t]==='open').length;
  const unresolved = synthList.filter(t=>{
    const a=ALICE_POS.find(n=>n.title===t), b=BOB_POS.find(n=>n.title===t);
    return a&&b&&a.marker!==b.marker&&!conflictRes[t];
  }).length;

  const NAV = [
    { id:'corpus',     label:'Node Editor',  meta:()=> 'draft · base-flow-regime.md' },
    { id:'ontology',   label:'Ontology',     meta:()=> `${nodes.length} class${nodes.length!==1?'es':''}${nodes.length>2?' · from bootstrap':''}` },
    { id:'resolution', label:'Resolution',   meta:()=> `${synthList.length} in synthesis` },
    { id:'bootstrap',  label:'Bootstrap',    meta:()=> `${nodes.length} class${nodes.length!==1?'es':''} · ${edges.length} edge${edges.length!==1?'s':''}` },
    { id:'health',     label:'Health',       meta:()=> `${openCount} open Qs` },
  ];

  return (
    <div style={{display:'flex',height:'100%',overflow:'hidden'}}>
      {/* sidebar */}
      <div style={{width:192,background:'var(--ink-950)',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'12px 16px 10px',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <svg width="30" height="20" viewBox="0 0 48 32" fill="none">
              <defs><marker id="sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#b88a00" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></marker></defs>
              <circle cx="5.5" cy="8" r="4.5" stroke="#413d36" strokeWidth="1.3" fill="none"/>
              <circle cx="5.5" cy="24" r="4.5" stroke="#413d36" strokeWidth="1.3" fill="none"/>
              <path d="M9.8 9.6L34.4 14.2" stroke="#b88a00" strokeWidth="1.1" strokeLinecap="round" markerEnd="url(#sm)"/>
              <path d="M9.8 22.4L34.4 17.8" stroke="#b88a00" strokeWidth="1.1" strokeLinecap="round" markerEnd="url(#sm)"/>
              <circle cx="42.5" cy="16" r="5.5" stroke="#413d36" strokeWidth="1.4" fill="none"/>
              <circle cx="42.5" cy="16" r="2.2" fill="#b88a00"/>
            </svg>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontSize:15,fontWeight:400,color:'var(--ink-200)',letterSpacing:'0.04em',lineHeight:1.1}}>yidam</div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-600)',marginTop:2}}>watershed-hydro</div>
            </div>
          </div>
        </div>
        <div style={{flex:1,padding:'6px',display:'flex',flexDirection:'column',gap:1,overflowY:'auto'}}>
          {NAV.map(item => {
            const active=nav===item.id;
            return (
              <button key={item.id} onClick={()=>setNav(item.id)}
                style={{width:'100%',textAlign:'left',padding:'8px 12px',background:active?'rgba(184,138,0,0.15)':'transparent',border:'none',borderLeft:`2px solid ${active?'var(--gold-500)':'transparent'}`,cursor:'pointer',transition:'all 120ms'}}>
                <div style={{fontFamily:'var(--font-ui)',fontSize:12,fontWeight:active?500:400,color:active?'var(--gold-300)':'var(--ink-500)',lineHeight:1.2}}>{item.label}</div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-700)',marginTop:2}}>{item.meta()}</div>
              </button>
            );
          })}
        </div>
        <div style={{padding:'10px 14px',borderTop:'1px solid rgba(255,255,255,0.07)',display:'flex',flexDirection:'column',gap:5}}>
          <BranchRef branch="ma/alice"/>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-600)'}}>
            {synthList.length} in synthesis · {openCount} open Qs
          </div>
        </div>
      </div>

      {/* main */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* topbar */}
        <div style={{padding:'6px 18px',background:'var(--ink-0)',borderBottom:'1px solid var(--border-subtle)',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span style={{fontFamily:'var(--font-display)',fontSize:15,fontWeight:500,color:'var(--text-primary)'}}>{NAV.find(n=>n.id===nav)?.label}</span>
          {nav==='ontology' && nodes.length>0 && <Badge size="sm" variant="rigpa">schema from bootstrap · {nodes.length} classes · {edges.length} edges</Badge>}
          {nav==='ontology' && nodes.length===0 && <Badge size="sm">static · go to Bootstrap first</Badge>}
          {nav==='resolution' && <Badge size="sm" variant={synthList.length>0?'inference':'default'}>{synthList.length} nodes · wired to health</Badge>}
          {nav==='health' && <Badge size="sm" variant="verified" dot>live · wired to resolution</Badge>}
          {nav==='bootstrap' && nodes.length>0 && <Badge size="sm" variant="gold">{nodes.length} classes → ontology</Badge>}
          <div style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:10,color:'var(--text-tertiary)'}}>
            {(nav==='resolution'||nav==='health') && (synthList.length===0?'no synthesis active':unresolved>0?`⚑ ${unresolved} conflict${unresolved>1?'s':''} pending`:'✓ Art. V clear')}
          </div>
        </div>
        {/* surface */}
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {nav==='corpus'     && <NodeEditor1a/>}
          {nav==='ontology'   && <OntologyCanvas key={nodes.length} importedNodes={nodes} importedEdges={edges}/>}
          {nav==='resolution' && <Resolution3a synthTitles={synthTitles} setSynthTitles={setSynthTitles} conflictRes={conflictRes} setConflictRes={setConflictRes}/>}
          {nav==='bootstrap'  && <BootstrapWizardA nodes={nodes} setNodes={setNodes} edges={edges} setEdges={setEdges}/>}
          {nav==='health'     && <HealthDashboard synthTitles={synthTitles} conflictRes={conflictRes}/>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   App — canvas layout
   ═══════════════════════════════════════════════════════════════════ */
const FULLW = 1600, HALFW = 900, GAP = 80;

function App() {
  const [synthTitles, setSynthTitles] = useState(new Set(['Watershed Boundaries','Lowflow Thresholds']));
  const [conflictRes, setConflictRes] = useState({});
  const [bootNodes, setBootNodes] = useState(SEED_NODES);
  const [bootEdges, setBootEdges] = useState([]);
  const sharedProps = { nodes:bootNodes, setNodes:setBootNodes, edges:bootEdges, setEdges:setBootEdges, synthTitles, setSynthTitles, conflictRes, setConflictRes };
  return (
    <div style={{position:'relative',width:FULLW+GAP*2,minHeight:5360,paddingBottom:80}}>
      <SLabel x={GAP} y={28}   num="01" title="Node Editor"          sub="Writing and committing corpus nodes — authorship as testimony"/>
      <Frame  id="1a" label="Writer's Desk — split edit/preview, inline claim toolbar, commit composer" x={GAP} y={96}   w={HALFW} h={560}><NodeEditor1a/></Frame>

      <SLabel x={GAP} y={730}  num="02" title="Ontology Canvas"      sub="Designing the schema layer — spatial diagram or schema table, toggle between views"/>
      <Frame  id="2"  label="Switchable: Spatial Diagram ↔ Schema Table — wired to Bootstrap (4a): classes + edges flow in when available" x={GAP} y={798}  w={FULLW} h={516}><OntologyCanvas key={bootNodes.length} importedNodes={bootNodes} importedEdges={bootEdges}/></Frame>

      <SLabel x={GAP} y={1386} num="03" title="Resolution Interface"  sub="Synthesising ma/* positions — Article V provenance strip, inline marker conflict resolver"/>
      <Frame  id="3a" label="Three Columns — wired to 5a: synthesis state drives S8 + open ratio live" x={GAP} y={1454} w={FULLW} h={634}><Resolution3a synthTitles={synthTitles} setSynthTitles={setSynthTitles} conflictRes={conflictRes} setConflictRes={setConflictRes}/></Frame>

      <SLabel x={GAP} y={2168} num="04" title="Bootstrap Wizard"      sub="Dialogue → Schema → Genesis commit — conversation builds the live sketch, then advances through schema review"/>
      <Frame  id="4a" label="Three connected stages — type + Enter advances dialogue; schema and Ontology Canvas share the same class list" x={GAP} y={2236} w={FULLW} h={620}><BootstrapWizardA nodes={bootNodes} setNodes={setBootNodes} edges={bootEdges} setEdges={setBootEdges}/></Frame>

      <SLabel x={GAP} y={2896} num="05" title="Health Dashboard"      sub="S1–S7 structural checks and Q1–Q7 quality checks — click any row to expand affected nodes"/>
      <Frame  id="5a" label="Full-width — wired to 3a: S8 synthesis status + S6 open ratio update live as you work" x={GAP} y={2964} w={FULLW} h={570}><HealthDashboard synthTitles={synthTitles} conflictRes={conflictRes}/></Frame>

      <SLabel x={GAP} y={3614} num="06" title="App Shell" sub="All five surfaces in one navigable product — go to Bootstrap, answer questions, switch to Ontology to see the schema appear"/>
      <Frame id="6a" label="Navigate: Bootstrap → Ontology (schema flows through) · Resolution → Health (synthesis state wired) · sidebar tracks live counts" x={GAP} y={3682} w={FULLW} h={800}><AppShell {...sharedProps}/></Frame>

      <SLabel x={GAP} y={4562} num="07" title="Connector Status" sub="External async adapters — freshness, opportunistic retrieval threshold, fixture staleness, manual refresh"/>
      <Frame id="7a" label="Connector panel — nwis / echo / census · freshness bars · opportunistic threshold indicator" x={GAP} y={4630} w={760} h={600}><ConnectorStatus/></Frame>

      <SLabel x={GAP+760+GAP} y={4562} num="08" title="Phase Dashboard" sub="Active inquiry phases per elector — timeline, affected nodes, driving questions"/>
      <Frame id="8a" label="Phase timeline — Investigation / Extraction / Synthesis / Assessment · per-elector swimlane" x={GAP+760+GAP} y={4630} w={760} h={600}><PhaseDashboard/></Frame>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
