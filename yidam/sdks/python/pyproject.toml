[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yidam-core"
version = "0.12.0"
description = "Yidam corpus types and parity surface — Python reference implementation"
requires-python = ">=3.11"
# The ontology compiler reads `.ont.yml`. This is the package's first runtime dependency,
# and it is a deliberate trade: the alternative is a hand-rolled YAML subset parser, which
# is exactly the drift the parity surface exists to prevent — three languages each guessing
# at a format none of them owns.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed for the embed_config parity runner (YIDAM_EMBED_PARITY=1);
# the test skips itself when sentence-transformers is not installed.
embed = ["sentence-transformers>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `mise run py-lint` (#1646). Ruff's defaults, less three rules whose rewrites would move this
# package's control flow away from the TypeScript and Rust implementations it is held equal
# to by the parity fixtures: a reader comparing the three should find the same shape.
[tool.ruff.lint]
extend-ignore = [
  "FURB188", # an endswith/slice pair as removesuffix: _text.py and uri.py mirror TS's `slice`
  "PIE810",  # two startswith calls as one tuple call: markers.py lists its cases as TS does
  "SIM103",  # a final `if c: return False / return True` as `return not c`: uri.py keeps one
             # early return per rule, as the other two do
]

# Basic mode: the type errors, not the annotation coverage. `yidam_kit` is the calculator kit
# in yidam/prelude/kit, which tests/test_calculator_kit.py puts on sys.path itself at run time.
#
# `pythonVersion` is `requires-python`'s floor. Without it pyright takes the version of
# whichever `python` is first on PATH, not the venv's — a macOS system 3.9 reports every
# `X | None` and `import tomllib` here as an error.
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["../../prelude/kit"]
