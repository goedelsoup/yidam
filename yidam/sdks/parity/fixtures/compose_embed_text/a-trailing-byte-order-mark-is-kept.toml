function = "compose_embed_text"
description = "U+FEFF is not White_Space, so the end of a value is not trimmed back past it (#1699)"

[input]
content = """
class: measure
label: L
description: "x\\uFEFF"
"""
prose_keys = ["description"]
prose_properties = []
retrievable_properties = []

[expected]
text = "L x\uFEFF"
