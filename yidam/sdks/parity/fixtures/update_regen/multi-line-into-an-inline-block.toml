function = "update_regen"
description = "A value that will not fit on one line is not written into an inline block that shares its line. Block form is read by line, and in the middle of a sentence the open tag would become prose and the block would never be read again (#1137)"

[input]
command = "yidam count district"
new_content = """
one
two"""
content = """
Ohio has <!-- REGEN: yidam count district -->43<!-- /REGEN --> districts.
"""

[expected]
content = """
Ohio has <!-- REGEN: yidam count district -->43<!-- /REGEN --> districts.
"""
