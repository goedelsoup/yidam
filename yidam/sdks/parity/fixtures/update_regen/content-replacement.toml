function = "update_regen"
description = "Replace REGEN content; opening comment, inner comment block, and closing tag must be preserved verbatim"

[input]
command = "yidam status"
new_content = "**12 nodes** · 3 open · index fresh"
content = """
## Status

<!-- REGEN: yidam status
Fields: node count, open questions.
-->
_Run `yidam status` to populate._
<!-- /REGEN -->
"""

[expected]
content = """
## Status

<!-- REGEN: yidam status
Fields: node count, open questions.
-->
**12 nodes** · 3 open · index fresh
<!-- /REGEN -->
"""
