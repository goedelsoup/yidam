function = "parse_markers"
description = "A block written inline, in the middle of a sentence, is a block — the form RFC-0043 adds and #1094 showed was read by neither scanner the same way"

[input]
content = """
Ohio has <!-- REGEN: yidam count district -->44<!-- /REGEN --> districts.
"""

[[expected]]
kind = "Regen"
command = "yidam count district"
content = "44"
