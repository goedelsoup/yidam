[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yidam-core"
version = "0.1.0"
description = "Yidam corpus types and parity surface — Python reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed for the embed_config parity runner (YIDAM_EMBED_PARITY=1);
# the test skips itself when sentence-transformers is not installed.
embed = ["sentence-transformers>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
