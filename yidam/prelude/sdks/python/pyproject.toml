[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yidam-core"
version = "0.4.0"
description = "Yidam corpus types and parity surface — Python reference implementation"
requires-python = ">=3.11"
# The ontology compiler reads `.ont.yml`. This is the package's first runtime dependency,
# and it is a deliberate trade: the alternative is a hand-rolled YAML subset parser, which
# is exactly the drift the parity surface exists to prevent — three languages each guessing
# at a format none of them owns.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed for the embed_config parity runner (YIDAM_EMBED_PARITY=1);
# the test skips itself when sentence-transformers is not installed.
embed = ["sentence-transformers>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
