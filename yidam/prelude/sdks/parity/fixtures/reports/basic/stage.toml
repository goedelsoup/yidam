# How this fixture becomes a repository.
#
# The reports cannot run against a bare directory — `repo_root()` shells out to
# `git rev-parse --show-toplevel` — so every harness that uses this fixture has to build a
# git repository out of `repo/` first. Seven of them did, in seven copies, and they did not
# agree: the Rust goldens staged three commits and two branches, five of the extension's
# test files staged one commit and no branch, and a sixth staged one commit and two
# branches. So `phases` had rows for the goldens and none for the extension, and the claim
# tags the goldens count did not exist in the tree the extension was exercised on — while
# both were reading `expected/` as though it described the same repository.
#
# The recipe lives here for the same reason `diagnostic_severity/` does: the runners may be
# per-language, but the thing they agree about must have one copy.
#
# Commit dates are fixed by the runners, not here — `status` reports a genesis date, and a
# fixture whose genesis moves with the clock has a golden that cannot be compared.

# One ref of each kind, because they are three different things and the reports that read
# them spent a long time pretending otherwise. `ma/*` is a standing elector position and
# never settles; `rigpa/*` and `phase/*` are bounded work that does.
#
# `phase/*` is here because it was in no fixture at all, and that is exactly why nothing
# caught `yidam status` counting `ma/*` and `rigpa/*` as phases while never reading the
# namespace PHASES.md defines a phase in. A derived repository reported 26 active phases
# while holding one. Remove this branch and the goldens stop being able to see that.
#
# All three are created at HEAD and so carry no unique commits, which makes the two bounded
# ones read as settled. That is the correct reading — a branch with nothing ahead of the
# baseline has nothing in flight — and the `active` arm is exercised by unit tests that can
# afford to build commits.
branches = ["ma/hydrologist", "rigpa/tailwater-regime", "phase/low-flow-survey"]

[[commits]]
message = "genesis: reports fixture"

# A second commit so `diff HEAD~1..HEAD` has a range to report on, and one that exercises
# the modified-node arm rather than only add and remove.
[[commits]]
message = "revise: the corpus carries a claim tag of each kind"

[[commits.replace]]
file = ".yidam/corpus/concept/tailwater.yml"
from = "Water downstream of a structure."
to = "Water downstream of a structure. [inference]"

# The verified arm. It used to be here as an edit against tailwater.yml naming a string
# that lives in low-flow.yml, so `String::replace` found nothing and did nothing, and
# `claims_verified` read 0 for reasons no one had chosen.
#
# The second sentence is a claim **in backticks**, and it must count. Without it the fixture
# could not tell the current rule from the typographic one it replaced: tailwater's two
# mentions are silenced under either, so re-introducing "a backticked tag is a mention" would
# move no golden and no test would notice. A corpus that reported this defect writes 80% of
# its `[open]` claims exactly like this one.
[[commits.replace]]
file = ".yidam/corpus/gauge/riffle-station.yml"
from = "A stage gauge at the riffle."
to = "A stage gauge at the riffle. [verified] Whether it reads low flow comparably is `[open]`."

# One operational commit, so the log goldens show the split rather than a column of [E].
# A fixture whose history is all one kind cannot demonstrate a classifier.
[[commits]]
message = "regen: REGEN blocks refreshed"

[[commits.write]]
file = ".yidam/corpus/.gitkeep"
content = ""

# A domain crate, so `check-diff` has code to read and the golden pins something other than
# the empty arm. Written by this commit rather than shipped in `repo/`, because the check
# reads a *diff*: a file that has always been there introduces nothing.
#
# The four declarations are the four outcomes. `Gauge` matches a class, `Datum` matches a
# property — which is what stops the vocabulary quietly narrowing to class names alone —
# `RatingCurve` matches nothing at all, and `Measurement` matches nothing while sharing a
# root with `measured-by`, so it is the finding that carries a `nearest`. `Reads` is a trait
# and is never asked about, which no unit test can pin here: only a golden shows it absent
# from real output.
[[commits.write]]
file = "crates/gauge/src/lib.rs"
content = '''
//! A domain crate, so the alignment check has code to read.

/// Matches the `gauge` class.
pub struct Gauge {
    pub station: String,
}

/// Matches the `datum` property, and nothing else — the ontology's vocabulary is wider
/// than its class list, and a check that read only class names would ask about this.
pub enum Datum {
    Navd88,
    Local,
}

/// Nothing the ontology declares is named `rating-curve`, and nothing shares a root with
/// it either, so this finding is offered no candidate.
pub struct RatingCurve {
    pub gauge: Gauge,
}

/// Nothing the ontology declares is named `measurement` — but `measured-by` shares the root
/// `measure`, which is the near-miss the report hands the reader rather than making them
/// find it against the whole vocabulary.
pub struct Measurement {
    pub gauge: Gauge,
    pub datum: Datum,
}

/// A capability rather than a concept, so this is never asked about.
pub trait Reads {
    fn read(&self) -> f64;
}
'''
