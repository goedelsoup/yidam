function = "embed_config"
description = "Same sentence embeds to matching vectors across fastembed (Rust), transformers.js (TS), and sentence-transformers (Python)"

[input]
text = "knowledge graph traversal"
model_id = "Xenova/all-MiniLM-L6-v2"
# fastembed resolves "Xenova/all-MiniLM-L6-v2" to its quantized variant
# (AllMiniLML6V2Q). Consumers must load the same weights file: the fp32
# export of the same model drifts ~1e-3 per element from these values.
model_file = "onnx/model_quantized.onnx"
pooling = "mean"
normalize = true

[expected]
embedding_dim = 384
# First 8 dimensions of the normalized output vector, from the Rust
# reference run (fastembed). Tolerance is per element; float32 rounding
# differs slightly across libraries.
tolerance = 1e-5
prefix = [
  0.00056339556,
  0.02281035,
  -0.016069235,
  0.0549649,
  -0.010049075,
  -0.053605214,
  0.038674183,
  -0.011899897,
]
# The runtimes that produced `prefix`, so the reference is a measurement with a
# provenance rather than eight anonymous floats. `reference` recorded it;
# `conforming` is each other runtime that loads `model_file` and was measured
# against it, at the version it was measured at.
#
# It is load-bearing. These dimensions are the ONNX Runtime 1.28+ answer: the
# quantized kernels moved at `ort` rc.12 to rc.13, and fastembed 4.9.1 and
# transformers.js 3.8.1 (ORT 1.21) answered ~3e-4 away — prefix[0] was
# 0.0008519883. The fixture moved once, for both runtimes, when transformers.js
# 4.3.0 (onnxruntime-node 1.30) landed within 1e-9 of fastembed 7.1.0 (#536).
# `dependency_holds.rs` asserts that the major each lockfile resolves is the
# major recorded here, so a bump on either side is a red gate rather than a
# fixture nobody noticed had stopped agreeing.
reference = { runtime = "fastembed", version = "7.1.0" }
conforming = { "@huggingface/transformers" = "4.3.0" }

# sentence-transformers cannot load the quantized ONNX export; it runs the
# original fp32 PyTorch weights (sentence-transformers/all-MiniLM-L6-v2).
# Same model, different precision: elements drift up to ~8e-3 from the
# quantized reference (measured on this sentence). A consumer that cannot
# load model_file must either accept this looser bound or degrade to
# keyword search.
[known_delta.sentence-transformers]
tolerance = 1e-2
