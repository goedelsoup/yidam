class: concept
label: Concept
description: A unit of understanding in the MCP conformance corpus.
properties:
  # A typed evidence tag. Declaring it is what makes the third arm of the
  # open-question predicate reachable at all: without a `type: claim` property the
  # arm reads nothing and the predicate is exactly the two-arm one. `embedding-space`
  # is the node that depends on this declaration.
  - name: claim_tag
    type: claim
    description: The evidence standing of this node, as a tag rather than as prose.
edges:
  - relationship: enables
    target: concept
    direction: out
    description: The source makes the target possible.
  - relationship: relates-to
    target: concept
    direction: out
    description: A bare association between two concepts.
  # Declared and authored by nothing, deliberately. It is the only way to reach
  # `relationship-unauthored`: a relationship a class licenses and no instance uses is
  # either an ontology that reached past its corpus or a gap worth an open question, and
  # from outside it is indistinguishable from a name that was mistyped. Without a
  # declaration nobody has used, that arm cannot be told from `relationship-unknown` by
  # any case in this directory.
  - relationship: supersedes
    target: concept
    direction: out
    description: A concept this one replaces. Declared here and used by no instance.
