class: concept
label: Concept
description: A unit of understanding in the MCP conformance corpus.
properties:
  # A typed evidence tag. Declaring it is what makes the third arm of the
  # open-question predicate reachable at all: without a `type: claim` property the
  # arm reads nothing and the predicate is exactly the two-arm one. `embedding-space`
  # is the node that depends on this declaration.
  - name: claim_tag
    type: claim
    description: The evidence standing of this node, as a tag rather than as prose.
edges:
  - relationship: enables
    target: concept
    direction: out
    description: The source makes the target possible.
  - relationship: relates-to
    target: concept
    direction: out
    description: A bare association between two concepts.
