[package]
name = "yidam-core"
version = "0.3.0"
edition = "2021"
description = "Yidam corpus types and parity surface — Rust reference implementation"
license = "MIT"
repository = "https://github.com/goedelsoup/yidam"
# The CLI depends on this crate and pins 1.85; a `yidam-core` that required newer would
# make the CLI's own MSRV a fiction.
rust-version = "1.85"

[lib]
name = "yidam_core"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
# The ontology compiler reads `.ont.yml` and emits JSON Schema. Both are the corpus's own
# serialization formats rather than this crate reaching for a convenience.
serde_yaml = "0.9"
serde_json = "1"
