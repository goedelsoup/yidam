# The reading routes: what a session reads before substantive action, by occasion (RFC-0039).
#
# `yidam routes` renders this file into the `<!-- REGEN: yidam routes -->` block of a derived
# repository's AGENTS.md, and a test holds the template's two AGENTS.md files to the same
# rendering. Edit the routes here, never in the block.
#
# Every `read:` is a path relative to this directory. A `#fragment` names one `##` or `###`
# heading, and the section runs from that heading to the next one at the same level or higher.
# No fragment means the whole file. Word ceilings for each occasion are in
# `yidam/cli/tests/prelude_rules_and_evidence.rs`.
#
# An occasion is named by the commit verb it ends in, from GRAPH.md's closed vocabulary,
# because every agent has to choose a verb anyway. Where the verb and PHASES.md's phase types
# disagree about where an act belongs, the verb wins here.

always:
  - read: GLOSSARY.md
    label: Glossary
    gloss: "*rigpa*, *ma*, *samudaya*, *sadhana*, *kuten*, *tonpa*, *sangha*"
  - read: IDENTITY.md
    label: Identity
    gloss: what this kind of repository is
  - read: GRAPH.md#encoding
    label: Encoding
    gloss: how git encodes knowledge
  - read: GRAPH.md#nodes
    label: Nodes
  - read: GRAPH.md#edges
    label: Edges

occasions:
  - heading: Before you write or revise a node
    verbs: [establish, revise, withdraw]
    read:
      - read: GRAPH.md#the-class-contract
        label: The class contract
        gloss: what an instance may carry, and what `yidam lint` checks it against
      - read: guidelines/directories.md#yidamcorpus
        label: "`.yidam/corpus/`"
      - read: guidelines/agent-conduct.md#mark-claim-confidence
        label: Mark claim confidence
        gloss: the `[verified]` / `[inference]` / `[open]` tags, and why an edge is a claim

  - heading: Before you run a phase
    verbs: [phase, assess, scope, synthesize, extract, open, close]
    read:
      - read: PHASES.md
        label: Phases
        gloss: how a unit of inquiry is bounded and committed
      - read: GRAPH.md#commits-as-events
        label: Commits as events
      - read: GRAPH.md#commit-vocabulary
        label: Commit vocabulary
      - read: GRAPH.md#branches-as-inquiry
        label: Branches as inquiry

  - heading: Before a claim crosses a corpus boundary
    note: A `cites:` written or received, or a claim leaving this repository.
    read:
      - read: guidelines/agent-conduct.md#prefer-a-base-rate-to-a-refusal
        label: Prefer a base rate to a refusal
      - read: guidelines/agent-conduct.md#when-claims-leave-the-repository
        label: When claims leave the repository
      - read: guidelines/agent-conduct.md#when-claims-arrive-from-another-repository
        label: When claims arrive from another repository
      - read: guidelines/agent-conduct.md#when-a-claim-rests-on-a-node-beside-it
        label: When a claim rests on a node beside it
      - read: guidelines/agent-conduct.md#when-your-corpus-disagrees-with-the-one-it-cites
        label: When your corpus disagrees with the one it cites
      - read: guidelines/directories.md#yidamcatalog
        label: "`.yidam/catalog/`"

  - heading: Before you change a class
    verbs: [decide, migrate]
    note: A `decide` about the ontology, or a `migrate` that moves one.
    read:
      - read: GRAPH.md#the-class-contract
        label: The class contract
      - read: guidelines/directories.md#yidamdecisions
        label: "`.yidam/decisions/`"

  - heading: Before you retrieve
    note: Before any of the above, once the corpus is too large to hold in view.
    read:
      - read: guidelines/reading-the-corpus.md
        label: Reading the corpus
        gloss: the retrieval half of the loop, and why `grep` cannot answer what you are asking

reference:
  - read: GLOSSARY.md
    label: Glossary
    gloss: the shortest file here and the one every other assumes
  - read: IDENTITY.md
    label: Identity
    gloss: what this kind of repository is
  - read: GRAPH.md
    label: Graph model
    gloss: how git encodes knowledge
  - read: guidelines/agent-conduct.md
    label: Agent conduct
    gloss: behavioral norms, including the `[verified]` / `[inference]` / `[open]` claim tags
  - read: guidelines/reading-the-corpus.md
    label: Reading the corpus
    gloss: the retrieval half of the loop, and why `grep` cannot answer what you are asking
  - read: guidelines/directories.md
    label: Directory conventions
    gloss: what belongs where
  - read: guidelines/upstream.md
    label: Upstream
    gloss: what an yidam-level change is, and how to send a defect or a misfit back to the template that constitutes this repository
  - read: PHASES.md
    label: Phases
    gloss: how a unit of inquiry is bounded and committed
  - read: CONSTITUTION.md
    label: Constitution
    gloss: binding on every resolution event *(collective governance only; dormant in a single-elector repository)*
