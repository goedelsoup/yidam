# The claim a `file://` vault is mounted from. An `s3://` corpus leaves this component out.
#
# `ReadWriteMany`, because pin, step and land are scheduled on any node. Nothing in it is a
# working tree: pods write new bundle digests and read old ones (RFC-0026 §7).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pvc.yml
