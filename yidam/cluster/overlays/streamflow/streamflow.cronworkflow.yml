# Generated by `yidam cluster workflow` from .yidam/capabilities.toml. Regenerate rather than edit.
#
# One run of this corpus's capability manifest on Argo Workflows (RFC-0026 §7). A pin,
# then for each step in dependency order a `step` and a `land`. The invariant that a
# run authors operational commits and only proposes epistemic ones is not a check any
# of these pods performs; it is which pod holds the credential:
#
#   pin, admit  mount  yidam-streamflow-git-read   and can read the remote
#   step        mounts no git secret               and has no flag that names a ref
#   land        mounts yidam-streamflow-git-write  and is the only pod that can move one
#
# Every name is this corpus's own, so no other corpus's lander holds its write key.
# What crosses between tasks is the vault digest of a git bundle, never a shared
# volume holding a checkout. Pod logs are not provenance: everything that matters is
# in the receipt, in the commit, on the ref.
#
# steps: catalog-fetch → catalog-extract → catalog-reconcile → travel-tier → disclosure-envelope → travel-tier-typed
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: yidam-streamflow
  labels:
    yidam.dev/corpus: "streamflow"
spec:
  schedules:
    - "0 6 * * *"
  # One tick at a time: a tick while a run is landing is skipped, not queued. The
  # workflow's mutex is what keeps a cron run and a push run apart.
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: run
    # One run of this corpus at a time, however it was submitted. A run submitted while
    # another lands waits here, then asks `admit` about the tip the first one left.
    synchronization:
      mutexes:
        - name: "yidam-streamflow"
    serviceAccountName: "yidam-streamflow-run"
    # No pod gets a Kubernetes token in its main container; the executor sidecar has its own.
    automountServiceAccountToken: false
    # A pod that succeeded is deleted at once; a failed one stays with its workflow.
    podGC:
      strategy: OnPodSuccess
    ttlStrategy:
      secondsAfterSuccess: 86400
      secondsAfterFailure: 604800
    executor:
      serviceAccountName: "yidam-streamflow-run"
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/goedelsoup/yidam-cluster:latest"
        - name: remote
          value: "git@github.com:goedelsoup/streamflow.git"
        - name: branch
          value: "main"
        - name: vault-url
          value: "file:///var/yidam/vault"
    volumes:
      - name: git-read
        secret:
          secretName: "yidam-streamflow-git-read"
          defaultMode: 256
      # The one credential that can move a ref. Mounted by `land` and by nothing else.
      - name: git-write
        secret:
          secretName: "yidam-streamflow-git-write"
          defaultMode: 256
      # Every root filesystem is read-only, so these are the only places a pod writes.
      - name: scratch
        emptyDir: {}
      - name: home
        emptyDir: {}
      # A file:// vault: a content-addressed store of immutable bundles, mounted at
      # /var/yidam/vault on every pod. This is not a corpus checkout on a shared volume — nothing
      # in it is a working tree, and no pod writes anything but a new digest into it.
      - name: vault
        persistentVolumeClaim:
          claimName: "yidam-streamflow-vault"
    templates:
      - name: run
        dag:
          tasks:
            - name: admit
              template: admit
            # Nothing below runs unless admission says so. A corpus with nothing owed
            # submits no run — this task is the whole workflow that ran.
            - name: pin
              template: pin
              depends: admit.Succeeded
              when: "{{=jsonpath(tasks['admit'].outputs.parameters.output, '$.admitted') == true}}"
            - name: step-catalog-fetch
              template: step-catalog-fetch
              depends: pin.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "catalog-fetch"
                  - name: bundle
                    value: "{{=jsonpath(tasks['pin'].outputs.parameters.output, '$.bundle')}}"
            - name: land-catalog-fetch
              template: land
              depends: step-catalog-fetch.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-catalog-fetch.outputs.parameters.output}}"
            - name: step-catalog-extract
              template: step
              depends: land-catalog-fetch.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "catalog-extract"
                  - name: bundle
                    value: "{{=jsonpath(tasks['land-catalog-fetch'].outputs.parameters.output, '$.next.bundle')}}"
            - name: land-catalog-extract
              template: land
              depends: step-catalog-extract.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-catalog-extract.outputs.parameters.output}}"
            - name: step-catalog-reconcile
              template: step
              depends: land-catalog-extract.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "catalog-reconcile"
                  - name: bundle
                    value: "{{=jsonpath(tasks['land-catalog-extract'].outputs.parameters.output, '$.next.bundle')}}"
            - name: land-catalog-reconcile
              template: land
              depends: step-catalog-reconcile.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-catalog-reconcile.outputs.parameters.output}}"
            - name: step-travel-tier
              template: step
              depends: land-catalog-reconcile.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "travel-tier"
                  - name: bundle
                    value: "{{=jsonpath(tasks['land-catalog-reconcile'].outputs.parameters.output, '$.next.bundle')}}"
            - name: land-travel-tier
              template: land
              depends: step-travel-tier.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-travel-tier.outputs.parameters.output}}"
            - name: step-disclosure-envelope
              template: step
              depends: land-travel-tier.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "disclosure-envelope"
                  - name: bundle
                    value: "{{=jsonpath(tasks['land-travel-tier'].outputs.parameters.output, '$.next.bundle')}}"
            - name: land-disclosure-envelope
              template: land
              depends: step-disclosure-envelope.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-disclosure-envelope.outputs.parameters.output}}"
            - name: step-travel-tier-typed
              template: step
              depends: land-disclosure-envelope.Succeeded
              arguments:
                parameters:
                  - name: step
                    value: "travel-tier-typed"
                  - name: bundle
                    value: "{{=jsonpath(tasks['land-disclosure-envelope'].outputs.parameters.output, '$.next.bundle')}}"
            - name: land-travel-tier-typed
              template: land
              depends: step-travel-tier-typed.Succeeded
              arguments:
                parameters:
                  - name: step-output
                    value: "{{tasks.step-travel-tier-typed.outputs.parameters.output}}"
      - name: pin
        metadata:
          labels:
            yidam.dev/corpus: "streamflow"
            yidam.dev/egress: "remote"
        outputs:
          parameters:
            - name: output
              valueFrom:
                path: /tmp/yidam/out.json
        activeDeadlineSeconds: 3600
        retryStrategy:
          limit: 2
          retryPolicy: Always
          backoff:
            duration: "30s"
            factor: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: "{{workflow.parameters.image}}"
          command: ["yidam", "cluster", "pin"]
          args:
            - "--remote"
            - "{{workflow.parameters.remote}}"
            - "--branch"
            - "{{workflow.parameters.branch}}"
            - "--vault-url"
            - "{{workflow.parameters.vault-url}}"
            - "--out"
            - "/tmp/yidam/out.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TMPDIR
              value: "/tmp/yidam"
            - name: HOME
              value: "/home/yidam"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/yidam/git/key -o UserKnownHostsFile=/etc/yidam/git/known_hosts -o IdentitiesOnly=yes"
          # Vault credentials, for an s3:// vault; absent for file://, which needs none.
          envFrom:
            - secretRef:
                name: "yidam-streamflow-vault"
                optional: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp/yidam
            - name: home
              mountPath: /home/yidam
            - name: git-read
              mountPath: /etc/yidam/git
              readOnly: true
            - name: vault
              mountPath: "/var/yidam/vault"
      - name: step
        metadata:
          labels:
            yidam.dev/corpus: "streamflow"
            yidam.dev/egress: "vault"
        # No git secret and no remote: this pod computes a commit it cannot land.
        inputs:
          parameters:
            - name: step
            - name: bundle
        outputs:
          parameters:
            - name: output
              valueFrom:
                path: /tmp/yidam/out.json
        activeDeadlineSeconds: 3600
        retryStrategy:
          limit: 2
          retryPolicy: Always
          backoff:
            duration: "30s"
            factor: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: "{{workflow.parameters.image}}"
          command: ["yidam", "cluster", "step", "{{inputs.parameters.step}}"]
          args:
            - "--bundle"
            - "{{inputs.parameters.bundle}}"
            - "--image"
            - "{{workflow.parameters.image}}"
            - "--vault-url"
            - "{{workflow.parameters.vault-url}}"
            - "--out"
            - "/tmp/yidam/out.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TMPDIR
              value: "/tmp/yidam"
            - name: HOME
              value: "/home/yidam"
          # Vault credentials, for an s3:// vault; absent for file://, which needs none.
          envFrom:
            - secretRef:
                name: "yidam-streamflow-vault"
                optional: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp/yidam
            - name: home
              mountPath: /home/yidam
            - name: vault
              mountPath: "/var/yidam/vault"
      - name: step-catalog-fetch
        metadata:
          labels:
            yidam.dev/corpus: "streamflow"
            yidam.dev/egress: "internet"
        # No git secret and no remote: this pod computes a commit it cannot land.
        inputs:
          parameters:
            - name: step
            - name: bundle
        outputs:
          parameters:
            - name: output
              valueFrom:
                path: /tmp/yidam/out.json
        activeDeadlineSeconds: 3600
        retryStrategy:
          limit: 2
          retryPolicy: Always
          backoff:
            duration: "30s"
            factor: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: "{{workflow.parameters.image}}"
          command: ["yidam", "cluster", "step", "{{inputs.parameters.step}}"]
          args:
            - "--bundle"
            - "{{inputs.parameters.bundle}}"
            - "--image"
            - "{{workflow.parameters.image}}"
            - "--vault-url"
            - "{{workflow.parameters.vault-url}}"
            - "--out"
            - "/tmp/yidam/out.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TMPDIR
              value: "/tmp/yidam"
            - name: HOME
              value: "/home/yidam"
          # Vault credentials, for an s3:// vault; absent for file://, which needs none.
          envFrom:
            - secretRef:
                name: "yidam-streamflow-vault"
                optional: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp/yidam
            - name: home
              mountPath: /home/yidam
            - name: vault
              mountPath: "/var/yidam/vault"
      - name: land
        metadata:
          labels:
            yidam.dev/corpus: "streamflow"
            yidam.dev/egress: "remote"
        # The lander. It classifies the commit by its own subject line, chooses the ref
        # the class permits, and writes it with a compare-and-swap. No retryStrategy: it
        # retries its own race, and a refusal it reaches is the answer, not a fault.
        inputs:
          parameters:
            - name: step-output
        outputs:
          parameters:
            - name: output
              valueFrom:
                path: /tmp/yidam/out.json
        activeDeadlineSeconds: 3600
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: "{{workflow.parameters.image}}"
          command: ["yidam", "cluster", "land"]
          args:
            - "--step-output"
            - "{{inputs.parameters.step-output}}"
            - "--remote"
            - "{{workflow.parameters.remote}}"
            - "--branch"
            - "{{workflow.parameters.branch}}"
            - "--vault-url"
            - "{{workflow.parameters.vault-url}}"
            - "--out"
            - "/tmp/yidam/out.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TMPDIR
              value: "/tmp/yidam"
            - name: HOME
              value: "/home/yidam"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/yidam/git/key -o UserKnownHostsFile=/etc/yidam/git/known_hosts -o IdentitiesOnly=yes"
          # Vault credentials, for an s3:// vault; absent for file://, which needs none.
          envFrom:
            - secretRef:
                name: "yidam-streamflow-vault"
                optional: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp/yidam
            - name: home
              mountPath: /home/yidam
            - name: git-write
              mountPath: /etc/yidam/git
              readOnly: true
            - name: vault
              mountPath: "/var/yidam/vault"
      - name: admit
        metadata:
          labels:
            yidam.dev/corpus: "streamflow"
            yidam.dev/egress: "remote"
        outputs:
          parameters:
            - name: output
              valueFrom:
                path: /tmp/yidam/out.json
        activeDeadlineSeconds: 3600
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: "{{workflow.parameters.image}}"
          command: ["yidam", "cluster", "admit"]
          args:
            - "--remote"
            - "{{workflow.parameters.remote}}"
            - "--branch"
            - "{{workflow.parameters.branch}}"
            - "--out"
            - "/tmp/yidam/out.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: TMPDIR
              value: "/tmp/yidam"
            - name: HOME
              value: "/home/yidam"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/yidam/git/key -o UserKnownHostsFile=/etc/yidam/git/known_hosts -o IdentitiesOnly=yes"
          volumeMounts:
            - name: scratch
              mountPath: /tmp/yidam
            - name: home
              mountPath: /home/yidam
            - name: git-read
              mountPath: /etc/yidam/git
              readOnly: true
