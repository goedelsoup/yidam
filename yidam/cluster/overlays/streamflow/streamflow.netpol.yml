# Generated by `yidam cluster network-policy`. Regenerate rather than edit.
#
# What each of this corpus's pods may reach (#1232). The workflow labels every pod
# with its corpus and its kind. The first policy selects the corpus alone: DNS and the
# API server, which Argo's executor sidecar reports through, and nothing else. Each
# policy after it selects one kind and adds what that kind needs. Policies add up, so
# a pod reaches what the first allows and what its own kind's allows.
#
# Only the lander mounts the write key, and that mount is the invariant. These keep a
# key that reached another pod by some other route from pushing anywhere: a step pod,
# where a calculator runs, reaches the vault and nothing else.
#
# A CNI that enforces NetworkPolicy is required. kind's default one does not.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yidam-streamflow-egress
  labels:
    yidam.dev/corpus: "streamflow"
spec:
  # Every pod of this corpus.
  podSelector:
    matchLabels:
      yidam.dev/corpus: "streamflow"
  policyTypes: ["Egress"]
  egress:
    # DNS, wherever the cluster serves it from.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The API server, for the executor sidecar. [cluster.egress] executor.
    - to:
        - ipBlock:
            cidr: "192.0.2.1/32"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yidam-streamflow-egress-remote
  labels:
    yidam.dev/corpus: "streamflow"
spec:
  # This corpus's remote pods.
  podSelector:
    matchLabels:
      yidam.dev/corpus: "streamflow"
      yidam.dev/egress: "remote"
  policyTypes: ["Egress"]
  egress:
    # The remote, which [cluster.egress] remote does not place, so anywhere.
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yidam-streamflow-egress-vault
  labels:
    yidam.dev/corpus: "streamflow"
spec:
  # This corpus's vault pods.
  podSelector:
    matchLabels:
      yidam.dev/corpus: "streamflow"
      yidam.dev/egress: "vault"
  policyTypes: ["Egress"]
  # Nothing past what every pod reaches: the vault is a volume.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yidam-streamflow-egress-internet
  labels:
    yidam.dev/corpus: "streamflow"
spec:
  # This corpus's internet pods.
  podSelector:
    matchLabels:
      yidam.dev/corpus: "streamflow"
      yidam.dev/egress: "internet"
  policyTypes: ["Egress"]
  egress:
    # Anywhere. [cluster.egress] remote is not declared, so the remote is not
    # excepted, and this pod could reach it with a key.
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
        - ipBlock:
            cidr: "::/0"
