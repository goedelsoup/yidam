# What every corpus on a cluster needs, whatever its vault: the account its pods run as.
#
# Nothing here carries a corpus's name. An overlay prefixes it with `yidam-<corpus>-`, and the
# generated workflow already names the result (RFC-0026 §7.2). A derived repository has no
# copy of this directory, so its overlay names it by URL at the `cli/v*` tag it runs:
#
#   resources:
#     - https://github.com/goedelsoup/yidam//yidam/cluster/base?ref=cli/v<version>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yml
