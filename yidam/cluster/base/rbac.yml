# The service account a generated workflow runs as, and the one role it needs.
#
# Argo's executor sidecar records each task's result as a `WorkflowTaskResult`; that is the
# whole of what a `yidam` pod's account may do in the cluster. The main container never sees
# the token: the workflow sets `automountServiceAccountToken: false` and names this account
# for the executor alone. Git and the vault are reached with the secrets the workflow mounts,
# never with a Kubernetes identity.
#
# The name is the role alone. An overlay's `namePrefix: yidam-<corpus>-` makes it
# `yidam-<corpus>-run`, the name `yidam cluster workflow` derives, and rewrites the binding's
# references to match.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: run
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: run
subjects:
  - kind: ServiceAccount
    name: run
---
# The executor's token. With `automountServiceAccountToken: false`, Argo mounts the secret
# `<account>.service-account-token` into the executor alone, and since Kubernetes 1.24 nothing
# creates that secret: without this, every pod waits in `Init` on a mount that never succeeds
# (#1237). Kubernetes fills in the token once the account exists. `name-reference.yml` carries
# the overlay's prefix into the annotation, which names the account.
apiVersion: v1
kind: Secret
metadata:
  name: run.service-account-token
  annotations:
    kubernetes.io/service-account.name: run
type: kubernetes.io/service-account-token
