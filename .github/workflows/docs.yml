# The docs site — build it on every change, and give it a host.
#
# `yidam/web/docs/` has been an Astro/Starlight site rendering `docs/` since it was
# written, and it has never had a URL. It was reachable by cloning the repository,
# installing mise, and running `mise run docs-dev` — which is to say, by someone who
# had already read the docs from the source tree and did not need the site. This
# workflow is the missing half: https://goedelsoup.github.io/yidam/.
#
# ── it builds on every push, and the path filter is deliberately absent ───────
#
# The obvious filter is `docs/**` plus `yidam/web/docs/**`. It would be wrong. The
# build resolves every relative link in `docs/` against the working tree and FAILS
# on one that points at nothing (src/content/rewrite-repo-links.ts), because those
# links are broken on GitHub too — that is the only check in CI that reads them.
# Its inputs are therefore the whole repository: renaming `sadhana/sangha/PROTOCOL.md`
# breaks twelve links in the RFCs while touching neither filtered path, and a
# filtered workflow would let exactly that through. Same argument ci.yml makes for
# its `paths-ignore`, applied to a different set of gated inputs.
#
# ── node only ────────────────────────────────────────────────────────────────
#
# Every other workflow here starts with `jdx/mise-action`, which provisions the
# whole [tools] table. To run `astro build` that means a Rust toolchain, protoc,
# Python and uv, none of which this job touches. `actions/setup-node` instead, with
# `lts/*` tracking mise.toml's `node = "lts"` — the two must stay in step, and the
# build command itself is `package.json`'s `build` script either way, which is what
# `mise run docs-build` calls at a developer's terminal.

name: Docs

on:
  push:
    branches: [main]
    # The version list is derived from `cli/v*` tags — `scripts/versions.mjs` reads
    # `git tag -l` and `src/versions.mjs` keeps the last three minor series. Pushing such a
    # tag is therefore the one event that changes the answer, and it was the one event that
    # did not rebuild the site (#535). Nothing went red: the site kept serving a coherent
    # *previous* release until somebody happened to push to main for an unrelated reason, so
    # the stale window was invisible and its length arbitrary — and it always covered the
    # period right after a release, when a reader following the announcement arrives.
    #
    # `cli/v*` and not `v*`: four layers release into one tag namespace and only this one is
    # in the list, so a build per template or editor tag would redeploy identical content.
    #
    # The `paths-ignore` below does not suppress these. GitHub does not evaluate path filters
    # for pushes of tags — a tag push has no changed-file set to filter on — which is the
    # first thing a reader worries about on seeing the two in one block.
    #
    # This also needs the `github-pages` environment to permit the ref: its deployment branch
    # policy listed `main` alone, so a tag run would have built, assembled, and then declined
    # to publish. A `cli/v*` tag policy was added alongside this trigger; the two are one
    # change and neither works without the other.
    tags: ['cli/v*']
    paths-ignore:
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'LICENSE'
  # Redeploy without a commit — after a Pages settings change, or to recover a
  # deployment that expired.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For the quality report (#467). The measurements are produced by ci.yml, and reading an
  # artifact another workflow uploaded is the only permission that needs.
  actions: read

jobs:
  # ── which versions exist (#466) ────────────────────────────────────────────
  #
  # Four layers release independently and this site documents Layer 4, the tooling, because
  # that is what a reader has installed. The list comes from `cli/v*` tags and nothing else.
  #
  # It is resolved in one job and handed to the rest, rather than recomputed per job, so that
  # every build of one deploy agrees about what the version list is — including the switcher
  # each page carries, which names versions this build is not.
  versions:
    name: versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      list: ${{ steps.resolve.outputs.list }}
    steps:
      # `fetch-tags` and full depth: the default checkout has no tags, and a version list
      # built from no tags would publish `main` alone and report success.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: yidam/web/docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: yidam/web/docs

      # The render assertions, and now the version and assembly ones. They run here rather
      # than in the matrix because they grade *this* tree: a released tag has its own copy of
      # this site and would be running whatever tests it shipped with, against a version list
      # it has never heard of.
      # Type-checking, which this site declared and never did. `tsconfig.json` extends
      # `astro/tsconfigs/strict`; `astro build` bundles without consulting it and the tests
      # below run node scripts, so `const root: string = 12345` in `src/quality/report.ts`
      # passed both at exit 0 (#688).
      #
      # Here rather than in the build matrix, and for the same reason the tests are: it grades
      # *this* tree. A released tag ships its own copy of the site and would be checked against
      # whatever it was written under.
      - name: Type-check
        run: npm run check
        working-directory: yidam/web/docs

      # Linting, which this site also never did (#690). It is a separate tool from the step
      # above and catches separate things: `tsc` has nothing to say about an unused import in
      # `.astro` frontmatter, which is five of the seven findings the first run turned up.
      #
      # `scripts/` and `test/` are in scope on purpose — they are the prose and anchor
      # checkers, and a bug in a checker is worse than a bug in what it checks.
      #
      # Here rather than in the build matrix, for the reason the two steps around it are here:
      # it grades *this* tree, and a released tag ships its own copy of the site.
      - name: Lint
        run: npm run lint
        working-directory: yidam/web/docs

      - name: The site's own tests
        run: npm test
        working-directory: yidam/web/docs

      # On a pull request this resolves to a single build of the change itself. The released
      # versions are tags and cannot have changed; building them would spend five jobs to
      # re-prove that four immutable refs still compile.
      - name: Resolve the version list
        id: resolve
        run: |
          set -euo pipefail
          pr=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then pr="--pull-request"; fi
          node yidam/web/docs/scripts/versions.mjs --matrix $pr > matrix.json
          node yidam/web/docs/scripts/versions.mjs $pr > versions.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          {
            echo "list<<YIDAM_EOF"
            cat versions.json
            echo "YIDAM_EOF"
          } >> "$GITHUB_OUTPUT"

  # One build per version, each a checkout of its own ref reading its own `docs/`.
  #
  # That is what makes versioning cost nothing in the site itself: the content loader reads
  # `docs/` at the repository root and `astro.config.mjs` holds a bidirectional sidebar gate,
  # and both keep working unchanged because each build only ever sees one version's tree. A
  # release whose `docs/` had 48 pages is graded against the sidebar that shipped with it.
  #
  # `--base` on the command line rather than an environment variable the config reads: every
  # tag that exists today predates this feature, so its config knows nothing this workflow
  # could tell it. Astro's own flag reaches `config.base`, which is what the loader's link
  # rewriter uses.
  build:
    name: build (${{ matrix.slot }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: the report is more useful with four
      # builds and one error than with one error and four cancellations.
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    concurrency:
      group: docs-${{ github.ref }}-${{ matrix.slot }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      # An empty `ref` is the event's own, which is what a pull request wants.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: yidam/web/docs/package-lock.json

      # `npm ci` here and in `scripts/npm-ensure.sh`, which is what `mise run docs-install`
      # now calls: a lockfile is a claim about what was built, and CI is where that claim is
      # worth enforcing. This one is the *tag's* lockfile, which is the point. The two routes
      # agreed on the command only after #646 — this said `ci` and the task said `install`.
      - name: Install dependencies
        run: npm ci
        working-directory: yidam/web/docs

      # ── the quality report (#467) ───────────────────────────────────────────
      #
      # The measurements live in ci.yml and this site is built here. The two workflows fire
      # on the same push and run in parallel, so the newest report a build can see is the one
      # the *previous* CI run on main left behind. That is why the envelope carries
      # `yidam.commit` and why every quality page prints it: a page one commit behind and
      # saying so is honest; a page one commit behind and silent is not.
      #
      # Failure here is not failure of the docs build. `continue-on-error` plus the guard
      # below means an absent report renders the "not measured" state — which is a real state
      # the pages are tested against, not a fallback that hides a problem. What must never
      # happen is a stale or fixture report deploying as if it were this commit's, and the
      # only thing that could produce one is a file that is there; so the download either
      # produces this run's answer or produces nothing.
      - name: Fetch the most recent quality report from main
        id: quality
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "::notice::no successful CI run on main yet"; exit 1; }
          gh run download "$run_id" --name quality-report --dir "${RUNNER_TEMP}/quality"
          echo "path=${RUNNER_TEMP}/quality/quality-report.json" >> "$GITHUB_OUTPUT"

      # The series behind /quality/trends (#468). `quality-report.json` describes one commit;
      # this is the sequence, appended by ci.yml's `series` job to an orphan branch that
      # shares no history with main. Fetched rather than checked out for that reason.
      #
      # `continue-on-error` for the same reason as the report above, and one more: the branch
      # does not exist until the first push to main after the series job lands, and a repo
      # that has never run it must render "no series yet" rather than fail its docs build.
      # An empty output leaves YIDAM_QUALITY_SERIES unset, which is the state loadSeries()
      # already describes and quality-render.mjs already asserts.
      - name: Fetch the quality series from its branch
        id: series
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin quality-series
          git show FETCH_HEAD:series.jsonl > "${RUNNER_TEMP}/series.jsonl"
          echo "path=${RUNNER_TEMP}/series.jsonl" >> "$GITHUB_OUTPUT"

      # `npx astro build` rather than `npm run build`: the base has to be passed, and an old
      # tag's `build` script does not forward arguments.
      - name: Build
        env:
          YIDAM_QUALITY_REPORT: ${{ steps.quality.outputs.path }}
          YIDAM_QUALITY_SERIES: ${{ steps.series.outputs.path }}
        run: npx astro build --base "${{ matrix.base }}"
        working-directory: yidam/web/docs

      # Every internal link resolves, to a page and to the heading it names. The Astro build
      # catches a dead page and an unlisted sidebar entry; it has never checked the part
      # after the `#`, and a wrong fragment leaves a reader at the top of the right document
      # with nothing to tell them.
      #
      # `main` only, and that is a limit rather than a preference: a released tag's build is
      # whatever that tag shipped, and this cannot be made to pass by changing anything in
      # this repository. Its first run found two live defects on the deployed site — a
      # sidebar link that doubled the base into `/yidam/yidam/quality/`, and a favicon
      # referenced by all 71 pages and published by none — both of which are fixed on `main`
      # and both of which the released builds still carry.
      - name: Every link and anchor resolves
        if: matrix.id == 'main'
        run: node yidam/web/docs/scripts/check-anchors.mjs yidam/web/docs/dist --base "${{ matrix.base }}"

      - name: Keep this version's build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.slot }}
          path: yidam/web/docs/dist
          if-no-files-found: error
          retention-days: 1

  # Every version's build, laid out under one root and decorated with the switcher and the
  # "you are not reading the current release" banner.
  #
  # The decoration happens here and not in each build for two reasons. Every tag that exists
  # today was built before this feature, so a switcher added to the site's own theme would
  # appear on no released version — including the one the site root serves. And a switcher
  # that keeps a reader on the page they are reading has to know which pages the *other*
  # versions have, which only the assembled tree does.
  assemble:
    name: assemble
    if: github.event_name != 'pull_request'
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Pins the Pages source to this workflow, so a source flipped to a branch in the
      # settings UI is put back by the next deploy rather than silently serving
      # something else. It keeps that fact in the repository instead of only in a
      # settings page nobody reads.
      #
      # `enablement: true` does NOT bootstrap a repository that has never had Pages.
      # `GITHUB_TOKEN` may update an existing site and may not create the first one,
      # so the step fails with `Resource not accessible by integration` — which is how
      # this site's first deploy failed, nineteen seconds after the merge that was
      # supposed to publish it. Someone with repository admin has to create the site
      # once:
      #
      #   gh api -X POST repos/goedelsoup/yidam/pages -f build_type=workflow
      #
      # or Settings → Pages → Source: GitHub Actions. Everything after that is this
      # workflow's job. The flag stays because the failure it produces is loud, names
      # the missing permission, and happens before anything is published — which is
      # better than a deploy step failing later with less to say.
      #
      # Skipped on pull requests: a fork PR has no `pages: write`, and a PR has no
      # business changing repository settings even when it could.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: staging

      # `download-artifact` names each directory after its artifact. `assemble.mjs` matches
      # directories against version ids, and refuses one it cannot place — so a rename that
      # went wrong fails loudly here rather than publishing a path nothing links to.
      - name: Name each build by its slot
        run: |
          set -euo pipefail
          for dir in staging/site-*; do
            mv "$dir" "staging/$(basename "$dir" | sed 's/^site-//')"
          done
          ls -1 staging

      - name: Assemble one site
        run: |
          set -euo pipefail
          cat > versions.json <<'YIDAM_EOF'
          ${{ needs.versions.outputs.list }}
          YIDAM_EOF
          node yidam/web/docs/scripts/assemble.mjs \
            --staging staging \
            --out site \
            --versions versions.json

      # What this assembly is, written into the tree it describes.
      #
      # The deploy below reports success from the API's acknowledgement, which is a claim
      # about a request and not about what the site serves — and those two came apart at
      # `cli/v0.14.0` (see the deploy step). A file the reader can fetch is the only thing
      # that answers "is the live site this build?", and the check after the deploy asks it.
      - name: Stamp the assembly
        run: |
          set -euo pipefail
          printf '{"run_id":"%s","sha":"%s","ref":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" > site/deployed.json
          cat site/deployed.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    # Pages allows one deployment at a time and queuing is correct here: cancelling
    # an in-flight deploy can leave the site serving a half-published build.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ── the deployment's identity is not the commit ──────────────────────────
      #
      # `actions/deploy-pages` sends `pages_build_version: process.env.GITHUB_SHA` and
      # nothing else identifies the deployment. Pages treats that value as the deployment's
      # id — and a second deployment of an id already live is accepted, acknowledged, and
      # serves nothing new.
      #
      # That is exactly a release. A tag is cut on the current `main`, so `cli/v0.14.0` and
      # the push that became it carry the *same sha*; main's build ran first, thirty minutes
      # before the tag existed, and resolved `v0.13` as the latest release. The tag's build
      # was correct — `versions: main, v0.14 (latest), v0.13, v0.12`, and `./v0.14/` was in
      # the uploaded artifact — the deploy step said "Reported success!", and the site went
      # on serving the earlier tree with `/yidam/v0.14/` a 404. The trigger added for #535
      # fires; its deploy was a no-op. `workflow_dispatch` has the same defect and the same
      # cause, which makes the "redeploy without a commit" note at the top of this file a
      # thing that quietly did not work.
      #
      # The assembled tree is a function of the commit *and the tag set*, so the run is the
      # smallest thing that identifies it. Overriding `GITHUB_SHA` for this step is the only
      # way in: the action exposes no input for the build version.
      #
      # If Pages ever refuses a build version that is not a bare sha, this step fails at the
      # request rather than after it — loudly, before the check below — and the fix is to
      # send a value it accepts, never to go back to sending the sha alone.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}

      # The deploy step reports what the API said. This asks the site.
      #
      # Tags only, and that is a budget rather than a principle: a push to main always
      # carries a sha Pages has not seen, so the collision above cannot happen there, and
      # Pages fronts the site with a ten-minute cache that a query string does not reliably
      # bust. A release is the one moment the answer is worth waiting for — it is when a
      # reader arrives from the announcement, and it is the case that broke.
      - name: The deployed site is this build
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}deployed.json"
          for _ in $(seq 1 40); do
            got=$(curl -fsS "$url?r=$RANDOM" 2>/dev/null | jq -r '.run_id // ""' || true)
            [ "$got" = "$GITHUB_RUN_ID" ] && break
            sleep 20
          done
          echo "$url serves run '$got'; this run is '$GITHUB_RUN_ID'"
          [ "$got" = "$GITHUB_RUN_ID" ] || {
            echo "::error::The deploy reported success and the site does not serve this"
            echo "::error::build. A deployment whose build version is already live is"
            echo "::error::accepted and changes nothing; that is how cli/v0.14.0 published"
            echo "::error::a version list the site never served. Check the GITHUB_SHA"
            echo "::error::override on the deploy step above."
            exit 1
          }
