# The docs site — build it on every change, and give it a host.
#
# `yidam/web/docs/` has been an Astro/Starlight site rendering `docs/` since it was
# written, and it has never had a URL. It was reachable by cloning the repository,
# installing mise, and running `mise run docs-dev` — which is to say, by someone who
# had already read the docs from the source tree and did not need the site. This
# workflow is the missing half: https://goedelsoup.github.io/yidam/.
#
# ── it builds on every push, and the path filter is deliberately absent ───────
#
# The obvious filter is `docs/**` plus `yidam/web/docs/**`. It would be wrong. The
# build resolves every relative link in `docs/` against the working tree and FAILS
# on one that points at nothing (src/content/rewrite-repo-links.ts), because those
# links are broken on GitHub too — that is the only check in CI that reads them.
# Its inputs are therefore the whole repository: renaming `sadhana/sangha/PROTOCOL.md`
# breaks twelve links in the RFCs while touching neither filtered path, and a
# filtered workflow would let exactly that through. Same argument ci.yml makes for
# its `paths-ignore`, applied to a different set of gated inputs.
#
# ── node only ────────────────────────────────────────────────────────────────
#
# Every other workflow here starts with `jdx/mise-action`, which provisions the
# whole [tools] table. To run `astro build` that means a Rust toolchain, protoc,
# Python and uv, none of which this job touches. `actions/setup-node` instead, with
# `lts/*` tracking mise.toml's `node = "lts"` — the two must stay in step, and the
# build command itself is `package.json`'s `build` script either way, which is what
# `mise run docs-build` calls at a developer's terminal.

name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'LICENSE'
  # Redeploy without a commit — after a Pages settings change, or to recover a
  # deployment that expired.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For the quality report (#467). The measurements are produced by ci.yml, and reading an
  # artifact another workflow uploaded is the only permission that needs.
  actions: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Superseded PR builds are cancelled; main is never cancelled, so what deploys
    # is always the newest commit that finished.
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: yidam/web/docs/package-lock.json

      # `npm ci`, not the `npm install` that `mise run docs-install` runs: a lockfile
      # is a claim about what was built, and CI is where that claim is worth enforcing.
      - name: Install dependencies
        run: npm ci
        working-directory: yidam/web/docs

      # Pins the Pages source to this workflow, so a source flipped to a branch in the
      # settings UI is put back by the next deploy rather than silently serving
      # something else. It keeps that fact in the repository instead of only in a
      # settings page nobody reads.
      #
      # `enablement: true` does NOT bootstrap a repository that has never had Pages.
      # `GITHUB_TOKEN` may update an existing site and may not create the first one,
      # so the step fails with `Resource not accessible by integration` — which is how
      # this site's first deploy failed, nineteen seconds after the merge that was
      # supposed to publish it. Someone with repository admin has to create the site
      # once:
      #
      #   gh api -X POST repos/goedelsoup/yidam/pages -f build_type=workflow
      #
      # or Settings → Pages → Source: GitHub Actions. Everything after that is this
      # workflow's job. The flag stays because the failure it produces is loud, names
      # the missing permission, and happens before anything is published — which is
      # better than a deploy step failing later with less to say.
      #
      # Skipped on pull requests: a fork PR has no `pages: write`, and a PR has no
      # business changing repository settings even when it could.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ── the quality report (#467) ───────────────────────────────────────────
      #
      # The measurements live in ci.yml and this site is built here. The two workflows fire
      # on the same push and run in parallel, so the newest report a build can see is the one
      # the *previous* CI run on main left behind. That is why the envelope carries
      # `yidam.commit` and why every quality page prints it: a page one commit behind and
      # saying so is honest; a page one commit behind and silent is not.
      #
      # Failure here is not failure of the docs build. `continue-on-error` plus the guard
      # below means an absent report renders the "not measured" state — which is a real state
      # the pages are tested against, not a fallback that hides a problem. What must never
      # happen is a stale or fixture report deploying as if it were this commit's, and the
      # only thing that could produce one is a file that is there; so the download either
      # produces this run's answer or produces nothing.
      - name: Fetch the most recent quality report from main
        id: quality
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "::notice::no successful CI run on main yet"; exit 1; }
          gh run download "$run_id" --name quality-report --dir "${RUNNER_TEMP}/quality"
          echo "path=${RUNNER_TEMP}/quality/quality-report.json" >> "$GITHUB_OUTPUT"

      # The series behind /quality/trends (#468). `quality-report.json` describes one commit;
      # this is the sequence, appended by ci.yml's `series` job to an orphan branch that
      # shares no history with main. Fetched rather than checked out for that reason.
      #
      # `continue-on-error` for the same reason as the report above, and one more: the branch
      # does not exist until the first push to main after the series job lands, and a repo
      # that has never run it must render "no series yet" rather than fail its docs build.
      # An empty output leaves YIDAM_QUALITY_SERIES unset, which is the state loadSeries()
      # already describes and quality-render.mjs already asserts.
      - name: Fetch the quality series from its branch
        id: series
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin quality-series
          git show FETCH_HEAD:series.jsonl > "${RUNNER_TEMP}/series.jsonl"
          echo "path=${RUNNER_TEMP}/series.jsonl" >> "$GITHUB_OUTPUT"

      # The render assertions, and the reason they are a step here rather than a job
      # elsewhere: they need a built site, and this is the only place one is built. They run
      # against `ci-report`'s committed golden — never against the report fetched above — so
      # the check is the same on every run whatever CI happened to publish.
      - name: The quality pages render a skipped suite as a skipped suite
        run: npm test
        working-directory: yidam/web/docs

      # On a pull request this is the whole job: a build that fails on an unlisted
      # page, a dead relative link, or a broken sidebar slug, and publishes nothing.
      - name: Build
        env:
          YIDAM_QUALITY_REPORT: ${{ steps.quality.outputs.path }}
          YIDAM_QUALITY_SERIES: ${{ steps.series.outputs.path }}
        run: npm run build
        working-directory: yidam/web/docs

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: yidam/web/docs/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Pages allows one deployment at a time and queuing is correct here: cancelling
    # an in-flight deploy can leave the site serving a half-published build.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
