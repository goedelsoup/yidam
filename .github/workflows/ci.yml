name: CI

on:
  push:
    branches: [main]
    # Only LICENSE. `**/*.md` and `docs/**` were ignored here, and both are gated inputs:
    # the tests in yidam/cli/tests READ the prose. `prelude_commit_vocabulary` reads
    # `skills/bootstrap.md` and `GRAPH.md`, `versioning_layers` reads `VERSIONING.md`,
    # `installed_layout_links` reads the `sadhana/root/*.md` templates, `editor_configs`
    # reads the editor guide. So a pull request editing GRAPH.md's verb table — the change
    # those tests exist to catch — ran no jobs at all.
    #
    # The whole prompt surface is markdown too: BOOTSTRAP.md, the prelude, the bootstrap
    # skill, the rubric, the scenarios. A template whose behaviour lives in prose cannot
    # exempt prose from CI.
    #
    # The derived-repo workflow (sadhana/github/workflows/ci.yml) already carries this
    # argument and this list; the lesson was found downstream and never travelled back.
    paths-ignore:
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'LICENSE'
  schedule:
    # Weekly full-feature build (Mondays 06:00 UTC) — catches gated-code breakage
    # and arrow/lancedb version-lock rot that the light PR builds never compile.
    - cron: '0 6 * * 1'
  # `ci (mutants)` has guarded on `workflow_dispatch` since it was written and this trigger
  # was not here, so that arm of its condition was unreachable: the job could be reached by
  # the Monday schedule and by nothing else. The heavy jobs — mutants, and the full-feature
  # build — are exactly the ones worth running against a branch on purpose, which is also how
  # #539 was measured rather than guessed at.
  #
  # `mutants` is opt-in rather than implied, because it is a 180-minute job and the reason to
  # dispatch is usually one of the other twelve. The first dispatch of this workflow started
  # it by accident twice; a trigger whose cheap use costs three hours is one nobody dares use.
  workflow_dispatch:
    inputs:
      mutants:
        description: 'Also run ci (mutants) — mutation testing, up to 180 minutes'
        type: boolean
        default: false

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
# Never cancel main — keep its history green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # The harness and the (light, default `reports`) CLI are independent Cargo
    # workspaces. Run them on separate runners in parallel so wall-clock is
    # max(harness, cli). Runs on every PR + push. fail-fast: false so a failure
    # in one still reports the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: harness
            path: yidam/tests/harness
          - workspace: cli
            path: yidam/cli
    name: ci (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    steps:
      # Full history: the summary's diff-coverage step needs the merge base, and a shallow
      # clone has no commit to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # When the mise cache hits, `mise install` is a no-op and the rust
      # toolchain gets auto-installed by rustup at the first cargo call —
      # with the runner's default minimal profile, which lacks rustfmt and
      # clippy. Provision the pinned toolchain (see [tools] in mise.toml)
      # with its components explicitly; this is idempotent on cache misses.
      - name: Ensure rustfmt and clippy for the pinned toolchain
        run: mise exec -- rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      # Cache only this job's workspace target dir + the shared cargo registry,
      # keyed (via `key`) so caches never collide across jobs.
      # The summary step builds `ci-report` out of the harness workspace, so the `cli`
      # row caches that too. It is a four-dependency crate; the `harness` row already has
      # it as a member. The alternative was a summary only some gates get, and a gate that
      # reports differently from its neighbours is how a reader learns to stop trusting the
      # summary.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ matrix.path }}
            yidam/tests/harness
          key: ${{ matrix.workspace }}
      - run: mise run ci-${{ matrix.workspace }}
      # Coverage on the CLI row only. The harness is 82 tests over a test harness; the
      # instrumented rebuild would cost more than the number is worth there.
      - name: Measure coverage
        if: matrix.workspace == 'cli'
        run: mise run coverage
      - uses: ./.github/actions/test-summary
        if: always()
        with:
          gate: ci (${{ matrix.workspace }})
          junit: ${{ matrix.path }}/target/nextest/ci/junit.xml
          manifest: ${{ matrix.path }}/Cargo.toml
          artifact: test-results-${{ matrix.workspace }}
          json: "true"
          lcov: ${{ matrix.workspace == 'cli' && 'yidam/cli/target/coverage.lcov' || '' }}
          src: ${{ matrix.workspace == 'cli' && 'yidam/cli/src' || '' }}
          # The default set, spelled where the reader of a number can see it.
          # `coverage_reporting.rs::the_reported_feature_set_is_the_one_the_gate_builds`
          # is what keeps this list and `[features] default` in step — it reads this line
          # and the manifest and requires them equal. (It used to say `light_build.rs`,
          # which never read this file.)
          features: ${{ matrix.workspace == 'cli' && 'reports,tonpa,vault-s3,export-graph,serve-http' || '' }}

  vscode:
    # The editor client. Separate from the Rust matrix because it shares no toolchain
    # with it, and because it needs a yidam BINARY rather than a cargo workspace: the
    # contract tests drive the extension's reader against the same `reports/` golden
    # corpora that certify the reports themselves. A fixture whose output changes then
    # fails the parity run and these tests together, which is the point.
    name: ci (vscode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            yidam/cli
            yidam/tests/harness
          key: vscode-cli
      # The light default (`reports`) — no protoc, no fastembed. The extension needs a
      # binary that speaks the contract, not the full feature set.
      - name: Install the yidam CLI so the contract tests have something to read
        run: cargo install --path yidam/cli --locked
      - run: npm install
        working-directory: yidam/editors/vscode
      # Skipping is a courtesy to contributors without the CLI; it must never be how
      # this job goes green. This turns an absent or stale binary into a failure.
      - run: mise run ci-vscode
        env:
          YIDAM_REQUIRE_CONTRACT: "1"
      # No `manifest`: node's JUnit reporter writes no `<system-out>`, so a runtime skip
      # here would be invisible to the census however it were counted. The extension has no
      # environment-gated suite today; if it grows one, this is the line that has to change,
      # and saying so is cheaper than a census that silently covers three gates out of four.
      - uses: ./.github/actions/test-summary
        if: always()
        with:
          gate: ci (vscode)
          junit: yidam/editors/vscode/junit.xml
          artifact: test-results-vscode
          json: "true"

  parity:
    # The cross-language parity suites, which nothing ran. `ci-cli` builds only the CLI's
    # own test targets — there is no [workspace] table joining yidam/cli to
    # yidam/prelude/sdks/rust — so a change making the three SDKs disagree about
    # `classify_commit` passed every job here, which is the one thing prelude/sdks/parity/
    # exists to prevent. Same family as the full-features job below being PR-exempt: a real
    # check that existed and was not reached.
    #
    # Its own job because it needs a different toolchain from the three above — Rust for one
    # SDK, npm for another, uv for the third.
    #
    # `embed-parity` is deliberately not here: its runners download model weights, which is
    # why it is gated behind YIDAM_EMBED_PARITY=1 and belongs on the schedule rather than on
    # every pull request.
    name: ci (parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            yidam/prelude/sdks/rust
            yidam/tests/harness
          key: parity
      - run: npm install
        working-directory: yidam/prelude/sdks/typescript
      # `parity` depends on `parity-check`, which enforces the fixture rules in both
      # directions: every parity function has a fixture, and every fixture directory has a
      # runner that reads it.
      - run: mise run parity
      # The Rust SDK's arm only. The TypeScript and Python arms of `parity` report through
      # their own runners and are not in this summary — stated here rather than left for a
      # reader to infer from a count that looks short.
      - uses: ./.github/actions/test-summary
        if: always()
        with:
          gate: ci (parity · rust sdk)
          # The heading is the Rust arm; the job runs all three. Without this the merge has
          # no job named `ci (parity · rust sdk)` to match and the gate's conclusion stays
          # unknown for ever — which is how the mismatch was found (#516).
          job: ci (parity)
          junit: yidam/prelude/sdks/rust/target/nextest/ci/junit.xml
          manifest: yidam/prelude/sdks/rust/Cargo.toml
          artifact: test-results-parity
          json: "true"

  verify:
    # The formal specs — 658 lines of Dafny and LEAN that `mise.toml` has named since it was
    # written and that had never executed once (#461). Not a check that regressed: a check
    # that had no runner, in the repository whose CI header calls the alternative "a green
    # check for a build nobody ships" three jobs down.
    #
    # It runs on pull requests, and the case is the one `cross` makes: this is light. Dafny
    # is a download and a Boogie run over 400 lines; the Lean library is 211 lines and one
    # module. The expensive half is fetching the toolchains, which caches. What it guards
    # against is a spec edited into falsehood and noticed by nobody, which — given the two
    # tools had never been installed anywhere — is the state this repository was already in.
    #
    # The job runs `mise run verify`, the same command a contributor runs, rather than
    # spelling the three verifications out again here. `formal_specs.rs` asserts that.
    name: ci (verify · formal specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # elan only. Every `build`/`test`/`lint` input is off because `mise run verify` does
      # the building, and lean-action is here for one thing mise cannot do: `elan` ships as
      # `elan-init`, a bootstrapper, so there is no mise pin for `lake`.
      #
      # No version appears here. The Lean toolchain is pinned by `lean-toolchain` in the
      # package directory and by nothing else, which is why a second pin is not worth the
      # convenience — see the note beside [tasks.verify].
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: yidam/prelude/sdks/spec
          auto-config: false
          build: false
          test: false
          lint: false
      - run: mise run verify

  design:
    # The adherence lint, which nothing invoked and which would not have loaded if anything
    # had — it carried a key oxlint rejects outright (#465). It reads JS and JSX; the two
    # CSS consumers that had actually drifted are guarded from the Rust side, by
    # `design_tokens.rs` in the `ci (cli)` gate.
    #
    # Its own job rather than a step in `ci (vscode)`: no shared toolchain, and a design
    # change should not need the extension's npm install to report.
    name: ci (design system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run design-lint

  supply-chain:
    # Advisories, licences, bans, sources, and unused dependencies. On pull requests: the
    # whole point is to hear about a vulnerability before it ships, and this repository
    # reaches users through six install channels that `install-channels.yml` only verifies
    # *work*. Seconds, not minutes — cargo-deny reads lockfiles rather than building.
    #
    # Its first run found three advisories, one of them (`quick-xml`) in a crate added the
    # week before by #462. That is the argument for running it on every pull request rather
    # than weekly, made by the tool itself on the day it was installed.
    name: ci (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run supply-chain

  semver:
    # What a release of `yidam-core` would break, asked while it is still a question.
    # `publish-crates.yml` runs this too, immediately before the upload — but a PR is where
    # the change is still cheap to reconsider, and the tag is where it is already decided.
    #
    # Runs on every pull request rather than only when `yidam/prelude/sdks/rust/` changes.
    # A per-job path filter needs a filter action or a `paths:` on the workflow, and a
    # required check that reports "skipped" is its own well-known problem. This costs a
    # network fetch and two builds of a small crate.
    name: ci (semver · yidam-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `@stable`, not the pin, and this is the documented exception rather than an
      # oversight: cargo-semver-checks needs rustc >= 1.93 to read rustdoc JSON while this
      # repository builds on 1.88.0. It produces no artifact — it reads an API and compares
      # it — so the reason release.yml was pinned does not reach it. `toolchain_pins.rs`
      # requires every `@stable` to carry a reason, and this is that reason.
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/prelude/sdks/rust
          key: semver
      - run: mise run semver-check

  cross:
    # The aarch64 Linux cross-compile, which nothing has ever run.
    #
    # `release.yml` builds this target and fires on `cli/v*` and workflow_dispatch
    # only, so no pull request and no push to main has ever compiled it. That was
    # survivable while the light build was pure Rust. #203 put `tonpa` in the
    # default set, which put a TLS stack in it, and rustls needs `ring` — C and
    # assembly, vendored in the crate, built by cc-rs with the cross-compiler.
    # The reasoning that this cross-compiles cheaply is written down beside the
    # release matrix, is plausible, and had never been executed. `cli/v0.2.0`
    # predates the change.
    #
    # It runs on pull requests, unlike cli-full. cli-full is excluded because it
    # is heavy — protoc, an ONNX runtime, SQLite from source. This is the light
    # default set for one extra target: the same dependency graph the `ci (cli)`
    # job already builds, compiled for a different machine. The thing it guards
    # against is a dependency change that cross-compiles on nobody's laptop and
    # is discovered mid-release, on the tag, which is the most expensive moment
    # to find it and the only one left if this job waits for main.
    #
    # It must stay a mirror of release.yml's matrix row for this target — same
    # linker, same CC_*, same --locked, same absence of --features. A test
    # asserts that; drift between them is a green check for a build nobody ships.
    name: ci (cli · aarch64 cross-compile)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain, not `@stable`. An artifact built by whatever stable shipped
      # that week is not the build any gate here tested, and this one is published. The
      # three `@stable` steps left in install-channels.yml are the deliberate opposite:
      # they simulate a user, who has whatever stable is, and pinning them would test a
      # channel nobody uses. `toolchain_pins.rs` asserts both halves.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-unknown-linux-gnu
      # The cross C compiler, not only the linker. Both halves are used: the
      # linker for the final artifact, the compiler for ring's vendored C.
      - name: Install cross-linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: cross-aarch64
      # Named rather than inferred, for the reason release.yml gives: cc-rs
      # guesses `<target>-gcc`, and a guess that falls back to the host compiler
      # produces host objects for an aarch64 link.
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked \
            --manifest-path yidam/cli/Cargo.toml \
            --target aarch64-unknown-linux-gnu
      # A successful link is already good evidence that ring was built for the
      # right architecture. This says so out loud, because "it compiled" and "it
      # compiled for aarch64" are not the same claim and only one of them is
      # worth a green check.
      - name: It must be an aarch64 binary
        run: |
          set -euo pipefail
          bin=yidam/cli/target/aarch64-unknown-linux-gnu/release/yidam
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || {
            echo "::error::$bin is not an aarch64 binary — cc-rs likely fell back to the host compiler"
            exit 1
          }

  bench-scaling:
    # The scaling arms need no index and no corpus: the flat arm is constant in N and is
    # excluded by argument, and the anchored arm is excluded here too — these corpora are
    # generated in memory and carry no embeddings, so anchoring over them would resolve by
    # keyword search. What is left is full-scan and focused-scan, which are structural. That
    # is why this one runs on pull requests where `cli-full` cannot.
    #
    # It guards the generator's determinism end to end. The unit tests assert the shape of
    # the curve; this asserts that a real binary over the committed config still produces
    # it, which is the thing a later anchored run will be compared against.
    name: ci (bench · scaling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: cli
      - run: mise run bench-scaling

  cli-full:
    # Full-feature CLI (index/sqlite/rdf/tonpa) — heavy: fastembed + lancedb +
    # protoc + from-source SQLite. Runs on main push + the weekly schedule only,
    # never on PRs, so PR latency stays on the light build. This is the guard
    # against the reports and index paths drifting apart inside yidam (RFC-0003).
    name: ci (cli · full features)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Job-wide, and it was step-wide once. #539 measured this job dying for memory during
      # `coverage-full` and capped the jobs THERE — the step that happened to be failing. On
      # d596634 it was killed again, one step earlier, in `ci-cli-full`. So the cap belongs to
      # the job: fixing the instance bought three green runs and then failed somewhere else.
      #
      # What the d596634 log actually shows, which is not what the first reading of it assumed:
      #
      #   02:27:08  $ cargo clippy --all-features        Finished in 8.51s
      #   02:27:17  $ cargo nextest run --all-features   Compiling yidam, yidam-core, ci-report
      #   02:29:03  ERROR sh exited with non-zero status: killed by SIGTERM   (exit 143)
      #
      # No dependency is compiled anywhere in the run — `Swatinem/rust-cache` restores the
      # whole `--all-features` tree, which is why the clippy CHECK above finishes in 8.5s. The
      # expensive step is the one after it, and what it does is codegen and LINK the 59
      # integration test binaries under `yidam/cli/tests/`, each of which statically contains
      # lancedb, lance, datafusion, arrow and ort with debuginfo.
      #
      # `-j` is the lever because it bounds how many of those link units run at once, not
      # because it slows a dependency build that is not happening. A 4-vCPU runner defaults to
      # `-j 4`; #539 measured the peak at ~15.5GB of 16 with four, so a unit costs roughly
      # 3.5GB and 3 would leave about a gigabyte of headroom on a machine that had just proved
      # it has none.
      #
      # THE KILL IS MARGINAL, NOT DETERMINISTIC, and a reader who misses that will read one
      # green run as proof. df1b713 — docs-only, on top of the commit that failed, with this
      # cap still step-scoped — ran the same `--all-features` step for its full 5m22s at `-j 4`
      # and passed; d596634 was killed 105 seconds into it. Roughly three failures in seven
      # main runs. So the evidence for `2` is headroom, not a reproduction: df1b713's samples
      # of `coverage-full`, which #539 had already capped, floor at 5.7Gi where the same step
      # at `-j 4` reached 0.5Gi. Disk never went below 38G in either.
      #
      # The cost is that this job's heaviest step gets slower — about 5m22s to 8 minutes.
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Ensure rustfmt and clippy for the pinned toolchain
        run: mise exec -- rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: cli-full
      # Where the runner died on d596634, with no line in the log naming a resource — the
      # sampler was on `coverage-full`, two steps later. Every heavy step in this job goes
      # through the wrapper now, and `ci_reporting.rs` asserts that rather than trusting it.
      - name: Full-feature build and tests, with a resource sampler
        run: .github/scripts/with-sampler.sh mise run ci-cli-full
      - uses: ./.github/actions/test-summary
        if: always()
        with:
          gate: ci (cli · full features)
          junit: yidam/cli/target/nextest/ci/junit.xml
          manifest: yidam/cli/Cargo.toml
          artifact: test-results-cli-full
          json: "true"
      # #264: "Run it in CI against `examples/streamflow`." It lives here rather than in the
      # light gate because `bench` refuses to measure against keyword search, and the vector
      # arm of `retrieve` is `--features index`. So the benchmark runs where the full build
      # runs — main push and the weekly schedule — and not on pull requests. That is one
      # commit later than the "every PR" the issue imagined, and it is the latest it can be
      # without the number being about keyword matching.
      # `--features index` is a third feature set, so this is a third codegen-and-link of the
      # binary, not a cache hit on the two above. It had no sampler at all, which is the same
      # hole one step over: a kill here would leave the log d596634 left.
      - name: Benchmark against examples/streamflow, with a resource sampler
        run: .github/scripts/with-sampler.sh mise run bench-example
      # The number that covers the gated paths. Retained rather than only summarised: P7's
      # series is a sequence of these, and a series cannot start later than its first point.
      #
      # ── CARGO_BUILD_JOBS, and the measurement that chose it ──────────────────
      #
      # This step was where the runner died on `d01cb87` and every commit after it: every test
      # passed, then the job stopped mid-crate with exit 137 and "the runner has received a
      # shutdown signal". No cargo error, no `No space left on device`, no OOM line — nothing
      # in the log named the resource, so memory and disk were equally good guesses and they
      # take opposite fixes. The sampler below was added first, alone, and measured it (#539):
      #
      #   [res] 20:34:37 mem_avail=13.6Gi disk_avail=39G   ← start of the coverage build
      #   [res] 20:38:37 mem_avail=0.6Gi  disk_avail=34G
      #   [res] 20:40:38 mem_avail=0.5Gi  disk_avail=29G   ← last line before the kill
      #
      # Memory, decisively. Disk never went below 29G, so freeing the preinstalled images or
      # splitting the job — the two disk fixes — would have changed nothing.
      #
      # The runner has 4 vCPU, so cargo defaults to `-j 4`, and four rustc processes each
      # holding an instrumented LLVM module for lancedb/lance/datafusion do not fit in 16GB.
      # `d01cb87` is where it began because that is where arrow went 52.2.0 → 53.4.1 and
      # datafusion 41 → 44, underneath the crate being compiled when the VM went away.
      #
      # 2 rather than 3: at 4 jobs the peak was ~15.5GB of 16, so a job costs roughly 3.5GB
      # and 3 would leave about a gigabyte of headroom on a machine that had just proved it
      # has none. This step gets slower; nothing else does, and the run it replaces produced
      # no coverage number at all.
      #
      # ── the sampler stays, and why it writes to stdout ───────────────────────
      #
      # It is what made this diagnosable, and it is what makes the next regression legible
      # rather than another silent kill. A file in /tmp would die with the VM, and a post-step
      # with `if: always()` does not run when the runner agent is the thing that was killed —
      # so the last `[res]` line to reach the log survives precisely the failure it explains.
      - name: Coverage (full features), with a resource sampler
        run: .github/scripts/with-sampler.sh mise run coverage-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full-lcov
          path: yidam/cli/target/coverage-full.lcov
          if-no-files-found: warn

  quality:
    # One `quality-report.json` out of every gate's fragment (#467).
    #
    # The gates run on separate runners and cannot see each other, so each writes a fragment
    # — its own whole envelope — and this joins them. The alternative, a job that re-runs
    # every suite in order to report on them, is the same tests twice.
    #
    # `always()`, because a failing gate is the one whose numbers the report most needs. A
    # report assembled only from green runs is a report in which nothing ever fails.
    #
    # It runs on pull requests too, where nothing publishes it. That is deliberate: the merge
    # is the step most likely to break silently — a renamed artifact, a fragment nobody
    # uploaded — and the failure would otherwise appear on main, one commit after the change
    # that caused it. `ci-report merge` refuses an empty set rather than writing an empty
    # document, so a run that collected nothing is red here rather than a page saying nothing
    # failed.
    name: ci (quality report)
    if: always()
    needs: [ci, vscode, parity, cli-full]
    # Declared rather than inherited. The repository's default is read-all today, which grants
    # the jobs API by accident; a settings change to "restricted" would take it away and the
    # step that reads conclusions would fail with a report that still merges — quietly losing
    # the field again. `contents` is here because declaring any permission replaces the whole
    # default set, and this job checks out.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/tests/harness
          key: quality
      - name: Build the reporter
        run: |
          mise exec -- cargo build --locked \
            --manifest-path yidam/tests/harness/Cargo.toml \
            --package ci-report
      # Every gate's fragment, flattened into one directory. `merge-multiple` is why the
      # composite action names each file after its gate: two files called `fragment.json`
      # would leave a report describing half a run.
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-test-results-*
          path: ${{ runner.temp }}/fragments
          merge-multiple: true
      # What each job of this run concluded (#516).
      #
      # A gate's numbers come from JUnit, and JUnit describes test cases. A job that fails
      # outside its tests is invisible to every number in the report: on run 33527632095 this
      # document said `failed: 0` while `ci (cli · full features)` was red, because its tests
      # had all passed and it died afterwards on a coverage flag. A page saying nothing failed
      # about a run that failed is the thing #459 exists to remove.
      #
      # The API rather than `needs.<job>.result`, for two reasons. A matrix job has ONE result
      # for every leg, so `ci (cli)` and `ci (harness)` could not be told apart. And `needs`
      # only carries the four jobs this one waits on, while the run has fourteen — a failure
      # in `ci (supply chain)` would be as absent as it is today.
      #
      # `per_page=100` because the endpoint paginates at 30 and a short page hides jobs;
      # `parse_jobs` refuses a list whose length disagrees with `total_count` rather than
      # under-reporting. `continue-on-error` because a report without conclusions is worse
      # than one with them and better than no report at all — the merge below says which it
      # got, and the pages draw an unknown as an unknown rather than as a pass.
      - name: What each job of this run concluded
        id: jobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > "${RUNNER_TEMP}/jobs.json"

      - name: Merge
        run: |
          set -euo pipefail
          args=()
          if [ -s "${RUNNER_TEMP}/jobs.json" ]; then
            args+=(--jobs "${RUNNER_TEMP}/jobs.json")
          else
            echo "::warning::the run's job conclusions were not fetched; the report will say \
              every gate's outcome is unknown rather than assume it passed"
          fi
          yidam/tests/harness/target/debug/ci-report merge \
            --from "${RUNNER_TEMP}/fragments" \
            --out quality-report.json \
            "${args[@]}"
      # Retained on every run, not only on main. `docs.yml` reads the most recent one from
      # main; a pull request's own copy is what makes the artifact downloadable by whoever is
      # reviewing the change that moved a number.
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: error

  series:
    # One record per push to main — the history the gates never kept (#468).
    #
    # Every run before this computed its numbers, displayed them, and threw them away. There
    # was no way to see that a suite had been shrinking, or that coverage moved three weeks
    # ago and nobody noticed.
    #
    # ── why an orphan branch ─────────────────────────────────────────────────
    #
    # RFC-0025 left the store open and asked for it to be settled here, "because the answer is
    # hard to change once there is a year of them". Git, because git is the one store this
    # repository already trusts and a Pages-side artifact has no history older than the last
    # deploy. An *orphan branch* rather than a file on main, because a bot commit per push
    # would land in `git log main` beside real work, would race a human push, and — this
    # workflow being `on: push: branches: [main]` — would re-trigger the run that wrote it.
    #
    # Nothing reads the series to decide whether CI passes. If a number in it disagrees with a
    # gate, the gate is right and this has a bug.
    #
    # It fails loudly rather than warning. A series that quietly stopped recording looks
    # exactly like a repository nobody pushed to, which is the shape of every defect this
    # epic has found.
    name: ci (series)
    # `always()` is load-bearing, and its absence is what kept the first record from ever
    # being written. A job whose `if` carries no status function gets an implicit `success()`,
    # and GitHub evaluates that over the whole ancestry rather than the direct `needs`: on the
    # merge that landed #468, `cli-full` failed, `quality` ran anyway on its own `always()`
    # and succeeded, and this was skipped regardless. The `quality-series` branch was never
    # created and nothing said why.
    #
    # The explicit condition is also the correct one. A run with a failing gate is exactly the
    # run whose numbers the series most needs; one that records only green pipelines describes
    # a repository where nothing ever breaks, which is this epic's own subject.
    if: >-
      always()
      && needs.quality.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One writer at a time. Two pushes to main landing together would otherwise race on the
    # same ref; queued rather than cancelled, because a cancelled run is a lost record.
    concurrency:
      group: quality-series
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/tests/harness
          key: quality
      - name: Build the reporter
        run: |
          mise exec -- cargo build --locked \
            --manifest-path yidam/tests/harness/Cargo.toml \
            --package ci-report
      - uses: actions/download-artifact@v4
        with:
          name: quality-report
          path: ${{ runner.temp }}

      # The branch, or the first one. `checkout` has already configured credentials for
      # `origin`, so this reuses them rather than putting a token on a command line.
      - name: Check out the series branch
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/series"
          if git ls-remote --exit-code --heads origin quality-series >/dev/null 2>&1; then
            git fetch --depth=1 origin quality-series
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" checkout -B quality-series
          else
            echo "::notice::quality-series does not exist yet; starting it"
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan quality-series
            git -C "$dir" rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Append this run
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/series"
          yidam/tests/harness/target/debug/ci-report series \
            --report "${RUNNER_TEMP}/quality-report.json" \
            --file "$dir/series.jsonl" \
            --bench yidam/cli/tests/goldens/bench/scaling.json
          cp yidam/tests/harness/ci-report/series-branch-README.md "$dir/README.md"

      - name: Commit and push
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/series"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series.jsonl README.md
          if git diff --cached --quiet; then
            echo "::notice::this commit is already recorded; nothing to push"
            exit 0
          fi
          git commit -qm "chore(series): ${GITHUB_SHA:0:7}"
          git push origin quality-series

  mutants:
    # The mutation testing this repository has been doing by hand (#468).
    #
    # RFC-0024's testing section prescribes it per call site — "delete the guard, keep the
    # comment, confirm red" — and every phase of #459 has carried it out by remembering to.
    # This catches the ones nobody thought to do.
    #
    # ── weekly, and scoped by a measured cost ────────────────────────────────
    #
    # One mutant is roughly 80 seconds here: a 28-second build and a 56-second test run,
    # measured rather than guessed. `cmd/lint/` alone holds 586 mutants — thirteen hours — so
    # the scope is the modules where a survivor means something rather than the codebase.
    # `vault/policy.rs` decides what leaves a machine and `cmd/lint/commits.rs` decides what
    # a derived repository is allowed to commit; a mutant surviving in either is a rule that
    # is not enforced.
    #
    # ── --in-place, and why it is safe here and not on a laptop ──────────────
    #
    # cargo-mutants copies the package directory and builds the copy. `yidam/cli` dev-depends
    # on `../tests/harness/ci-report`, which is outside that directory, so the copy cannot
    # resolve it and the baseline build fails before any mutant runs. `--in-place` mutates the
    # checkout instead. On a disposable runner that costs nothing; on a working tree an
    # interrupted run leaves a mutated file behind, which is why `mise run mutants` says so.
    #
    # `NEXTEST_PROFILE` is cleared for the same class of reason: mise sets it to `ci`
    # globally, and the config that defines that profile is only found through the explicit
    # `--config-file` every gate passes. cargo-mutants builds its baseline with its own
    # command line and never sees the flag.
    name: ci (mutants)
    # Dispatch runs it only when asked. `inputs.mutants` is absent on a schedule run, so the
    # first clause is what keeps Monday's run intact.
    if: github.event_name == 'schedule' || inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: mutants
      - name: Hunt
        id: hunt
        run: |
          set -uo pipefail
          mise exec "cargo:cargo-mutants@25.3.1" -- env NEXTEST_PROFILE=default \
            cargo mutants \
              --manifest-path yidam/cli/Cargo.toml \
              --cargo-arg=--locked \
              --in-place \
              --test-tool nextest \
              --timeout 300 \
              --file src/vault/policy.rs \
              --file src/cmd/lint/commits.rs \
              --output "${RUNNER_TEMP}/mutants"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = every mutant caught. 2 = some survived, which is a finding and not a failure:
          # this reports, it does not gate. Anything else — a usage error, a baseline whose
          # tests already fail — means the run tested nothing, and a run that tested nothing
          # reports no survivors and reads exactly like a clean bill of health. That is the
          # failure mode #468 names, so it is the one thing here that goes red.
          case "$code" in
            0|2) exit 0 ;;
            *) echo "::error::cargo-mutants exited $code — the run did not test mutants"; exit 1 ;;
          esac

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          # `--output DIR` writes into `DIR/mutants.out/`, not `DIR/`. Reading the wrong level
          # found nothing, took the "nothing was tested" branch, and left the job green with an
          # empty summary — the failure this job exists to detect, produced by the code meant
          # to report it. Found by running it.
          out="${RUNNER_TEMP}/mutants/mutants.out"
          {
            echo "### ci (mutants)"
            echo
            if [ ! -f "$out/caught.txt" ]; then
              echo "The run produced no outcome files, so nothing was tested."
              exit 0
            fi
            caught=$(wc -l < "$out/caught.txt")
            missed=$(wc -l < "$out/missed.txt" 2>/dev/null || echo 0)
            timeout=$(wc -l < "$out/timeout.txt" 2>/dev/null || echo 0)
            unviable=$(wc -l < "$out/unviable.txt" 2>/dev/null || echo 0)
            echo "| caught | survived | timed out | unviable |"
            echo "|---|---|---|---|"
            echo "| $caught | $missed | $timeout | $unviable |"
            echo
            # Stated rather than omitted when empty, for the reason the skip census is: an
            # absent section reads as "nothing to say", and "no survivors" is the sentence a
            # broken run also produces.
            if [ "$missed" -eq 0 ]; then
              echo "No mutant survived. $caught were introduced and every one failed a test."
            else
              echo "#### Survivors ($missed)"
              echo
              echo 'These changes to the source were not caught by any test.'
              echo
              echo '```'
              cat "$out/missed.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants
          if-no-files-found: warn
