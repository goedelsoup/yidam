name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  schedule:
    # Weekly full-feature build (Mondays 06:00 UTC) — catches gated-code breakage
    # and arrow/lancedb version-lock rot that the light PR builds never compile.
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
# Never cancel main — keep its history green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # The harness and the (light, default `reports`) CLI are independent Cargo
    # workspaces. Run them on separate runners in parallel so wall-clock is
    # max(harness, cli). Runs on every PR + push. fail-fast: false so a failure
    # in one still reports the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: harness
            path: yidam/tests/harness
          - workspace: cli
            path: yidam/cli
    name: ci (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # When the mise cache hits, `mise install` is a no-op and the rust
      # toolchain gets auto-installed by rustup at the first cargo call —
      # with the runner's default minimal profile, which lacks rustfmt and
      # clippy. Provision the pinned toolchain (see [tools] in mise.toml)
      # with its components explicitly; this is idempotent on cache misses.
      - name: Ensure rustfmt and clippy for the pinned toolchain
        run: mise exec -- rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      # Cache only this job's workspace target dir + the shared cargo registry,
      # keyed (via `key`) so caches never collide across jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.path }}
          key: ${{ matrix.workspace }}
      - run: mise run ci-${{ matrix.workspace }}

  cli-full:
    # Full-feature CLI (index/sqlite/rdf/tonpa) — heavy: fastembed + lancedb +
    # protoc + from-source SQLite. Runs on main push + the weekly schedule only,
    # never on PRs, so PR latency stays on the light build. This is the guard
    # against the reports and index paths drifting apart inside yidam (RFC-0003).
    name: ci (cli · full features)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Ensure rustfmt and clippy for the pinned toolchain
        run: mise exec -- rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: cli-full
      - run: mise run ci-cli-full
