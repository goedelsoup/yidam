name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
# Never cancel main — keep its history green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # When the mise cache hits, `mise install` is a no-op and the rust
      # toolchain gets auto-installed by rustup at the first cargo call —
      # with the runner's default minimal profile, which lacks rustfmt and
      # clippy. Provision the pinned toolchain (see [tools] in mise.toml)
      # with its components explicitly; this is idempotent on cache misses.
      - name: Ensure rustfmt and clippy for the pinned toolchain
        run: mise exec -- rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      # Cache the cargo registry and each workspace's target dir. The two
      # workspaces (CLI + harness) have independent target dirs; both are
      # keyed on their Cargo.lock / Cargo.toml + the rustc version, so a cache
      # hit recompiles only changed crates instead of the whole heavy dep tree
      # (ort, lance, lancedb, fastembed, tokenizers, …).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            yidam/cli
            yidam/tests/harness
      - run: mise run ci
