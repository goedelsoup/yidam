# Release — prebuilt `yidam` binaries for the light `reports` build.
#
# VERSIONING.md has said "CI publishes to registries on matching tag patterns"
# since it was written, and nothing did. Every adopter, every derived repository,
# and every CI run of every derived repository compiled the CLI from source —
# which made a Rust toolchain a prerequisite for reading a Markdown corpus.
#
# The light default set is the whole reason this is cheap. It needs no protoc, no
# ML runtime, and no C library that has to already exist for the target (see the
# feature partition in yidam/cli/Cargo.toml). So cross-compiling needs a
# cross-toolchain and nothing else, and no runner needs provisioning beyond that.
#
# It is not literally pure Rust any more. `tonpa` joined the default set and its
# TLS stack compiles `ring`, which is C and assembly. The distinction that
# matters for this workflow is not C-versus-Rust but *vendored versus system*:
# ring's sources are in the crate and cc-rs builds them with the cross-compiler
# below. openssl-sys — reqwest's default TLS — would instead need an aarch64
# libssl installed on the runner, which is why Cargo.toml pins rustls.
#
# `--features full` is deliberately NOT built here. It needs protoc 31 and the
# ONNX/LanceDB stack, and the common case must not wait on it. Someone who wants
# `index-build` still builds from source, as they do today. (`serve --mcp` used
# to be in that sentence and no longer belongs: it moved into the light set, and
# a default binary serves MCP — what it does not serve is *semantic* retrieval.)
#
# `--features vector-read` is NOT built here either, and that is a decision
# rather than an omission — #442 asked it directly. It is much cheaper than
# `full`: no protoc, no LanceDB. It still carries an ONNX runtime, which is a
# native dependency this matrix has never had to cross-compile for aarch64, and
# publishing it would double the artifacts per platform — which every consumer
# then has to choose between, on a `releases/latest` that already answers for
# four versioning layers.
#
# So the channel is `cargo install --features vector-read`: a Rust toolchain,
# and nothing else. What would reverse this is somebody wanting semantic
# retrieval on a machine that has no toolchain — at which point the cost above
# is worth paying, and it is one workflow matrix entry.

name: Release

on:
  push:
    tags:
      # The CLI layer's tag pattern, per VERSIONING.md's artifact table. NOT `v*`
      # — that is the template layer, which releases nothing from this workflow.
      - 'cli/v*'
  # Buildable without tagging, to check the matrix still cross-compiles before
  # cutting a release. Uploads nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false so one broken target still reports the others — a
      # release missing one platform is worth knowing precisely, not as
      # "something failed".
      fail-fast: false
      matrix:
        include:
          # `mcpb_platform` is what makes a target eligible for an `.mcpb` bundle, and
          # its two absences below are the fact rather than an omission: Claude Desktop
          # runs on macOS and Windows only, so a Linux bundle would install nowhere, and
          # this matrix builds no Windows target for one to be made from. It is carried as
          # matrix data rather than an `if:` on the target name so that `mcpb_bundle.rs`
          # can read which platforms are packaged instead of re-deriving the rule.
          - target: aarch64-apple-darwin
            os: macos-latest
            mcpb_platform: darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            mcpb_platform: darwin
          # ── ubuntu-22.04, not ubuntu-latest ──────────────────────────
          #
          # A glibc binary runs on the glibc it was LINKED against or newer, and
          # never on older. ubuntu-latest is 24.04 / glibc 2.39, so the tarball
          # `install.sh` served for `cli/v0.2.0` died on Debian 12 with
          # `version GLIBC_2.39 not found` — a successful download, a verified
          # checksum, an installed binary, and no way to run it. Found by
          # install-channels.yml on its first run; nothing before it looked.
          #
          # 22.04 is glibc 2.35, which clears Debian 12 (2.36), Ubuntu 22.04,
          # and RHEL 9 (2.34 — still below, and out of scope until someone asks).
          # The floor is the runner image and nothing else declares it, so moving
          # this line to `ubuntu-latest` silently raises it again.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            # `gcc-aarch64-linux-gnu` is the cross C compiler, not only the
            # linker. Both halves are used: the linker for the final artifact,
            # the compiler for ring's vendored C. If a dependency ever needs a
            # SYSTEM library for the target rather than a vendored one, this is
            # where it breaks first — which is the right place for it to break.
            linker: aarch64-linux-gnu-gcc
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain, not `@stable`. An artifact built by whatever stable shipped
      # that week is not the build any gate here tested, and this one is published. The
      # three `@stable` steps left in install-channels.yml are the deliberate opposite:
      # they simulate a user, who has whatever stable is, and pinning them would test a
      # channel nobody uses. `toolchain_pins.rs` asserts both halves.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yidam/cli
          key: ${{ matrix.target }}

      # --locked: the release must be built from the committed Cargo.lock, or the
      # artifact is not the thing the pinned commit describes.
      #
      # No --features: the default IS the light set. Spelling it would be a
      # second place for that set to be defined, and the two would drift.
      #
      # CC_* is what cc-rs reads when it builds ring's vendored C for a target
      # that is not the host. cc-rs does guess `<target>-gcc` on its own, but a
      # guess that silently falls back to the host compiler produces host
      # objects for an aarch64 link — so it is named rather than inferred.
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cc }}
        run: |
          cargo build --release --locked \
            --manifest-path yidam/cli/Cargo.toml \
            --target ${{ matrix.target }}

      # The binary must be able to say what it is before it is published. This is
      # the check that a cross-compiled artifact is at least the right shape, and
      # for the two native targets it is a real smoke test.
      - name: Say what was built
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: yidam/cli/target/${{ matrix.target }}/release/yidam --version

      # Asset naming is a contract, not a convenience. `yidam-build` resolves a
      # pinned commit to a tag with `git ls-remote --tags` and then has only
      # (tag, platform) to work with — so the name must be derivable from exactly
      # those two things. See #197.
      - name: Package
        id: pkg
        run: |
          set -eu
          # An explicit `case` rather than `[ x = y ] && …`: that form's exit
          # status is the test's when it fails, and whether `set -e` acts on a
          # short-circuited AND-OR list is not something a reader should have to
          # recall to know if this script continues.
          case "$GITHUB_REF_NAME" in
            cli/v*) version="${GITHUB_REF_NAME#cli/v}" ;;
            *)      version="dev" ;;
          esac
          name="yidam-${version}-${{ matrix.target }}"
          staging="$(mktemp -d)/$name"
          mkdir -p "$staging"
          cp "yidam/cli/target/${{ matrix.target }}/release/yidam" "$staging/"
          cp LICENSE "$staging/"
          tar -czf "$name.tar.gz" -C "$(dirname "$staging")" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # The bundle step renders a manifest carrying this same version. Exported rather
          # than re-derived there, so the two cannot come to disagree about what `dev` means.
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ── the same binary, as a file a person double-clicks ────────────────────
      #
      # #421. Every other channel this workflow feeds ends with a binary on a PATH and a
      # client config file to hand-write; `docs/mcp-server.md` spent a subsection on the
      # `sh -c 'cd … && exec …'` form needed to say WHICH corpus you meant. An `.mcpb` is
      # a zip holding a manifest and this binary, installed by dragging it onto Claude
      # Desktop, and the manifest turns that shell incantation into a directory picker.
      #
      # A zip built with `zip`, not `mcpb pack`: the format is a zip with `manifest.json`
      # at its root, and the official CLI is an npm install this workflow otherwise has no
      # use for. What it would buy is manifest validation, which `mcpb_bundle.rs` does
      # here — where a failure is a red test rather than a bad release.
      - name: Package the MCPB bundle
        id: mcpb
        if: matrix.mcpb_platform != ''
        run: |
          set -eu
          name="${{ steps.pkg.outputs.name }}"
          staging="$(mktemp -d)/bundle"
          mkdir -p "$staging/server"
          cp "yidam/cli/target/${{ matrix.target }}/release/yidam" "$staging/server/"
          cp LICENSE "$staging/"
          ./render-manifest.sh "${{ steps.pkg.outputs.version }}" "${{ matrix.mcpb_platform }}" \
            > "$staging/manifest.json"
          out="$PWD/$name.mcpb"
          # `-r` from inside the staging directory, never `-j`: flattening would put the
          # binary at the archive root and break `entry_point`, and the paths inside the
          # archive are part of the manifest's contract rather than an arrangement.
          (cd "$staging" && zip -qr "$out" .)
          # `if-no-files-found: error` on the upload cannot speak for this file: the
          # tarball matches the pattern set on its own, so a bundle that was never written
          # uploads a green step and a release missing the one asset #421 is about.
          [ -s "$out" ] || { echo "::error::no bundle at $out"; exit 1; }
          shasum -a 256 "$name.mcpb" > "$name.mcpb.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
            ${{ steps.pkg.outputs.name }}.mcpb
            ${{ steps.pkg.outputs.name }}.mcpb.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. workflow_dispatch builds the matrix and stops, which
    # is what makes it usable as a pre-tag check.
    if: startsWith(github.ref, 'refs/tags/cli/v')
    # Job-level, so `build` and `tap` keep the workflow-level `contents: write`
    # and nothing more. A job that declares `permissions` replaces the
    # workflow's rather than adding to it, which is why `contents: write` is
    # repeated here — `gh release create` below needs it.
    permissions:
      contents: write
      id-token: write      # the OIDC token the attestation is signed with
      attestations: write  # writing the attestation to this repository
    steps:
      - uses: actions/checkout@v4

      # The tag and the manifest must agree. They can drift in either direction —
      # a tag cut before the bump, or a bump pushed without a tag — and an
      # artifact whose --version disagrees with the release it hangs under is
      # exactly the confusion this whole workflow exists to remove.
      - name: The tag and Cargo.toml must name the same version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#cli/v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' yidam/cli/Cargo.toml | head -1)
          echo "tag=$tag_version  manifest=$manifest"
          if [ "$tag_version" != "$manifest" ]; then
            echo "::error::tag cli/v$tag_version does not match yidam/cli/Cargo.toml version $manifest"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file over everything, alongside the per-asset ones. A
      # consumer verifying a single download should not have to fetch a manifest
      # covering platforms it will never run.
      - name: Collect checksums
        run: |
          set -eu
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -la

      # ── build provenance ──────────────────────────────────────────────────
      #
      # mise prints two lines on every install of this binary:
      #
      #   [2/3] verify GitHub artifact attestations
      #   [2/3] verify SLSA provenance
      #
      # and until this step existed there was nothing for either to find. They
      # passed over an absence and read exactly as they read for a signed
      # artifact — a third party's verification, phrased as if it succeeded,
      # printed to the user during install. Compare a repository that does
      # publish attestations, where mise adds a line this one never produced:
      #
      #   [2/3] ✓ GitHub artifact attestations verified
      #
      # The absence of that line is the only thing that distinguished them, and
      # nobody reads for a line that is not there. Same shape as a guard that
      # scans an empty list and reports green.
      #
      # BEFORE `gh release create`, so there is no window in which an asset is
      # downloadable and unattested. Attestations are keyed to the artifact
      # digest, not to the release, so this ordering costs nothing.
      #
      # The `.sha256` files are deliberately not subjects: they are checksums OF
      # the tarballs, and attesting the tarball covers what they assert. They go
      # on answering the question they always answered for install.sh, the tap
      # and `[yidam-build]` — integrity, not origin. This step is the origin
      # half, and it is the half `gh attestation verify` and mise both want.
      #
      # The `.mcpb` bundles ARE subjects, on the same grounds the tarballs are:
      # each carries a `yidam` binary, and it is the one channel whose installer
      # is a person dragging a downloaded file onto an application. A checksum
      # covers the bytes; only this covers where they came from.
      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.mcpb

      # ── the notes carry the upgrade note, or they carry only titles ──────────
      #
      # `--generate-notes` produces a flat list of merged PR titles and there is
      # nowhere in it for prose. So a change that breaks a working configuration
      # arrived as one `fix(serve): …` line among twenty, indistinguishable from a
      # docs fix — which is how a reader upgrading learns nothing until their
      # server stops coming up (#549).
      #
      # The generated list is still the body. `docs/upgrading.md`'s section for
      # THIS tag goes above it, because the person who needs it is reading the top
      # of the page and stops there. A release with no section prepends nothing and
      # looks exactly as it did before; `release.sh` is what refuses a note staged
      # under `## Unreleased` rather than filed under the tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Which release these notes start from, asked per layer rather than left to
          # GitHub. Omitting `previous_tag_name` let it pick `cli/v0.7.0` for
          # `cli/v0.9.0` — past `cli/v0.8.0`, which exists and is an ancestor — and the
          # published notes listed 37 pull requests where 16 belonged to the release
          # (#555). The same call answers correctly for `cli/v0.8.0`, so the heuristic is
          # right for one release and wrong for the next with nothing visible between
          # them.
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | .github/scripts/previous-release-tag.sh "$GITHUB_REF_NAME")

          if [ -n "$previous" ]; then
            echo "notes start from $previous"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f previous_tag_name="$previous" --jq .body > generated.md
          else
            # The first release of a layer has no predecessor, and an empty
            # `previous_tag_name` is not the way to say so.
            echo "no earlier release of this layer; generating from the beginning"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          fi

          # The lines under `## <tag>` up to the next `## ` heading. `-v` rather
          # than interpolating the tag into the program: a tag holds `/` and `.`,
          # and `cli/v0.9.0` as an awk regex would match `cli/v0X9Y0`.
          awk -v tag="## $GITHUB_REF_NAME" '
            $0 == tag { inside = 1; next }
            /^## / { inside = 0 }
            inside { print }
          ' docs/upgrading.md > upgrade.md

          if [ -s upgrade.md ]; then
            {
              echo "## Before you upgrade"
              cat upgrade.md
              echo
              echo "---"
              echo
            } > notes.md
            cat generated.md >> notes.md
            echo "prepended $(wc -l < upgrade.md) line(s) of upgrade notes for $GITHUB_REF_NAME"
          else
            cp generated.md notes.md
            echo "no upgrade-notes section for $GITHUB_REF_NAME; publishing the generated list alone"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.mcpb dist/*.sha256 dist/SHA256SUMS

  # ── The Homebrew tap ────────────────────────────────────────────────────────
  #
  # The steps live in tap.yml, which a person can also dispatch directly. On
  # `cli/v0.2.1` this job's render succeeded and its push failed on a missing
  # secret, and the only repair on offer was re-running it from this run — which
  # stops being possible once the run's artifacts age out, leaving a hand-edited
  # formula as the sole way to correct the tap (#246). Two entrances into one set
  # of steps is what removes that dead end; a recovery path implemented separately
  # would be a second thing to be wrong.
  #
  # `needs: publish` — the formula names release assets by url and pins their
  # checksums, and tap.yml reads those checksums from the release itself.
  # Rendering before the release exists produces a formula that is correct in
  # every visible respect and 404s.
  tap:
    name: tap (goedelsoup/homebrew-tap)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/cli/v')
    uses: ./.github/workflows/tap.yml
    with:
      tag: ${{ github.ref_name }}
    # `inherit` rather than a named secret: tap.yml declares HOMEBREW_TAP_TOKEN
    # optional so that an absent one reaches its own guard, and a name listed
    # here for a secret that does not exist is a workflow-level error instead.
    secrets: inherit
