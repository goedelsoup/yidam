name: Test summary
description: >
  Render a gate's test results into its job summary, and keep the machine-readable results
  when it failed.

# One definition, used by every gate that produces JUnit. Copies of a summary step is copies
# of a place for the reporting to rot unevenly — and a gate whose summary quietly stopped
# rendering looks exactly like a gate with nothing to report, which is the failure #462 is
# about.

inputs:
  gate:
    description: The job name a reader sees, used as the summary's heading.
    required: true
  job:
    description: >
      The job this gate runs in, as the run displays it, when that is not `gate` itself.
      `ci (parity)` runs three parity arms and summarises one, so its gate reads
      `ci (parity · rust sdk)` — a truer heading than the job name, and one that the run's
      job list will never match. Supplying this is what lets the merge stamp such a gate with
      its job's conclusion instead of leaving it unknown (#516).
    required: false
    default: ""
  junit:
    description: Path to the JUnit XML the run wrote.
    required: true
  artifact:
    description: Name for the uploaded results. Must be unique across the run.
    required: true
  lcov:
    description: >
      Path to the LCOV this gate produced, when it produced one. Supplying it adds the
      diff-coverage section; `features` must come with it, because a coverage number whose
      build is unstated is the number #464 exists to remove.
    required: false
    default: ""
  features:
    description: Cargo features the coverage was measured under, comma-separated.
    required: false
    default: ""
  src:
    description: Source root the coverage is about, for classifying what was not compiled.
    required: false
    default: ""
  json:
    description: >
      Set to `true` to also write this gate's `quality-report.json` fragment and upload it.
      The fragment is one gate's whole envelope; `ci.yml`'s `quality` job merges every gate's
      into the document #467's pages read. Off by default so a gate that adds a summary does
      not silently start contributing to a published report.
    required: false
    default: ""
  manifest:
    description: >
      Cargo manifest of the workspace that ran, when there is one. Supplying it adds the
      `#[ignore]`d tests to the census — they are absent from nextest's JUnit and can only be
      read from `nextest list`. Gates that are not cargo (the extension) leave it empty, and
      their summary counts only what their runner reports.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # `always()` on every step below: a summary that renders only when the gate passed is a
    # summary for the case that needed no explaining.
    # `--locked`, like every other cargo line here. It could not be passed when this action
    # was written — the harness workspace had no committed `Cargo.lock`, hidden by a global
    # gitignore entry — and #463 committing it is what let the flag come back. It came back
    # because `ci_reporting.rs` asserts the pairing and went red, not because anyone
    # remembered.
    - name: Build the reporter
      if: always()
      shell: bash
      run: |
        mise exec -- cargo build --locked \
          --manifest-path yidam/tests/harness/Cargo.toml \
          --package ci-report

    # Where the `#[ignore]`d tests are visible. They are absent from nextest's JUnit
    # entirely — a binary whose every test is ignored writes `tests="0"` with no children —
    # so a census built on the XML alone reports zero skipped for a suite that ran nothing.
    # This is not decoration; it is half the census.
    - name: List the tests, including the ignored ones
      if: always() && inputs.manifest != ''
      shell: bash
      run: |
        mise exec -- cargo nextest list \
          --config-file .config/nextest.toml \
          --manifest-path "${{ inputs.manifest }}" \
          --message-format json > "${RUNNER_TEMP}/nextest-list.json"

    # `-U0`, so a hunk's range is exactly the added lines. With context the range covers
    # lines the change did not touch, and diff coverage starts grading a neighbour's code.
    - name: The lines this change added
      if: always() && inputs.lcov != ''
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
        git diff -U0 "$base"...HEAD -- '*.rs' > "${RUNNER_TEMP}/change.diff" || true

    - name: Render the summary
      if: always()
      shell: bash
      # `ci-report` exits non-zero on a run with no test cases rather than publishing a
      # summary of nothing, and this step does not swallow that: a blank summary under a
      # green check is indistinguishable from "everything passed", which is the whole
      # subject of this phase.
      #
      # One invocation writes both the markdown and the fragment, deliberately. The page and
      # the job summary describe one measurement, and two runs of the reporter over the same
      # inputs is how they would come to disagree about a number nobody could reconcile.
      run: |
        args=(--gate "${{ inputs.gate }}" --junit "${{ inputs.junit }}")
        if [ -n "${{ inputs.job }}" ]; then
          args+=(--job "${{ inputs.job }}")
        fi
        if [ -n "${{ inputs.manifest }}" ]; then
          args+=(--list "${RUNNER_TEMP}/nextest-list.json")
        fi
        if [ -n "${{ inputs.lcov }}" ]; then
          args+=(--lcov "${{ inputs.lcov }}" --diff "${RUNNER_TEMP}/change.diff")
          args+=(--src "${{ inputs.src }}" --features "${{ inputs.features }}")
        fi
        if [ -n "${{ inputs.json }}" ]; then
          mkdir -p "${RUNNER_TEMP}/quality"
          args+=(--json "${RUNNER_TEMP}/quality/${{ inputs.artifact }}.json")
        fi
        yidam/tests/harness/target/debug/ci-report "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

    # `always()`, unlike the artifact below it, and that is the whole point: a gate that
    # failed is a gate whose numbers the report most needs, and one uploaded only on success
    # would give the pages a document in which nothing ever fails.
    #
    # Named per gate. The merge downloads them into one directory, so two gates writing
    # `fragment.json` would leave one report describing half a run.
    - name: Keep this gate's numbers
      if: always() && inputs.json != ''
      uses: actions/upload-artifact@v4
      with:
        name: quality-${{ inputs.artifact }}
        path: ${{ runner.temp }}/quality/${{ inputs.artifact }}.json
        if-no-files-found: error

    # Only on failure, and it is the whole of the evidence: the JUnit carries each failing
    # test's captured output, so a fix can start from the diff rather than from a local
    # re-run. `report_goldens.rs` and `query_goldens.rs` both honour `UPDATE_GOLDENS=1`,
    # which is the one command a golden failure needs once its diff is in hand.
    - name: Keep the results when the gate failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.junit }}
        if-no-files-found: warn
