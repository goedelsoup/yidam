# Dependency updates, proposed rather than discovered after they break.
#
# The weekly schedule in ci.yml exists to catch arrow/lancedb version-lock rot — *after* it
# rots. Nothing proposed an update across three cargo manifests, three npm projects and every
# pinned action, so every bump in this repository has been a reaction (#463).
#
# **Grouped on purpose.** Ungrouped, this opens five or more pull requests a week across six
# ecosystems, each needing its own CI run and its own review, and the reliable outcome is
# that people stop reading them. One batch per ecosystem per week is a thing somebody can
# actually look at.
version: 2
updates:
  # ── cargo ×3 ───────────────────────────────────────────────────────────────
  # Three separate workspaces with three separate lockfiles. Named individually because
  # dependabot resolves per-manifest; a single entry would update one and leave the others
  # to drift, which is how yidam/cli's lock came to be the only one anybody maintained.
  - package-ecosystem: cargo
    directory: /yidam/cli
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      cargo-cli:
        patterns: ["*"]
    # **fastembed is held at 4, and this is what makes the hold hold.**
    #
    # The argument is in `yidam/cli/Cargo.toml` beside the dependency and is a measurement:
    # fastembed 6 embeds the same sentence to a different vector, `transformers.js` agrees
    # with 4.9.1 and not with 6, and re-recording the fixture would relabel the outlier as
    # the reference and make the TypeScript SDK non-conforming to its own parity contract.
    # #536 holds it open.
    #
    # That argument was written in a comment one line above the dependency, and a bump took
    # the dependency to 6 anyway — comments are not a mechanism. It broke `ci (cli · full
    # features)` on main, which is the one job PR CI never runs, so it was invisible until
    # after the merge and stayed red across two more commits.
    #
    # **The mechanism is `dependency_holds.rs`, not this entry.** The parity fixture now
    # records the runtime that produced its eight reference dimensions
    # (`reference = { runtime = "fastembed", version = "4.9.1" }`), and
    # `every_parity_reference_runtime_is_the_major_the_lockfile_resolves` compares that major
    # against the lock on every pull request. So the bump is red wherever it comes from, and
    # this `ignore` is only here to stop it being proposed weekly (#904).
    #
    # Major only. Patch and minor releases within 4 are wanted, and are the releases that
    # will carry the fix this hold is waiting for.
    # **arrow must match lancedb's transitive dependency**, which `Cargo.toml` states one line
    # above the declaration: *"update together if bumping either."* The same bump moved
    # arrow 53 → 54 and left lancedb at 0.15, which pins 53 — so `index_build` handed a
    # lancedb builder a `RecordBatchIterator` of the wrong arrow, and `IntoArrow` went
    # unsatisfied. Two arrow majors in one binary, from a version bump that read as routine.
    #
    # A major arrow bump is only ever correct alongside a lancedb release that took the same
    # one, so it is not a thing to propose on its own.
    #
    # `every_arrow_this_workspace_declares_is_the_one_lancedb_resolves` is what holds it, and
    # it reads the lockfile rather than this file: cargo writes a bare `"arrow-array"` in a
    # dependency list while one version is in the graph and `"arrow-array 54.0.0"` once there
    # are two, so the disagreement is visible where the two sides actually meet (#904).
    ignore:
      - dependency-name: fastembed
        update-types: [version-update:semver-major]
      - dependency-name: arrow-array
        update-types: [version-update:semver-major]
      - dependency-name: arrow-schema
        update-types: [version-update:semver-major]
      - dependency-name: arrow-ipc
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /yidam/prelude/sdks/rust
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      cargo-sdk:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /yidam/tests/harness
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      cargo-harness:
        patterns: ["*"]

  # ── npm ×3 ─────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /yidam/editors/vscode
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      npm-extension:
        patterns: ["*"]
    # `@types/vscode` follows `engines.vscode` in package.json, not the registry: vsce refuses
    # to package an extension whose types are newer than the floor it declares, and the group
    # bumped it to 1.138 against a floor of 1.90 — green on every PR, because `ci (vscode)`
    # packaged nothing, and red on the first `editor/v*` tag. Raising it is the decision to
    # drop every VS Code older than the new types, which is a floor change and not a bump.
    #
    # `the_extension_types_name_the_floor_the_extension_declares` compares the two minors on
    # every pull request, and also holds the range to a tilde — under a caret `npm install`
    # floats the types past the floor with no bump to review at all, which this entry could
    # never have stopped (#904).
    ignore:
      - dependency-name: "@types/vscode"
  - package-ecosystem: npm
    directory: /yidam/web/docs
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      npm-docs:
        patterns: ["*"]
  # The web editor (#609). Its own entry rather than a pattern on one of the two above, for
  # the reason the cargo block gives: dependabot resolves per-manifest, so an entry that does
  # not name this directory leaves this lockfile to drift — and unlike the other two npm
  # projects, this one's lockfile is *published*, in the sense that the tarball it produces is
  # what an `npx` user runs. `astro` and `@astrojs/node` are its runtime, not its toolchain.
  - package-ecosystem: npm
    directory: /yidam/editors/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      npm-edit:
        patterns: ["*"]

  # ── actions ────────────────────────────────────────────────────────────────
  # Every workflow pins its actions by major tag. An action is code this repository runs
  # with a token, and it is the one ecosystem here where nothing else — not cargo-deny, not
  # a lockfile — is watching at all.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    # **`dtolnay/rust-toolchain` carries no version tags.** The ref *is* the toolchain it
    # installs, so `@1.88.0` is not a version of the action — it is the compiler. Read as a
    # version, it bumps: #629 arrived with three steps rewritten to `@1.120.0`, and the
    # cross-compile job died before it compiled anything — *could not download nonexistent
    # rust version 1.120.0-x86_64-unknown-linux-gnu*.
    #
    # The 404 is not the failure that matters. Two of those three steps were in `release.yml`
    # and `publish-crates.yml`, so what a bump on this ref actually proposes is a silent
    # change to which compiler builds the published artifact. `toolchain_pins.rs` is why that
    # was a red gate rather than a release nobody chose the compiler for.
    #
    # Whole-dependency rather than major-only, because there is no version of this ref that
    # means what dependabot thinks it means. The toolchain moves when `mise.toml` moves, and
    # `every_workflow_toolchain_is_the_pin_or_carries_its_reason` holds the workflows to it —
    # the pin has a maintainer, and it is not this ecosystem. The cost accepted is that a
    # genuine change to the action's implementation is no longer proposed; it is a thin
    # wrapper around `rustup`, and the failure mode closed here is a silent change to what
    # ships.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
