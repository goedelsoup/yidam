# The service account a generated workflow runs as, and the one role it needs.
#
# Argo's executor sidecar records each task's result as a `WorkflowTaskResult`; that is the
# whole of what a `yidam` pod's account may do in the cluster. The main container never sees
# the token: the workflow sets `automountServiceAccountToken: false` and names this account
# for the executor alone. Git and the vault are reached with the secrets the workflow mounts,
# never with a Kubernetes identity.
#
# The name is streamflow's, the worked example's: `yidam-<corpus>-run`, or whatever
# `[cluster.names] service_account` declares. Each corpus in a namespace applies its own copy
# under its own name. Put yours in place of `yidam-streamflow-run` before applying:
#
#   sed 's/yidam-streamflow-run/yidam-<corpus>-run/' docs/cluster/argo-rbac.yml \
#     | kubectl apply -n <namespace> -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yidam-streamflow-run
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yidam-streamflow-run
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yidam-streamflow-run
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yidam-streamflow-run
subjects:
  - kind: ServiceAccount
    name: yidam-streamflow-run
