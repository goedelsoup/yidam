# mise.toml — toolchains and tasks for this yidam-derived repository.
# https://mise.jdx.dev
#
# This file is part of the yidam template. Yidam itself uses it to
# run the bootstrap harness (yidam/tests/harness/). Derived repos use it for both
# the harness and the domain computer (crates/, packages/).
#
# `mise install` provisions the toolchains below.
# `mise tasks`   lists every available task.
# `mise run ci`  is what CI runs.

[tools]
# Rust — domain computer (crates/), bootstrap harness (yidam/tests/harness/), yidam CLI (yidam/cli/).
# Must match rust-toolchain.toml in yidam/tests/harness/.
rust = { version = "1.88.0", components = "rustfmt,clippy" }
# protoc — required by lance-encoding's build script (prost-build), a
# transitive dependency of the yidam CLI via lancedb.
protoc = "31"
# Python — packages/ ML pipelines, embedding model SDKs, geospatial connectors.
python = "3.12"
# uv — fast Python package/venv manager; used in packages/.
uv = "latest"
# Node.js — docs site (yidam/web/docs/), packages/web/.
node = "lts"
# cargo-nextest — the runner every Rust gate below uses. `cargo test` prints a result and
# emits nothing any consumer can read: no summary, no artifact, no input for RFC-0025's
# quality report, and no count of what was skipped (#462). nextest writes JUnit, which is
# what all of those are built on.
#
# Here rather than pinned per-task, unlike dafny below: this is what `mise run ci` runs, so
# there is no laziness to buy. It is a ~10MB single binary against dafny's 200MB.
#
# The version is the release *tag*. nextest's repository publishes several artifacts from one
# namespace and tags this one `cargo-nextest-<version>`; mise resolves the string literally,
# so the prefix is part of the pin rather than noise in it.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"
# dafny and LEAN are NOT here on purpose — see [tasks.verify]. Neither is in the mise
# registry, both are large, and both are needed by exactly one task. `mise install` runs in
# every derived repository, so a tool pinned here is a download every corpus pays for.

# `.local/bin` first, so every task below runs the binary built from THIS tree
# rather than whichever yidam a derived repository last installed system-wide.
[env]
_.path = [".local/bin"]
# Which nextest profile every gate runs under, said once. `.config/nextest.toml`'s `ci`
# profile is what turns on JUnit output and captured success output; a gate that ran under a
# different profile would pass while writing nothing for the summary to read, which is the
# exact shape of failure this phase exists to remove.
NEXTEST_PROFILE = "ci"

# ── yidam CLI — build ─────────────────────────────────────────────────
# The `yidam` binary lives in yidam/cli/. In a derived repo it is installed by
# that repo's own `yidam-build`, which clones this origin at the commit its
# .yidam.toml pins and compiles it — there is no registry and no published
# artifact to install from. In this repo, build it first with:
#   mise run yidam-build

[tasks.yidam-build]
description = "Compile and install the full-feature yidam binary from yidam/cli/ into .local/bin/."
# `--features full` so the maintainer's install has index-build/serve/sqlite/rdf/
# tonpa. The default build is the light `reports` binary (no protoc, no ML stack).
#
# --root rather than ~/.cargo/bin, for the reason in mise.yidam.toml: the install
# location was per-machine while the thing installed is per-repository, so
# building here clobbered every derived repo's pinned binary and building in one
# of those clobbered this. `cargo install --root DIR` writes DIR/bin, so this
# lands at .local/bin/yidam — not `.yidam/bin` as in a derived repo, because
# `.yidam/` is derived-repo infrastructure and this repository has none.
#
# --force: without it cargo refuses with "binary yidam already exists in
# destination" (exit 101) when .local/bin holds a binary its install metadata
# does not account for, which is any state the two drift into. The task exists
# to make the binary match this tree; failing instead is not an option it should
# have. Same reason as the derived-repo task in mise.yidam.toml.
#
# --locked, as in the derived-repo task this mirrors. Without it `cargo install`
# re-resolves rather than reading Cargo.lock, and this build had been failing
# since chrono published 0.4.45: it supplies a `Datelike::quarter` that collides
# with `arrow-arith`'s own `ChronoDateExt::quarter`, so the pinned arrow 52.2.0
# stops compiling — E0034, in a transitive dependency, from a lock file that
# says 0.4.39. The task simply failed from then on, and the only sign was that
# `.local/bin/yidam` kept answering with the version it was last built at.
run = "cargo install --force --root .local --path yidam/cli --features full --locked"

# ── yidam CLI — REGEN tasks ───────────────────────────────────────────
# These tasks back the <!-- REGEN: yidam <subcommand> --> markers across
# README files. Run `mise run yidam-build` once before using them here;
# derived repos call the installed binary directly.
#
# Run a specific subcommand directly, or `mise run regen` to refresh all
# REGEN sections in one pass.

[tasks.status]
description = "Repo overview: node count, open questions, catalog entries, index freshness, active phases, genesis date."
run = "yidam status"

[tasks.open-questions]
description = "List corpus nodes with open questions (? titles or [open] claims)."
run = "yidam open-questions"

[tasks.corpus-index]
description = "Regenerate corpus/README.md index table."
run = "yidam corpus-index"

[tasks.index-status]
description = "Report vector index state: embedding model, coverage, freshness, retrieval latency."
run = "yidam index-status"

[tasks.catalog-audit]
description = "Audit catalog/ entries: integrity status, citation count, stale sources."
run = "yidam catalog-audit"

[tasks.agents-index]
description = "Regenerate agents/README.md index table."
run = "yidam agents-index"

[tasks.skills-index]
description = "Regenerate skills/README.md index table."
run = "yidam skills-index"

[tasks.crates-index]
description = "Regenerate crates/README.md index table."
run = "yidam crates-index"

[tasks.packages-index]
description = "Regenerate packages/README.md index table."
run = "yidam packages-index"

[tasks.bundle-status]
description = "Report web/ bundle state: contract version, feeds, last export timestamp, deploy status."
run = "yidam bundle-status"

[tasks.regen-check]
description = "Report which REGEN blocks are stale, writing nothing. Exits nonzero when any is."
run = "yidam regen --check"

[tasks.regen]
description = "Regenerate all REGEN sections across READMEs in one pass."
# `yidam regen` and not a `depends` list — the set lives in the CLI
# (`cmd::regen::GENERATORS`) so this task, the same task in mise.yidam.toml, and the
# derived-repo CI step cannot drift from each other. They had: two of the eight were
# checked by CI, and `status`/`open-questions` were in no list at all.
run = "yidam regen"

# ── domain computer (crates/) ──────────────────────────────────────────────
# No-ops in yidam itself — sadhana/crates/ has no Cargo workspace. These
# become the primary dev loop in derived repos once the workspace is
# initialized alongside the domain connectors, calculators, and index crate.

[tasks.build]
description = "Build the domain computer (crates/ workspace)."
run = "cargo build --workspace --manifest-path crates/Cargo.toml"

[tasks.lint]
description = "Clippy across the domain computer."
run = "cargo clippy --workspace --manifest-path crates/Cargo.toml -- -D warnings"

[tasks.test]
description = "Run domain computer tests."
run = "cargo test --workspace --manifest-path crates/Cargo.toml"

[tasks.fmt]
description = "Format domain computer Rust code."
run = "cargo fmt --all --manifest-path crates/Cargo.toml"

# ── parity + formal verification ──────────────────────────────────────────
# `parity` enforces the MUST rule: every parity function must have at least
# one fixture in prelude/sdks/parity/fixtures/<function>/ before SDK tests run.
#
# `verify` requires dafny (in [tools]) and lake (install via elan separately).

[tasks.parity-check]
description = "Verify the parity fixtures in both directions: every function has one, and every fixture directory has a runner."
run = """
fixtures="yidam/prelude/sdks/parity/fixtures"
functions="parse_node extract_claims extract_links classify_commit is_recognized_verb parse_markers update_regen find_reachable find_citations compile_class_schema"
# Fixture families that are NOT parity functions. Each is read by a runner that is not an
# SDK suite, and each has a section in parity/README.md naming those runners — which the
# loop below checks, so this list cannot quietly diverge from the document explaining it.
exceptions="reports embed_config diagnostic_severity"

# Every function has a fixture.
for fn in $functions; do
  count=$(ls $fixtures/$fn/*.toml 2>/dev/null | wc -l | tr -d ' ')
  if [ "$count" -eq 0 ]; then
    echo "ERROR: no fixture for parity function '$fn'"
    echo "       add at least one fixture to $fixtures/$fn/"
    exit 1
  fi
done

# And every fixture has a reader. A directory nobody runs looks exactly like one that is
# doing work: it passes every gate and asserts nothing. Same failure class one layer up
# from two transcriptions each pinned only by itself.
for dir in $fixtures/*/; do
  name=$(basename "$dir")
  case " $functions $exceptions " in
    *" $name "*) ;;
    *)
      echo "ERROR: $fixtures/$name/ is not a parity function and is not a declared exception"
      echo "       a fixture directory no runner reads passes every gate and asserts nothing."
      echo "       Either add it to the parity surface, or add it to 'exceptions' in this"
      echo "       task AND give it a section in parity/README.md naming who runs it."
      exit 1
      ;;
  esac
done

# An exception with no section in the README is a list entry excusing itself.
for name in $exceptions; do
  if ! grep -q "^## .*$name" yidam/prelude/sdks/parity/README.md; then
    echo "ERROR: '$name' is excepted from the parity surface but parity/README.md has no"
    echo "       section for it. The exception list says what is not a parity function; the"
    echo "       README is where it says who reads it instead. An incidental mention in"
    echo "       prose is not that, which is why this wants a heading."
    exit 1
  fi
done

# Counted, not stated. This line read "9 functions covered" while the loop above walked
# ten — the same drift one line below the check that exists to catch it.
echo "parity fixture check: $(echo $functions | wc -w | tr -d ' ') functions covered, $(ls -d $fixtures/*/ | wc -l | tr -d ' ') directories all accounted for"
"""

[tasks.parity]
description = "Run every SDK test suite: the cross-language parity fixtures, and each SDK's own unit tests."
depends = ["parity-check"]
# The whole suite per SDK, not `-- parity`. The filters used to be narrower, and the effect
# was that an SDK test outside the parity fixtures ran nowhere: `ci-cli` builds only the
# CLI's workspace, and this was the only job that touched yidam/prelude/sdks — with a filter
# that excluded anything not named `parity`. A test nothing runs looks exactly like one that
# is doing work, which is the finding `parity-check`'s own directory loop exists to produce,
# one level up.
run = [
  "cargo nextest run --config-file .config/nextest.toml --manifest-path yidam/prelude/sdks/rust/Cargo.toml",
  "cargo test --doc --manifest-path yidam/prelude/sdks/rust/Cargo.toml",
  "cd yidam/prelude/sdks/typescript && npm test",
  "cd yidam/prelude/sdks/python && uv run --extra dev pytest tests/",
]

[tasks.domain-parity-check]
description = "Verify every domain function has at least one fixture in yidam/prelude/domains/parity/fixtures/."
run = """
fixture_dir="yidam/prelude/domains/parity/fixtures"
if [ ! -d "$fixture_dir" ]; then
  echo "domain-parity-check: no fixtures directory yet — skipping"
  exit 0
fi
failed=0
for fn_dir in "$fixture_dir"/*/; do
  fn=$(basename "$fn_dir")
  count=$(ls "$fn_dir"*.toml 2>/dev/null | wc -l | tr -d ' ')
  if [ "$count" -eq 0 ]; then
    echo "ERROR: domain function '$fn' has no fixtures"
    echo "       add at least one fixture to $fn_dir"
    failed=1
  fi
done
if [ "$failed" -eq 1 ]; then exit 1; fi
echo "domain-parity-check: all domain functions covered"
"""

[tasks.domain-parity]
description = "Run cross-language parity tests for all domain implementations."
depends = ["domain-parity-check"]
run = """
for domain_dir in yidam/prelude/domains/*/; do
  domain=$(basename "$domain_dir")
  if [ "$domain" = "parity" ]; then continue; fi
  if [ -f "$domain_dir/rust/Cargo.toml" ]; then
    cargo test --manifest-path "$domain_dir/rust/Cargo.toml" -- parity
  fi
  if [ -f "$domain_dir/typescript/package.json" ]; then
    (cd "$domain_dir/typescript" && npm test -- parity)
  fi
  if [ -f "$domain_dir/python/pyproject.toml" ]; then
    (cd "$domain_dir/python" && uv run --extra dev pytest tests/parity/)
  fi
done
"""

[tasks.embed-parity]
description = "Cross-runtime embedding reproducibility check (fastembed / transformers.js / sentence-transformers). Downloads model weights on first run; skipped by the default parity task."
env = { YIDAM_EMBED_PARITY = "1" }
run = [
  "cargo test --manifest-path yidam/cli/Cargo.toml --features index --test embed_parity",
  "cd yidam/prelude/sdks/typescript && npm test -- embed_parity",
  "cd yidam/prelude/sdks/python && uv run --extra dev --extra embed pytest tests/parity/test_embed_config.py",
]

# This task was declared, was documented, and had never executed once — #461. Three faults,
# none of which anything could report, because nothing ran it:
#
#   1. No `dir`, so mise ran it from the repository root and `lake build` looked for a
#      lakefile that is four directories down. Fixed by `dir` below; the paths are now
#      relative to the specs, which is also what makes the guard test's job legible.
#   2. `lakefile.lean` set `name := "Yidam"` — a String where Lake wants a Name — so the
#      package did not elaborate even from the right directory. Lake accepted the string
#      form years ago, which is the tell: it was written against a toolchain nobody
#      recorded. `lean-toolchain` beside it records one now.
#   3. Neither tool was installed by anything. `dafny verify` had never run on any machine
#      we can evidence, and both specs turned out not to parse under Dafny 4.
#
# Dafny is pinned per-task rather than in [tools]: `mise install` runs in every derived
# repository, and this is a 200MB download for a task a corpus will almost never invoke.
# The release ships a self-contained zip that unpacks to a `dafny/` directory holding the
# binary and its .NET runtime, hence extract_all + bin_path rather than a one-line pin.
#
# LEAN has no equivalent line. `github:leanprover/elan` ships only `elan-init`, a
# bootstrapper, so mise cannot provision `lake` — and pinning `leanprover/lean4` directly
# would be a second version of a thing `lean-toolchain` already pins, which is one more
# place for the two to disagree. `lean-toolchain` is the single pin: elan reads it locally
# (https://github.com/leanprover/elan) and lean-action reads it in CI. `formal_specs.rs`
# asserts the workflow names no version of its own.
[tasks.verify]
description = "Formal verification: Dafny specs and LEAN 4 proofs (needs lake on PATH via elan)."
dir = "yidam/prelude/sdks/spec"
tools = { "github:dafny-lang/dafny" = { version = "4.11.0", extract_all = true, bin_path = "dafny" } }
run = [
  "dafny verify graph.dfy",
  "dafny verify sangha.dfy",
  "lake build Yidam",
]

# ── supply chain (#463) ───────────────────────────────────────────────────
#
# Nothing checked a single advisory before this. The light binary carries rustls (and so
# `ring`), reqwest and an S3 client; the full build adds an ONNX runtime and LanceDB. Six
# install channels deliver it and `install-channels.yml` verifies that they *work* — nothing
# asked whether what they deliver has a known vulnerability or a licence this repository can
# ship. The first run found three advisories, one of them in a crate added the week before.
#
# The tools are pinned per-task rather than in [tools], for the reason [tasks.verify] gives:
# `mise install` runs in every derived repository, and these serve one gate.

[tasks.deny]
description = "Advisories, licences, bans and sources across all three cargo workspaces."
tools = { "github:EmbarkStudios/cargo-deny" = "0.20.2" }
# All three manifests, because each resolves its own dependency graph and only yidam/cli's
# is the one anybody thinks about. The harness is what runs in CI; the SDK is published.
run = [
  "cargo deny --manifest-path yidam/cli/Cargo.toml check",
  "cargo deny --manifest-path yidam/prelude/sdks/rust/Cargo.toml check",
  "cargo deny --manifest-path yidam/tests/harness/Cargo.toml check",
]

[tasks.machete]
description = "Unused dependencies across every cargo manifest."
tools = { "github:bnjbvr/cargo-machete" = "v0.9.2" }
# Cheap and pointed: a stray default-features dependency is how `protoc` gets back into the
# light build RFC-0023 split it out of. Its first run removed three — two `pulldown-cmark`
# and one `anyhow`, none of them referenced by a single line of code.
run = "cargo machete"

[tasks.semver-check]
description = "API compatibility of yidam-core against the last version published to crates.io."
tools = { "github:obi1kenobi/cargo-semver-checks" = "v0.50.0" }
# `+stable`, and it is the one place in this repository that deliberately leaves the pin.
# cargo-semver-checks needs rustc >= 1.93 to read rustdoc JSON and the pin is 1.88.0. It
# builds nothing this repository ships — it reads an API and compares it — so the reason the
# release path was pinned in #463 does not apply to it. `toolchain_pins.rs` requires every
# such departure to say why, which is what this comment is.
#
# `publish-crates.yml` runs it before the upload, which is the last moment it is not too
# late: a published version cannot be replaced, only yanked.
run = "cargo +stable semver-checks check-release --manifest-path yidam/prelude/sdks/rust/Cargo.toml"

[tasks.supply-chain]
description = "The whole supply-chain gate: advisories, licences, unused deps."
# `semver-check` is deliberately not here. It needs a different toolchain and a network
# baseline from crates.io, and it answers a different question — what a *release* would
# break, rather than what this tree carries.
depends = ["deny", "machete"]
# ── design system (#465) ──────────────────────────────────────────────────
#
# `_adherence.oxlintrc.json` forbids raw hex, raw px, off-system fonts and undeclared
# component props. Nothing invoked it — not this file, not a workflow, not a package.json —
# and it would not have run if anything had: it carried an `x-omelette` key that oxlint
# rejects outright, so the config had never been loadable either. A surface with no consumer,
# and the consumer would have failed on contact.
#
# It lints JS and JSX, which is what oxlint reads. The palette's other two consumers are CSS
# files it cannot parse, and they are covered from the other side: they now hold no colours
# at all, only `var(--…)` into the one bundle, and `design_tokens.rs` asserts that no surface
# outside yidam/design/ declares a raw hex.

[tasks.design-lint]
description = "Design-system adherence: no raw hex, no raw px, no off-system fonts, declared props only."
tools = { "npm:oxlint" = "1.42.0" }
# `--deny-warnings`, because a lint that only warns in CI is a lint that is off. The rules
# themselves moved from `warn` to `error` in #465 for the same reason; this covers oxlint's
# own defaults, one of which was already firing on a stray escape in `Avatar.jsx`.
#
# The self-test is not decoration. Every custom rule this config carried was inert: 47
# `no-restricted-syntax` selectors named a rule oxlint does not implement, and the one rule it
# does implement was switched off everywhere by an `overrides` block. The job ran, read 40
# files, and reported nothing — on a tree with 21 hand-written hex colours in it. A lint is
# only checked by running it against something that should fail.
run = [
  "oxlint --config yidam/design/_adherence.oxlintrc.json --deny-warnings yidam/design",
  "bash scripts/design-lint-selftest.sh",
]

# ── coverage (#464) ───────────────────────────────────────────────────────
#
# 35,806 lines of Rust had no coverage measurement of any kind. What lands in the job summary
# is **diff coverage** — the lines a change added that no test executed — because that is the
# number that changes what somebody does. A repository-wide percentage does not, and a floor
# invites the ratchet-by-one-line game rather than a test. Nothing here fails a build on a
# number; RFC-0025 defers that decision until there is a month of data.
#
# The feature set is passed to the reporter and printed beside the number. It is not
# decoration: a pull request compiles the light default, so `--features index` files are not
# in the LCOV at all, and a report that treated "absent" as "zero" would call the whole index
# path untested. `ci-report` classifies every absence instead — gated, test-only, no coverable
# code, or unexplained — and only the last of those is a finding.

[tasks.coverage]
description = "Line coverage over the CLI workspace, as LCOV, under the light default build."
tools = { "github:taiki-e/cargo-llvm-cov" = "v0.9.0" }
# `--no-report` then `report`, rather than one command: the run and the rendering are
# separate so the same profile data can produce LCOV here and whatever P7 wants later.
run = [
  "cargo llvm-cov --no-report nextest --config-file .config/nextest.toml --manifest-path yidam/cli/Cargo.toml",
  "cargo llvm-cov report --lcov --output-path yidam/cli/target/coverage.lcov --manifest-path yidam/cli/Cargo.toml",
]

[tasks.coverage-full]
description = "Coverage including the feature-gated paths a pull request never compiles."
tools = { "github:taiki-e/cargo-llvm-cov" = "v0.9.0" }
# Where the gated files stop being unmeasured. This is the run whose number covers the index,
# sqlite and rdf paths, and it belongs beside `ci-cli-full` on main and the weekly schedule
# for the same reason that job does: protoc, an ONNX runtime, SQLite from source.
run = [
  "cargo llvm-cov --no-report nextest --config-file .config/nextest.toml --all-features --manifest-path yidam/cli/Cargo.toml",
  "cargo llvm-cov report --lcov --output-path yidam/cli/target/coverage-full.lcov --manifest-path yidam/cli/Cargo.toml --all-features",
]

# ── bootstrap harness (yidam/tests/harness/) ──────────────────────────────

[tasks.harness-test]
# Not "run scenarios against the judge rubric", which is what this said and never did: a
# scenario run invokes a model, and this task has never cost a penny. What it runs is the
# harness's own tests, including the baseline gate — recomputing the checks over committed
# result directories and failing if the verdicts have moved.
description = "Test the bootstrap harness, including drift against the committed baselines."
run = "cargo test --workspace --manifest-path yidam/tests/harness/Cargo.toml"

[tasks.harness-lint]
description = "Clippy on the bootstrap test harness."
run = "cargo clippy --workspace --manifest-path yidam/tests/harness/Cargo.toml -- -D warnings"

[tasks.harness-fmt]
description = "Format harness Rust code."
run = "cargo fmt --all --manifest-path yidam/tests/harness/Cargo.toml"

# ── clone / overlay (template scaffolding) ───────────────────────────────
# clone  — copies the full yidam template into a new directory and inits a
#           fresh git repo, ready for the bootstrap skill (empty-repo mode).
# overlay — copies only yidam infrastructure (yidam/, BOOTSTRAP.md, sadhana/,
#           samudaya/ if seeds present) into an existing git repo, without
#           touching the repo's own content, ready for existing-repo bootstrap.
#
# Usage:  mise run clone <target-directory>
#         mise run overlay <existing-repo-directory>

#
# Both depend on `yidam-build` because both are run BY the binary they are
# shipping. `_.path` above elects `.local/bin/yidam`, and nothing else here ever
# rebuilds it, so `mise run clone` executed whichever binary this tree was last
# built with — for one report, a four-day-old `0.3.0` scaffolding repositories
# out of `0.5.0` sources. The version is the visible half; the scaffolder was
# also missing its own later fixes to the template pin and to manifest parsing,
# and a clone is not a thing you re-run after noticing.

[tasks.clone]
description = "Scaffold a new yidam-derived repo at TARGET. Usage: mise run clone <target-dir>"
depends = ["yidam-build"]
run = "yidam clone"

[tasks.overlay]
description = "Overlay yidam infrastructure onto an existing repo. Usage: mise run overlay <repo-dir>"
depends = ["yidam-build"]
run = "yidam overlay"

# ── ci ────────────────────────────────────────────────────────────────────
# Yidam's own CI gate. Derived repos should extend this to include
# `lint`, `test`, and `build` once the domain computer crates are in place.

# `cargo nextest run` rather than `cargo test`, here and in every gate below. The reason is
# not speed: `cargo test` emits nothing a consumer can read, so 1,399 tests reported as a
# colored dot and nothing counted what was skipped (#462). nextest writes JUnit to
# `<target>/nextest/ci/junit.xml`, which `ci-report` renders into a job summary.
#
# `--config-file` on every invocation, because these are three separate cargo workspaces and
# nextest reads `.config/nextest.toml` from a workspace root. One config at the repository
# root, named explicitly, beats three copies drifting apart. `ci_reporting.rs` asserts every
# nextest line in this file passes it.
#
# `cargo test --doc` stays as its own step: **nextest does not run doctests.** A runner swap
# that silently stopped running a whole class of test would be this issue's own subject, one
# level up.
[tasks.ci-harness]
description = "CI for the harness workspace: fmt-check, clippy, test."
run = [
  "cargo fmt --all --manifest-path yidam/tests/harness/Cargo.toml -- --check",
  "cargo clippy --workspace --manifest-path yidam/tests/harness/Cargo.toml -- -D warnings",
  "cargo nextest run --config-file .config/nextest.toml --workspace --manifest-path yidam/tests/harness/Cargo.toml",
  "cargo test --doc --workspace --manifest-path yidam/tests/harness/Cargo.toml",
]

[tasks.ci-cli]
description = "CI for the yidam CLI workspace: fmt-check, clippy, test."
# --locked on the cargo invocations: without it, a Cargo.lock that disagrees with
# Cargo.toml is not a failure here — cargo silently REWRITES the lock in the working
# tree and carries on, so the gate goes green on a tree the release build refuses.
# The release workflow passes --locked (it must, or the artifact is not the thing the
# tagged commit describes), which made a stale lock a failed release rather than a
# failed test. Verified: bumping the version and leaving the lock behind passed
# `cargo test` and failed `cargo build --locked`.
#
# No test can cover this from inside `cargo test` — cargo has already fixed the lock
# by the time a test body reads it. The flag is the only place the check can live.
run = [
  "cargo fmt --all --manifest-path yidam/cli/Cargo.toml -- --check",
  # --all-targets: without it clippy skips tests/, and the integration tests here carry
  # real logic — link resolution, layout mapping, golden redaction. A lint that does not
  # read the tests is a lint that goes green while the tests rot.
  "cargo clippy --manifest-path yidam/cli/Cargo.toml --all-targets --locked -- -D warnings",
  "cargo nextest run --config-file .config/nextest.toml --manifest-path yidam/cli/Cargo.toml --locked",
  "cargo test --doc --manifest-path yidam/cli/Cargo.toml --locked",
]

# Full-feature CLI build (index/sqlite/rdf) — pulls fastembed/lancedb and needs
# protoc. Heavy: CI runs this only on main + a weekly schedule (see
# .github/workflows/ci.yml), not on every PR. `ci-cli` above builds the default
# set, which is also what the release publishes.
[tasks.ci-cli-full]
description = "Full-feature CI for the yidam CLI (all optional features, and the read-only vector build)."
# `--all-features` implies `vector-read` through `index`, so it proves that combination and
# not the one #442 created: a build with fastembed and arrow and NO lancedb. That build is the
# whole point of the split — it needs no protoc — and it would otherwise be the build nobody
# ever compiles, which is exactly the position the index path was in before RFC-0023.
#
# Defaults stay ON, because that is what the build actually is: `cargo install yidam --features
# vector-read` does not disable them. Testing `--no-default-features --features
# reports,vector-read` would be testing a configuration nobody installs, and it fails for
# reasons that have nothing to do with this feature — `help.rs` groups `tonpa` unconditionally.
# That argument now lives where a reader meets the flag, on the `reports` feature in
# yidam/cli/Cargo.toml; #482 was it being recorded only here, against an unrelated task.
#
# It runs first because it is the cheaper of the two and fails faster.
run = [
  "cargo fmt --all --manifest-path yidam/cli/Cargo.toml -- --check",
  "cargo clippy --manifest-path yidam/cli/Cargo.toml --features vector-read --locked -- -D warnings",
  "cargo nextest run --config-file .config/nextest.toml --manifest-path yidam/cli/Cargo.toml --features vector-read --locked",
  "cargo test --doc --manifest-path yidam/cli/Cargo.toml --features vector-read --locked",
  "cargo clippy --manifest-path yidam/cli/Cargo.toml --all-features --locked -- -D warnings",
  "cargo nextest run --config-file .config/nextest.toml --manifest-path yidam/cli/Cargo.toml --all-features --locked",
  "cargo test --doc --manifest-path yidam/cli/Cargo.toml --all-features --locked",
]

# #264: "Run it in CI against `examples/streamflow`." Which needs the full build, because
# `bench` refuses to measure against keyword search — so this cannot live in the light gate
# and runs where `cli-full` runs: main push and the weekly schedule, not on pull requests.
#
# The regression guard it provides is real but narrow, and #261 has since landed. What it
# catches is the goal set and the corpus drifting apart, retrieval breaking outright, and the
# example losing its index.
#
# It still ratchets nothing, and that is now a stated scope rather than a pending one: this
# arm needs a vector index and an embedding run, and whether an ANN search over embedded
# prose reproduces closely enough to hold a baseline is a question #468 did not measure.
# Guessing a tolerance for it would be inventing the number instead of finding it.
#
# The arm that *is* ratcheted is `--scaling`, by `bench_baseline.rs` in the `ci (cli)` gate —
# it is deterministic, so the baseline is exact and the diff is the review.
[tasks.bench-example]
description = "Run `yidam bench` against examples/streamflow, with a real index (needs --features index)."
run = [
  "cargo build --manifest-path yidam/cli/Cargo.toml --features index --locked",
  "bash scripts/bench-example.sh",
]

# `--scaling` generates its corpora in memory and has no retrieval arm, so it needs neither
# the index feature nor a corpus — which is why this one *can* run on every pull request.
# Its numbers are ratcheted by `bench_baseline.rs`, which runs the same binary over the same
# committed config inside `ci (cli)` and compares against `tests/goldens/bench/scaling.json`.
# This job remains because the two answer different questions: the test asks whether the
# numbers moved, and this prints the table a reader actually reads.
[tasks.bench-scaling]
description = "Run `yidam bench --scaling` over generated corpora."
run = [
  "cargo build --manifest-path yidam/cli/Cargo.toml --locked",
  "yidam/cli/target/debug/yidam bench --scaling",
]

# ── mutation testing (#468) ───────────────────────────────────────────────
#
# The check this repository has been performing by hand. RFC-0024 prescribes it per call site
# — "delete the guard, keep the comment, confirm red" — and every phase of #459 has done it by
# remembering to. This catches the ones nobody thought to do.
#
# **It mutates your working tree.** cargo-mutants copies the package directory and builds the
# copy; `yidam/cli` dev-depends on `../tests/harness/ci-report`, which is outside that
# directory, so the copy cannot resolve it and the baseline build fails before any mutant runs.
# `--in-place` is the way around that, and the cost is real: interrupt this and a source file
# is left holding a mutant. `git status` will show it and `git checkout --` on that one path
# restores it — but commit your work first, because that command takes uncommitted edits with
# it.
#
# `NEXTEST_PROFILE=default` because mise sets it to `ci` globally and the config defining that
# profile is only found through the explicit `--config-file` every gate passes. cargo-mutants
# builds its baseline with its own command line and never sees the flag.
#
# Scoped, and by a measured cost rather than a guess: one mutant is roughly 80 seconds here,
# and `cmd/lint/` alone holds 586 of them.
[tasks.mutants]
description = "Mutate the rule-bearing modules and report which mutants no test caught."
tools = { "cargo:cargo-mutants" = "25.3.1" }
run = """
env NEXTEST_PROFILE=default cargo mutants \
  --manifest-path yidam/cli/Cargo.toml \
  --cargo-arg=--locked \
  --in-place \
  --test-tool nextest \
  --timeout 300 \
  --file src/vault/policy.rs \
  --file src/cmd/lint/commits.rs
"""

# The editor client. Not a cargo workspace, so it is not in the `ci` composite below —
# `mise run ci` is the Rust gate and stays fast. CI runs this as its own job.
#
# `//yidam/editors/vscode:ci` would be the natural spelling, but this repo is not in mise
# monorepo mode: the subproject mise.toml files exist for local use inside a directory,
# and the root defines the CI entry points. Keeping both in step is why this duplicates
# the subproject's task rather than delegating to it.
[tasks.ci-vscode]
description = "CI for the VS Code extension: compile (src + tests), lint, unit tests."
dir = "yidam/editors/vscode"
run = [
  "npm run compile",
  "npm run lint",
  "npm run test:unit",
]

# The packaging gate. Not in `ci-vscode`: it needs `out/` built and it runs vsce, which
# is a minute this repository's PR loop should not spend on every editor change. The
# publish workflow runs it, which is where a wrong package would actually reach someone.
#
# It is a task rather than a step inside that workflow so that the thing CI does and the
# thing a person can do before tagging are one command. `release.sh` exists for the same
# reason one layer up.
[tasks.ext-package]
description = "Package the VS Code extension and assert the .vsix holds the runtime set and nothing else."
dir = "yidam/editors/vscode"
run = "npm run package"

# ── running the extension by hand ─────────────────────────────────────
# 143 unit tests cover the logic that does not need an editor, which is the
# deliberate architecture. What they cannot reach is the part a person has to
# look at: five tree views, the status bar, the SCM box, claim decoration, and a
# webview. Until these tasks existed, looking at it meant working out the
# incantation, and the extension activates on `workspaceContains:.yidam.toml` or
# `.yidam/**` — which this repository does not have, so there was nothing here to
# launch it against either.

[tasks.ext-fixture]
description = "Stage the reports fixture as a real repository at .local/ext-fixture, to run the extension against."
dir = "yidam/editors/vscode"
# The same corpus the goldens and the extension's tests assert against, staged
# through the same `stage.toml` they read — so what you see by hand and what CI
# checks are one repository rather than two that drift.
run = "node --experimental-strip-types scripts/stage-fixture.ts"

[tasks.ext-dev]
description = "Compile the extension, stage the fixture, and open both in an Extension Development Host."
depends = ["ext-fixture"]
run = """
set -eu
cd yidam/editors/vscode && npm run compile && cd -
code="${YIDAM_CODE:-code}"
if ! command -v "$code" >/dev/null 2>&1; then
  echo "ERROR: '$code' is not on PATH." >&2
  echo "       Set YIDAM_CODE to your editor's CLI, or install the shell command" >&2
  echo "       (VS Code: Command Palette → 'Shell Command: Install code command in PATH')." >&2
  exit 1
fi
"$code" --extensionDevelopmentPath="$PWD/yidam/editors/vscode" "$PWD/.local/ext-fixture"
"""

# Composite for local use (`mise run ci`); CI runs ci-harness and ci-cli as
# separate parallel jobs (see .github/workflows/ci.yml).
# ── release ───────────────────────────────────────────────────────────────
# Cutting a release is order-dependent and the order is not visible from a
# shell about to run `git tag`. ./release.sh does the ordering rather than
# describing it; VERSIONING.md still explains why the layers are separate.

[tasks.release]
description = "Cut a release tag for one layer, checking its preconditions. Usage: mise run release <layer> <version> [--dry-run]"
run = "./release.sh"

[tasks.ci]
description = "Full CI pass: harness + yidam CLI fmt-check, clippy, and test."
depends = ["ci-harness", "ci-cli"]

# ── docs site (yidam/web/docs/) ───────────────────────────────────────────
# Astro/Starlight docs server. Content is loaded live from docs/ at the repo
# root; restart dev when docs/ files change (hot-reload is not wired for
# out-of-project paths).
#
# Published by .github/workflows/docs.yml at https://goedelsoup.github.io/yidam/.
# That subpath is `base` in astro.config.mjs, so it is in the local URLs below
# too: serving the site at a different prefix than it ships at would hide every
# link the base affects until it was live.

[tasks.docs-install]
description = "Install docs site dependencies (run once after clone)."
run = "npm install --prefix yidam/web/docs"

[tasks.docs-dev]
description = "Start the docs dev server on http://localhost:4321/yidam/."
run = "npm run --prefix yidam/web/docs dev -- --port 4321"

# The quality pages, built and read back (#467).
#
# Everything else about that phase is asserted on the model, and none of it can catch a
# template that is handed `asserted: 0` and draws a green bar anyway. This builds the site
# twice — once against `ci-report`'s committed golden, once with no report at all — and reads
# the emitted HTML. Two builds rather than one, into directories of their own, so a render
# against a fixture can never become the thing that deploys.
#
# It found the two bugs it was written for on its first run: an overview page reading
# "3 ignored test s", and a no-report state that had never been rendered.
[tasks.docs-test]
description = "Build the quality pages against a fixture report and assert on the HTML."
# `package.json`'s `test` script, for the reason `docs-build` calls `build`: docs.yml carries
# no mise, so the workflow and the terminal have to reach the same command by two routes, and
# the npm script is the one they can both name.
run = "npm run --prefix yidam/web/docs test"

[tasks.docs-build]
description = "Build the docs site to yidam/web/docs/dist/."
run = "npm run --prefix yidam/web/docs build"

[tasks.docs-preview]
description = "Preview the production docs build locally."
run = "npm run --prefix yidam/web/docs preview"
